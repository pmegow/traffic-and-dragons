# Engine test gate (ChatGPT review 2026-08-01, finding 5) — the 951-assertion suite plus all
# source contracts ran only via the local pre-commit hook, which --no-verify (or a different
# machine) bypasses. This makes the same `node dev/run-tests.js` an unbypassable check on every
# push and PR. No npm install: the project has zero dependencies by design.
#
# Audit G1 (2026-09-18): for a year this ran ONE of the five gates the hook runs — the other four,
# including the APP_VERSION/CACHE freshness check that enforces the bump-on-every-change hard
# rule, never made the crossing. They are below now, and dev/check-enforcement.js DERIVES the
# requirement from dev/pre-commit (every dev/<tool>.js the hook invokes must appear here, bar one
# reasoned exemption), so the gap cannot silently reopen.
name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history (audit G1). #312 needed only HEAD~1 (run-sabotage-diff, and now the
          # lint-todo + check-shell-markers range gates), but dev/tests-todo-hygiene.js reads its
          # pre-move TODO.md fixture straight out of real history (93c182f^, blob 809c9fa) and
          # asserts the blob hash — a depth-2 checkout cannot see it and the suite would abort on
          # fixture setup. The pack is ~30 MiB, so the full clone costs seconds.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # #481 G2: ONE range per run, computed at one boundary (dev/ci-range.js): a PR's base.sha; a push's event.before
      # via merge-base; else the merge-base with origin/master; else HEAD~1. Every range gate below reads $CI_RANGE —
      # they used to diff HEAD~1..HEAD, so a code commit pushed under a docs commit skipped them all.
      - name: Compute the range this run checks
        run: node dev/ci-range.js --github-env
      # #481 G6: the identity tripwire the hook runs for the committer, here over every pushed commit's author and
      # committer — cloud sessions commit with no hook at all (a leaked fixture identity once misattributed 39 commits).
      - name: No commit in the push carries a test-fixture identity
        run: node dev/check-identity.js --ci "$CI_RANGE"
      # ── the hook's other gates, which run before the suite locally too (audit G1) ────────
      # check-hook-parity is deliberately NOT here: it compares the INSTALLED .git hook, which a
      # CI checkout does not have. That is the one entry in check-enforcement.js's HOOK_ONLY.
      # lint-todo in CI has no index to read, so it verifies each commit's TODO.md against its
      # parent's (shape, the #310 row-size cap, the moved-row bytes) — PER COMMIT of the range
      # (#481 G2); a commit whose parent has no TODO.md is skipped out loud.
      - name: TODO.md table integrity, every commit of the push (shape, row cap, moved-row bytes)
        run: node dev/ci-per-commit.js "$CI_RANGE" -- node dev/lint-todo.js --git-aware --cap --file {file:TODO.md} --head-file {parentFile:TODO.md}
      - name: TODO/session hygiene acceptance fixtures
        run: node dev/tests-todo-hygiene.js
      # #481 G10: the ES5-only rule used to live in the editor hooks alone, so a shell edit, a cloud
      # session or a hand edit shipped unchecked. Same lexer the hook and the editor hooks use.
      - name: ES5 check for the game client
        run: node dev/check-es5.js
      # The hard rule: a change to sw.js or any APP_SHELL asset bumps globals.js APP_VERSION and
      # sw.js CACHE — on EVERY commit (#481 G2), each compared with its parent (the hook's
      # staging-area mode has no meaning on a runner).
      - name: APP_VERSION / CACHE freshness for shell assets, every commit of the push
        run: node dev/ci-per-commit.js "$CI_RANGE" -- node dev/check-shell-markers.js --ci --range {parent}..{commit}
      - name: Run engine suite + source contracts
        run: node dev/run-tests.js
      - name: Verify every retained sabotage target still applies
        run: node dev/check-sabotage-applicability.js
      - name: Replay v1238 against its committed end state
        run: node dev/diff-replay.js dev/corpus_playtest_v1238.json --check
      - name: Replay v1258 against its committed end state
        run: node dev/diff-replay.js dev/corpus_playtest_v1258.json --check
      - name: Replay v1271 against its committed end state
        run: node dev/diff-replay.js dev/corpus_playtest_v1271.json --check
      - name: Replay v1276 against its committed end state
        run: node dev/diff-replay.js dev/corpus_playtest_v1276.json --check
      # #170 + owner ruling 2026-08-13: CI proves the drift guards, not just the tests. The focused
      # battery mutates each guarded branch and requires the NAMED test to fail (mustFail
      # attribution — an unrelated red is MISATTRIBUTED, not a pass). ~2 min locally (the "~9s" the
      # comment used to claim was never re-measured — #312). The
      # full-suite-per-mutation groups stay manual by the same ruling.
      - name: Prove drift guards (focused sabotage battery)
        run: node dev/sabotage-w2.js --focused
      # #472: the blueprint browser batteries drive the runner's own Chrome through dev/cdp-browser.js (no
      # Playwright, no npm install). Prove it launches first, so a missing or broken Chrome fails HERE by name —
      # the batteries themselves only skip (loudly) on a machine without Chrome, which a runner must never be.
      - name: Chrome launches for the browser sabotage batteries
        run: node dev/cdp-browser.js --check
      # #481 G6: the three blueprint browser suites gate on their own — they used to run only when a sabotage battery
      # happened to call them, so a red one could sit unseen for weeks.
      - name: Blueprint catalog in a real browser
        run: node dev/tests-blueprint-catalog-browser.js
      - name: Blueprint editions in a real browser
        run: node dev/tests-blueprint-editions-browser.js
      - name: Blueprint publication in a real browser
        run: node dev/tests-blueprint-publish-browser.js
      # #312 ①: a battery whose target file changed in this push runs in this push (the weekly
      # job proves all 63; this keeps a guard's own edit honest the day it lands). #481 G2: the
      # WHOLE push's range, once — not just its last commit.
      - name: Run the sabotage batteries whose targets this change touched
        run: node dev/run-sabotage-diff.js "$CI_RANGE"
