# Engine test gate (ChatGPT review 2026-08-01, finding 5) — the 951-assertion suite plus all
# source contracts ran only via the local pre-commit hook, which --no-verify (or a different
# machine) bypasses. This makes the same `node dev/run-tests.js` an unbypassable check on every
# push and PR. No npm install: the project has zero dependencies by design.
name: Engine tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run engine suite + source contracts
        run: node dev/run-tests.js
