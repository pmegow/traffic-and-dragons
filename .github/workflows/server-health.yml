# Server uptime monitor (TODO #25) — born from the 2026-07-03 dead-Fly-host incident,
# which was invisible from inside the app (requests hung with no error) for ~20 turns.
# Pings /health every 15 minutes; 3 attempts over ~1 minute absorb cold-start wake time
# (the Fly machine auto-stops when idle) and single network blips. A failed run makes the
# workflow fail, and GitHub emails the workflow's author — that's the alert channel, no
# external accounts needed. Run it manually anytime via the Actions tab (workflow_dispatch).
name: Server health check
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (3 attempts)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 25 https://traffic-and-dragons-server.fly.dev/health; then
              echo ""
              echo "healthy on attempt $i"
              exit 0
            fi
            echo "attempt $i failed"
            sleep 20
          done
          echo "SERVER HEALTH CHECK FAILED — 3 attempts over ~1 minute."
          echo "Likely a dead/hung Fly machine. Recovery runbook: TODO.md item 26 (snapshot -> volume -> deploy)."
          exit 1
