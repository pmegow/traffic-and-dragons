# Weekly mutation proof (#312 ①): every dev/sabotage-*.js battery, not just the one focused w2
# group the commit gate runs. Each battery mutates a guarded branch and requires the NAMED test to
# fail; the runner treats a non-zero exit, a misattributed red, or a no-byte mutation as a failure.
# Slow by design (a full-suite run per mutation, ~40–60 min across 63 batteries) — hence weekly.
name: Sabotage (all batteries, weekly)
on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC
  workflow_dispatch:
jobs:
  sabotage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run every sabotage battery
        run: node dev/run-sabotage-all.js | tee -a "$GITHUB_STEP_SUMMARY"
