<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../website/game-theme.js"></script>
<title>Dice review</title>
<!-- dev/dice-review.html — every roll clip (#650 the d20, #653 the damage dice) on one page, for the owner's eye: each
     die's set from dice/manifest.json (one set per die under `dice`) with seeds and turn counts, play-all, a light/dark
     ground to judge the shadow, and the measured REST BOX of each clip drawn over it (the window the composited damage
     roll crops to — DICE_TILE_REST in helpers.js is the centre of these). A dev page: served network-first, no palette
     contract, no game code. Shows the VP9 WebM — Chrome, Edge or Firefox; WebKit would show a black box (the game
     recombines the stacked MP4 for it, this page does not). -->
<link rel="stylesheet" href="../satellite.css">
<style>
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg0);color:var(--t0);transition:background .2s}
  body.light .frame{background:#f1ead9}
  header{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--bg1);backdrop-filter:blur(4px);z-index:2}
  button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--brd2);background:transparent;color:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)}
  h2{margin:18px 16px 0;font-size:16px;font-weight:600;opacity:.9}
  h2 span{font-weight:400;opacity:.7;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;padding:14px}
  .card{display:flex;flex-direction:column;gap:4px}
  .frame{position:relative;aspect-ratio:2/1}
  .frame video{width:100%;height:100%;display:block;cursor:pointer}
  .rest{position:absolute;border:1px dashed rgba(232,163,61,.7);pointer-events:none;display:none}
  body.boxes .rest{display:block}
  .lbl{display:flex;justify-content:space-between;font-size:13px;opacity:.85;padding:0 2px}
  .lbl b{font-size:16px}
  .warn{color:var(--warn)}
  #status{opacity:.7;margin-left:auto}
</style>
</head>
<body>
<header>
  <button id="play">Play all</button>
  <button id="restart">Restart all</button>
  <button id="ground">Light ground</button>
  <button id="boxes">Rest boxes</button>
  <label><input type="checkbox" id="loop" checked> loop</label>
  <span id="status">loading manifest…</span>
</header>
<div id="sets"></div>
<script src="../dice/manifest.js"></script>
<script>
(function(){
  var sets=document.getElementById("sets"),status=document.getElementById("status"),vids=[];
  function pad(n){return (n<10?"0":"")+n;}
  function kb(n){return Math.round(n/1024)+" KB";}
  function card(grid,key,n,c,minTurns){
    var d=document.createElement("div");d.className="card";
    var fr=document.createElement("div");fr.className="frame";
    var v=document.createElement("video");v.src="../dice/"+key+"_"+pad(n)+".webm";v.muted=true;v.loop=true;v.playsInline=true;v.preload="metadata";v.title="click: play / pause";
    v.onclick=function(){if(v.paused)v.play();else v.pause();};
    fr.appendChild(v);
    if(c&&c.rest){var b=document.createElement("div");b.className="rest";b.style.left=(c.rest[0]*100)+"%";b.style.top=(c.rest[1]*100)+"%";b.style.width=((c.rest[2]-c.rest[0])*100)+"%";b.style.height=((c.rest[3]-c.rest[1])*100)+"%";fr.appendChild(b);}
    var l=document.createElement("div");l.className="lbl";
    var turns=c&&c.turns!=null?c.turns.toFixed(1)+" turns":"turns unknown";
    l.innerHTML="<b>"+n+"</b><span"+(c&&c.turns!=null&&c.turns<minTurns?" class='warn'":"")+">"+turns+"</span><span>"+(c?"seed "+c.seed+" · "+kb(c.webm):"not in manifest")+"</span>";
    d.appendChild(fr);d.appendChild(l);grid.appendChild(d);vids.push(v);
  }
  function show(m){
    var dice=m.dice||{},keys=Object.keys(dice).sort(function(a,b){return Number(a.slice(1))-Number(b.slice(1));}),count=0;
    keys.forEach(function(key){
      var set=dice[key],sides=Number(key.slice(1)),h=document.createElement("h2");
      h.innerHTML=key+"<span>"+Object.keys(set.clips||{}).length+" of "+sides+" faces · rendered "+(set.rendered||"?")+" · "+set.frames+" frames at "+set.fps+" fps</span>";
      sets.appendChild(h);
      var grid=document.createElement("div");grid.className="grid";sets.appendChild(grid);
      for(var n=1;n<=sides;n++){card(grid,key,n,set.clips&&set.clips[pad(n)],sides===20?1.5:0.5);count++;}
    });
    status.textContent=keys.length+" dice, "+count+" clips · manifest "+(m.rendered||"?");
  }
  // dice/manifest.js (written by the batch beside manifest.json) loads from disk and from the site alike;
  // a page opened from file:// cannot fetch(), which is how the owner first opened it (2026-10-21)
  if(typeof DICE_MANIFEST!=="undefined")show(DICE_MANIFEST);
  else fetch("../dice/manifest.json?t="+Date.now()).then(function(r){return r.json();}).then(show)
    .catch(function(e){status.textContent="manifest failed: "+e+" — run the batch (it writes dice/manifest.js) or open the page from the site";status.className="warn";});
  document.getElementById("play").onclick=function(){vids.forEach(function(v){v.play();});};
  document.getElementById("restart").onclick=function(){vids.forEach(function(v){v.currentTime=0;v.play();});};
  document.getElementById("loop").onchange=function(e){vids.forEach(function(v){v.loop=e.target.checked;});};
  document.getElementById("ground").onclick=function(){var light=document.body.classList.toggle("light");this.textContent=light?"Dark ground":"Light ground";};
  document.getElementById("boxes").onclick=function(){document.body.classList.toggle("boxes");};
})();
</script>
</body>
</html>
