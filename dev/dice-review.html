<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../website/game-theme.js"></script>
<title>Dice review</title>
<!-- dev/dice-review.html — every roll clip (#650 the d20, #653 the damage dice) on one page, for the owner's eye: each
     die's set from dice/manifest.json (one set per die under `dice`) with seeds and turn counts, play-all, a light/dark
     ground to judge the shadow, and the measured REST BOX of each clip drawn over it (the window the composited damage
     roll crops to — DICE_TILE_REST in helpers.js is the centre of these). A dev page: served network-first, no palette
     contract. Shows the VP9 WebM — Chrome, Edge or Firefox; WebKit would show a black box (the game recombines the
     stacked MP4 for it, this page does not).
     THE SOUND (#659, owner 2026-10-23: "to test the dice sound I need to hunt around in a game and FIND combat"): the
     clip you click plays its roll through the game's dice-sound.js over sound.js — the same plan the game makes: the take
     of the CC0 dice sprite (dice/sfx/) nearest the clip's measured motion, started so its recorded landing falls on the
     clip's — forced past the UI-sound setting (an audition). Each card names the take its plan picks. The sprite is
     preloaded from this folder (a file:// page cannot fetch it — the status says so) on a throwaway offline context, so
     the LIVE context is born in your first click — a context made before a gesture sits suspended under the autoplay
     policy and every click is silent (v1.1314 did that); a context found suspended is resumed inside the click before the
     roll plays, and a click that still cannot sound names the context's state. Play all stays silent: sixty dice
     at once is noise. A loop re-sounds each pass. The game's mute (#657) still applies and the status line says so, so a
     silent click never reads as broken. -->
<link rel="stylesheet" href="../satellite.css">
<style>
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg0);color:var(--t0);transition:background .2s}
  body.light .frame{background:#f1ead9}
  header{position:sticky;top:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--bg1);backdrop-filter:blur(4px);z-index:2}
  button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--brd2);background:transparent;color:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)}
  h2{margin:18px 16px 0;font-size:16px;font-weight:600;opacity:.9}
  h2 span{font-weight:400;opacity:.7;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;padding:14px}
  .card{display:flex;flex-direction:column;gap:4px}
  .frame{position:relative;aspect-ratio:2/1}
  .frame video{width:100%;height:100%;display:block;cursor:pointer}
  .rest{position:absolute;border:1px dashed rgba(232,163,61,.7);pointer-events:none;display:none}
  body.boxes .rest{display:block}
  .lbl{display:flex;justify-content:space-between;font-size:13px;opacity:.85;padding:0 2px}
  .lbl b{font-size:16px}
  .warn{color:var(--warn)}
  #status{opacity:.7;margin-left:auto}
</style>
</head>
<body>
<header>
  <button id="play">Play all</button>
  <button id="restart">Restart all</button>
  <button id="ground">Light ground</button>
  <button id="boxes">Rest boxes</button>
  <label><input type="checkbox" id="loop" checked> loop</label>
  <label title="The clip you click plays its roll's sound — the game's own recipe from the manifest's hits and rolling stretches. Play all stays silent."><input type="checkbox" id="sound" checked> sound</label>
  <span id="status">loading manifest…</span>
</header>
<div id="sets"></div>
<script src="../dice/manifest.js"></script>
<script src="../dice/sfx/manifest.js"></script>
<script src="../audio-master.js"></script>
<script src="../sound.js"></script>
<script src="../dice-sound.js"></script>
<script>
(function(){
  var sets=document.getElementById("sets"),status=document.getElementById("status"),vids=[],soundBox=document.getElementById("sound"),loopBox=document.getElementById("loop");
  function pad(n){return (n<10?"0":"")+n;}
  function kb(n){return Math.round(n/1024)+" KB";}
  function soundOn(){return !!(soundBox.checked&&typeof DiceSound!=="undefined");}
  /* the clip's own roll, forced past the UI-sound setting (an audition); a mute in the game still silences it — said in the status */
  /* the live context: made or resumed INSIDE the click (synchronously, so the gesture covers it); null without WebAudio */
  function unlock(){if(!soundOn()||typeof Sound==="undefined"||typeof Sound.context!=="function")return null;var ctx=Sound.context();if(ctx&&ctx.state!=="running"&&typeof ctx.resume==="function"){try{ctx.resume();}catch(e){}}return ctx;}
  function sound(v,sides,n){if(!soundOn())return;var ctx=unlock();
    function go(){var ok=DiceSound.play(sides,n,0,true);if(!ok)note("no sound for d"+sides+" "+n+" — "+(typeof AudioMaster!=="undefined"&&AudioMaster.muted()?"the game is MUTED (unmute it there)":"AudioContext "+(ctx?ctx.state:"missing")+" · sprite "+DiceSound.state()+" — see the console"));}
    /* a context still waking from suspended plays after its resume resolves, not before — Sound.play refuses a context that is not running */
    if(ctx&&ctx.state!=="running"&&typeof ctx.resume==="function")ctx.resume().then(go,function(e){note("audio refused for d"+sides+" "+n+": "+(e&&e.message||e));});else go();}
  /* with sound on a clip restarts by hand so every pass sounds again (a native loop restarts without an event) */
  function applyLoop(v){v.loop=loopBox.checked&&!soundOn();}
  var _noteBase="";function note(s){status.textContent=_noteBase+(s?" · "+s:"");}
  function card(grid,key,n,c,minTurns){
    var sides=Number(key.slice(1));
    var d=document.createElement("div");d.className="card";
    var fr=document.createElement("div");fr.className="frame";
    var v=document.createElement("video");v.src="../dice/"+key+"_"+pad(n)+".webm";v.muted=true;v.playsInline=true;v.preload="metadata";v.title="click: play / pause (with its sound)";applyLoop(v);
    function start(){v.currentTime=0;var p=v.play();if(p&&typeof p.then==="function")p.then(function(){sound(v,sides,n);},function(e){note("d"+sides+" "+n+" would not play: "+(e&&e.message||e));});}
    v.onclick=function(){if(v.paused){unlock();start();}else v.pause();};
    v.onended=function(){if(loopBox.checked&&soundOn())start();};
    fr.appendChild(v);
    if(c&&c.rest){var b=document.createElement("div");b.className="rest";b.style.left=(c.rest[0]*100)+"%";b.style.top=(c.rest[1]*100)+"%";b.style.width=((c.rest[2]-c.rest[0])*100)+"%";b.style.height=((c.rest[3]-c.rest[1])*100)+"%";fr.appendChild(b);}
    var l=document.createElement("div");l.className="lbl";
    var turns=c&&c.turns!=null?c.turns.toFixed(1)+" turns":"turns unknown";
    var cues=c&&c.hits?c.hits.length+" hit"+(c.hits.length===1?"":"s")+(c.roll&&c.roll.length?" · rolls "+c.roll.map(function(r){return r[0].toFixed(1)+"–"+r[1].toFixed(1)+"s";}).join(", "):""):"unmeasured";
    var plan=(typeof DiceSound!=="undefined")?DiceSound.plan(sides,n,0):null;cues+=plan?" · take "+(plan.take+1)+" at "+plan.at.toFixed(2)+"s":" · no take";
    l.innerHTML="<b>"+n+"</b><span"+(c&&c.turns!=null&&c.turns<minTurns?" class='warn'":"")+">"+turns+"</span><span title='the measured motion the sound is built from'>"+cues+"</span><span>"+(c?"seed "+c.seed+" · "+kb(c.webm):"not in manifest")+"</span>";
    d.appendChild(fr);d.appendChild(l);grid.appendChild(d);vids.push(v);
  }
  function show(m){
    var dice=m.dice||{},keys=Object.keys(dice).sort(function(a,b){return Number(a.slice(1))-Number(b.slice(1));}),count=0;
    keys.forEach(function(key){
      var set=dice[key],sides=Number(key.slice(1)),h=document.createElement("h2");
      h.innerHTML=key+"<span>"+Object.keys(set.clips||{}).length+" of "+sides+" faces · rendered "+(set.rendered||"?")+" · "+set.frames+" frames at "+set.fps+" fps</span>";
      sets.appendChild(h);
      var grid=document.createElement("div");grid.className="grid";sets.appendChild(grid);
      for(var n=1;n<=sides;n++){card(grid,key,n,set.clips&&set.clips[pad(n)],sides===20?1.5:0.5);count++;}
    });
    _noteBase=keys.length+" dice, "+count+" clips · manifest "+(m.rendered||"?")+" · sound: click a clip (Play all stays silent)";
    note(typeof AudioMaster!=="undefined"&&AudioMaster.muted()?"the game is MUTED — unmute it there to hear the rolls":"");
    /* the sprite decodes now, from this folder; a page opened from file:// cannot fetch it and the status says so */
    if(typeof DiceSound!=="undefined")DiceSound.preload({base:"../"}).then(function(ok){note(ok?"dice sprite loaded ("+(typeof DICE_SFX!=="undefined"?DICE_SFX.file:"?")+")":"dice sprite NOT loaded — "+DiceSound.state()+" (serve the page over http; file:// cannot fetch)");});
  }
  // dice/manifest.js (written by the batch beside manifest.json) loads from disk and from the site alike;
  // a page opened from file:// cannot fetch(), which is how the owner first opened it (2026-10-21)
  if(typeof DICE_MANIFEST!=="undefined")show(DICE_MANIFEST);
  else fetch("../dice/manifest.json?t="+Date.now()).then(function(r){return r.json();}).then(show)
    .catch(function(e){status.textContent="manifest failed: "+e+" — run the batch (it writes dice/manifest.js) or open the page from the site";status.className="warn";});
  document.getElementById("play").onclick=function(){vids.forEach(function(v){v.play();});};/* silent on purpose: sixty rolls at once */
  document.getElementById("restart").onclick=function(){vids.forEach(function(v){v.currentTime=0;v.play();});};
  loopBox.onchange=function(){vids.forEach(applyLoop);};
  soundBox.onchange=function(){vids.forEach(applyLoop);};
  document.getElementById("ground").onclick=function(){var light=document.body.classList.toggle("light");this.textContent=light?"Dark ground":"Light ground";};
  document.getElementById("boxes").onclick=function(){document.body.classList.toggle("boxes");};
})();
</script>
</body>
</html>
