<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>T&D — TODO</title>
  <link rel="stylesheet" href="satellite.css">
<style>
  /* #312 ②: tokens come from satellite.css (linked in <head>) — one palette for every satellite; page rules below */
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg0);color:var(--t0);font-family:Georgia,serif;padding:24px;max-width:1400px;margin:0 auto;font-size:14px;line-height:1.6;}
    h1{color:var(--acc);font-size:20px;margin-bottom:4px;}
    h2{color:var(--acc);font-size:15px;margin:28px 0 10px;border-bottom:1px solid var(--brd);padding-bottom:6px;}
    h3{color:var(--t1);font-size:13px;margin:16px 0 6px;}
    p{color:var(--t1);margin-bottom:10px;}
    a{color:var(--acc);}
    table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:13px;}
    th{text-align:left;color:var(--t2);font-size:11px;padding:6px 10px;border-bottom:1px solid var(--brd);font-weight:normal;text-transform:uppercase;letter-spacing:.06em;}
    td{padding:7px 10px;border-bottom:1px solid var(--brd);vertical-align:top;color:var(--t1);}
    tr:hover td{background:var(--bg2);}
    .done td{opacity:0.5;}
    .done td:nth-child(2){text-decoration:line-through;color:var(--t2);}
    code{font-family:monospace;font-size:12px;background:var(--bg3);padding:1px 4px;border-radius:3px;color:var(--acc);}
    ul,ol{padding-left:20px;margin-bottom:10px;color:var(--t1);}
    li{margin-bottom:4px;}
    strong{color:var(--t0);}
    .legend{font-size:11px;color:var(--t2);margin-left:12px;letter-spacing:.02em;}
    .status{font-size:11px;color:var(--t2);overflow-wrap:break-word;word-break:break-word;}
    .status.sdone{color:var(--grn);}
    .status.slow{color:var(--t2);}
    #load-btn{padding:10px 24px;font-family:Georgia,serif;font-size:13px;background:var(--acc);color:#000;border:none;border-radius:4px;cursor:pointer;}
    #load-btn:hover{opacity:.85;}
    #reopen-btn{display:block;margin:12px auto 0;padding:10px 24px;font-family:Georgia,serif;font-size:13px;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:4px;cursor:pointer;}
    #reopen-btn:hover{background:rgba(200,146,42,.12);}
    #drop-zone{border:2px dashed var(--brd2);border-radius:8px;padding:40px;text-align:center;color:var(--t2);font-size:13px;margin-top:32px;}
    #drop-zone.over{border-color:var(--acc);color:var(--acc);}
    hr{border:none;border-top:1px solid var(--brd);margin:20px 0;}
    blockquote{border-left:3px solid var(--acc);padding-left:12px;color:var(--t2);font-style:italic;margin:10px 0;}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
    .toolbar-right{display:flex;gap:8px;flex-wrap:wrap;}
    .tbtn{padding:7px 14px;font-family:Georgia,serif;font-size:12px;background:var(--bg2);color:var(--t1);border:1px solid var(--brd2);border-radius:4px;cursor:pointer;}
    .tbtn:hover{border-color:var(--acc);color:var(--acc);}
    .tbtn.danger:hover{border-color:var(--red);color:var(--red);}
    .tbtn.accent{background:var(--acc);color:#000;border-color:var(--acc);}
    .tbtn.accent:hover{opacity:.85;color:#000;}
    .num-cell{color:var(--t2);width:36px;font-size:12px;}
    /* Status glyph — read-only (#481 G3: the viewer never writes; it used to be a click-to-cycle toggle) */
    .dot{font-size:13px;line-height:1;color:var(--brd2);}
    .dot.part{color:var(--t1);}
    .dot.rtt{color:var(--acc);}
    .dot.done{color:var(--grn);}
    .task-cell-inner{display:flex;align-items:flex-start;gap:10px;}
    .task-cell-inner .task-body{flex:1;min-width:0;}
    /* Per-item collapse — arrow spacing/size echoes the main section toggles */
    .task-arr{cursor:pointer;color:var(--acc);font-size:10px;flex-shrink:0;line-height:1.7;user-select:none;transition:transform .15s;}
    .task-arr.open{transform:rotate(90deg);}
    .task-head{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .task-head:hover{color:var(--t0);}
    .check-cell{width:22px;padding:7px 2px;text-align:center;}
    /* Ready to test row */
    tr.rtt td{background:rgba(200,146,42,.07);}
    tr.rtt:hover td{background:rgba(200,146,42,.14);}
    /* v0.6: no Status column — the dot carries the state; an expanded row shows the status text under its task */
    .task-status{display:block;margin-top:8px;padding-top:6px;border-top:1px solid var(--brd);}
    /* Lock task column — don't let it shrink */
    td.task-td,th.task-th{min-width:400px;}
    .task-table{table-layout:fixed;width:100%;}
    /* Effort column */
    th.effort-th{width:58px;text-align:center;}
    td.effort-td{width:58px;text-align:center;}
    .eff{font-size:11px;font-weight:bold;letter-spacing:.04em;}
    .eff-none{color:var(--t2);font-weight:normal;}
    .eff-S{color:var(--t2);}
    .eff-M{color:var(--t1);}
    .eff-L{color:var(--acc);}
    .eff-XL{color:#c87a4a;}
    /* Tier column (which model the task needs — Fable/Opus/Sonnet/Any) */
    th.tier-th{width:62px;text-align:center;}
    td.tier-td{width:62px;text-align:center;}
    .tier{font-size:11px;font-weight:bold;letter-spacing:.03em;}
    .tier-none{color:var(--t2);font-weight:normal;}
    .tier-FABLE{color:#c87a4a;}
    .tier-OPUS{color:var(--acc);}
    .tier-SONNET{color:var(--t1);}
    .tier-ANY{color:var(--t2);}
    /* Collapsible top-level (##) sections */
    .sec-wrap{margin:22px 0 0;}
    .sec-toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:1px solid var(--brd);padding-bottom:6px;margin-bottom:10px;}
    .sec-toggle:hover .sec-title{filter:brightness(1.2);}
    .sec-arr{font-size:11px;color:var(--acc);transition:transform .15s;flex-shrink:0;}
    .sec-arr.open{transform:rotate(90deg);}
    .sec-title{color:var(--acc);font-size:15px;font-weight:bold;}
    .sec-count{color:#00ffff;font-size:13px;font-weight:bold;flex-shrink:0;}
    .sec-body{display:none;}
    .sec-body.open{display:block;}

    /* Completed section */
    .completed-wrap{margin:-8px 0 20px;}
    .completed-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;user-select:none;}
    .completed-toggle:hover .completed-label{color:var(--t1);}
    .completed-arr{font-size:9px;color:var(--t2);transition:transform .15s;}
    .completed-arr.open{transform:rotate(90deg);}
    .completed-label{font-size:12px;color:var(--t2);letter-spacing:.04em;}
    .completed-count{font-size:11px;color:var(--t2);opacity:.6;}
    .completed-body{display:none;}
    .completed-body.open{display:block;}
    .completed-body table{opacity:.55;}
    .completed-body tr:hover td{opacity:1;}
  </style>
</head>
<body>
  <div id="root">
    <div id="drop-zone">
      <p style="margin-bottom:16px;color:var(--t1);">📋 Traffic and Dragons — TODO Viewer</p>
      <button id="load-btn">Open TODO.md</button>
      <span class="legend" title="Status glyphs (owner rule 2026-09-02)">○ not started · ◐ partially complete · ◉ ready to test · ✅ complete</span>
      <p style="margin-top:16px;font-size:11px;">or drag &amp; drop TODO.md here</p>
    </div>
  </div>

<script>
var _sections = [];
var TODO_VIEWER_VERSION = "v0.7";
// #481 G3 (owner ruling 2026-09-29): TRULY read-only. The viewer used to export TODO.md in place (a no-edit save changed four
// rows; Renumber rewrote 44 of 45 open numbers) behind a "read-only" label. Every write and edit path is gone — export,
// renumber, add, edit, delete, complete, restore, the status toggle, drag-reorder; the READ handle stays. All TODO edits go
// through Claude. Contract: dev/tests-481-g3-todo-viewer.js.
var _tasks = [];
var _fileHandle = null;
var _startHandle = null; // last-stored TODO handle, kept even when read permission has lapsed — used ONLY as the picker's startIn anchor (startIn needs no permission), so "Select TODO…" opens IN the project directory instead of the browser default
var _fileName = ""; // name of the file being viewed (File System Access API exposes no directory path)
var _hasEffort = false;
var _compOpen = {}; // track which completed sections are open, keyed by section idx
var _secOpen = {};  // track which top-level (##) sections are open, keyed by heading title

// ── IndexedDB handle persistence ──────────────────────────────────────────────

function _openDb(cb) {
  var req = indexedDB.open("tdtodo", 1);
  req.onupgradeneeded = function(e) { e.target.result.createObjectStore("handles"); };
  req.onsuccess = function(e) { cb(e.target.result); };
  req.onerror = function() { cb(null); };
}
function saveHandle(handle) {
  _openDb(function(db) {
    if (!db) return;
    try { db.transaction("handles","readwrite").objectStore("handles").put(handle,"todo"); } catch(e) {}
  });
}
function loadStoredHandle(cb) {
  _openDb(function(db) {
    if (!db) { cb(null); return; }
    try {
      var req = db.transaction("handles","readonly").objectStore("handles").get("todo");
      req.onsuccess = function(e) { cb(e.target.result || null); };
      req.onerror = function() { cb(null); };
    } catch(e) { cb(null); }
  });
}

// ── Autoload on page start ────────────────────────────────────────────────────

window.addEventListener("DOMContentLoaded", function() {
  if (!window.showOpenFilePicker || !window.indexedDB) return;
  loadStoredHandle(function(handle) {
    if (!handle) return;
    _fileHandle = handle;
    _startHandle = handle; // even if permission lapsed below, the handle still anchors the picker's start directory
    handle.queryPermission({mode:"read"}).then(function(perm) {
      if (perm === "granted") {
        handle.getFile().then(function(f) { readFile(f); }).catch(function() {});
      } else {
        var dz = document.getElementById("drop-zone");
        if (!dz) return;
        var btn = document.createElement("button");
        btn.id = "reopen-btn";
        btn.textContent = "↺ Reopen TODO.md";
        btn.onclick = function() {
          handle.requestPermission({mode:"read"}).then(function(p) {
            if (p === "granted") handle.getFile().then(function(f) { readFile(f); }).catch(function() {});
          }).catch(function() {});
        };
        dz.appendChild(btn);
      }
    }).catch(function() {});
  });
});

// ── File loading ──────────────────────────────────────────────────────────────

// Shared picker — used by the landing button AND the toolbar "Select TODO" button, so the
// viewer can switch files after autoload has locked onto the previously opened one
// (the IndexedDB handle made an AUDIT file sticky across sessions).
function pickFile() {
  if (window.showOpenFilePicker) {
    // Default to the PROJECT directory (user call 2026-08-03): `startIn` on the stored TODO
    // handle opens the picker in that file's parent folder — the repo root — and needs no
    // permission grant. `id` makes Chrome remember this picker's last directory on its own,
    // separately from every other picker on the origin, so even a fresh profile converges on
    // the project directory after the first open. A stale startIn handle (file moved/renamed)
    // can reject the CALL itself — retried once without the anchor; a user cancel (AbortError)
    // stays cancelled.
    var opts = {id:"tnd-todo", types:[{description:"Markdown",accept:{"text/plain":[".md",".txt"]}}]};
    if (_startHandle) opts.startIn = _startHandle;
    window.showOpenFilePicker(opts)
      ["catch"](function(err) {
        if (err && err.name === "AbortError") throw err;
        console.warn("[todo-viewer] picker rejected with the startIn anchor (stale handle?) — retrying without it:", err && err.message);
        delete opts.startIn;
        return window.showOpenFilePicker(opts);
      })
      .then(function(handles) {
        _fileHandle = handles[0];
        _startHandle = handles[0];
        saveHandle(_fileHandle);
        return _fileHandle.getFile();
      }).then(function(file) {
        readFile(file);
      }).catch(function() {});
  } else {
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".md,.txt";
    inp.onchange = function(e) { readFile(e.target.files[0]); };
    inp.click();
  }
}
document.getElementById("load-btn").addEventListener("click", pickFile);

var dz = document.getElementById("drop-zone");
dz.addEventListener("dragover", function(e) { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", function() { dz.classList.remove("over"); });
dz.addEventListener("drop", function(e) {
  e.preventDefault(); dz.classList.remove("over");
  var f = e.dataTransfer.files[0];
  if (f) { _fileHandle = null; readFile(f); }
});

function readFile(file) {
  _fileName = file.name || "";
  var r = new FileReader();
  r.onload = function(e) { parse(e.target.result); renderPage(); };
  r.readAsText(file);
}

function refresh() {
  if (!_fileHandle) { alert("No file handle — open via the Open button (not drag & drop) to enable refresh."); return; }
  _fileHandle.getFile().then(function(file) { readFile(file); }).catch(function(e) { alert("Refresh failed: " + e.message); });
}

// ── Parse TODO.md ─────────────────────────────────────────────────────────────

// Split a markdown table row into cells. A `|` splits ONLY when it is (a) not escaped as \| and
// (b) not inside a backtick code span — audit rows carry tag examples like `[COMPANION_HP:Hemlock|-8]`
// whose raw pipes would otherwise explode the row into extra columns (the E16 bleed, 07-06).
// Character walk instead of regex: ES5-safe (no lookbehind) and code-span state needs tracking anyway.
function splitCells(line) {
  var cells = [], cur = "", inCode = false, i, ch;
  for (i = 0; i < line.length; i++) {
    ch = line.charAt(i);
    if (ch === "\\" && line.charAt(i + 1) === "|") { cur += "|"; i++; continue; }
    if (ch === "`") { inCode = !inCode; cur += ch; continue; }
    if (ch === "|" && !inCode) { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

// Rejoin table rows that were written WRAPPED across physical lines (invalid GFM, but generated
// audits do it — AUDIT_PLAYTHRU's P2 opened "| P2 | **…** " and terminated "| M | open |" five
// lines later, killing the table scan so every later row fell through to the doc renderer).
// Deterministic rule, no heuristics: every real row in this format ENDS with "|", so a line that
// OPENS a row without that terminator is wrapped — absorb lines (blank ones included) until the
// one that ends with "|" completes it. Runs before BOTH parsers.
function joinWrappedRows(lines) {
  var out = [], cur = null, i, ln;
  for (i = 0; i < lines.length; i++) {
    ln = lines[i];
    if (cur !== null) {
      cur += " " + ln.trim();
      if (/\|\s*$/.test(ln)) { out.push(cur); cur = null; }
      continue;
    }
    if (/^\s*\|/.test(ln) && !/\|\s*$/.test(ln)) { cur = ln; continue; }
    out.push(ln);
  }
  if (cur !== null) out.push(cur); // unterminated at EOF — emit what we have rather than eat it
  return out;
}

function parse(md) {
  _sections = [];
  _tasks = [];
  _hasEffort = false;
  var lines = joinWrappedRows(md.split("\n"));
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (/^\|\s*#\s*\|/.test(line)) {
      var hdr = splitCells(line).slice(1,-1).map(function(c) { return c.toLowerCase(); });
      var ciNum = -1, ciTask = -1, ciEffort = -1, ciTier = -1, ciStatus = -1, hc;
      for (hc = 0; hc < hdr.length; hc++) {
        if (hdr[hc] === "#") ciNum = hc;
        else if (hdr[hc] === "task") ciTask = hc;
        else if (hdr[hc] === "effort") ciEffort = hc;
        else if (hdr[hc] === "tier") ciTier = hc;
        else if (hdr[hc] === "status") ciStatus = hc;
      }
      if (ciNum < 0) ciNum = 0;
      if (ciTask < 0) ciTask = 1;
      if (ciStatus < 0) ciStatus = (ciEffort >= 0 ? 3 : 2);
      var secHasEffort = (ciEffort >= 0);
      var secHasTier = (ciTier >= 0);
      if (secHasEffort) _hasEffort = true;
      var secIdx = _sections.length;
      i += 2; // skip header and separator
      var inCompleted = false;
      while (i < lines.length && (/^\|/.test(lines[i]) || /^<!--\s*completed\s*-->/.test(lines[i].trim()))) {
        if (/^<!--\s*completed\s*-->/.test(lines[i].trim())) {
          inCompleted = true;
          i++;
          // skip a repeated table header + separator inside the completed block
          if (i < lines.length && /^\|\s*#\s*\|/.test(lines[i])) i++;
          if (i < lines.length && /^\|[-\s:|]+\|/.test(lines[i])) i++;
          continue;
        }
        var cells = splitCells(lines[i]).slice(1,-1);
        if (cells.length >= 2) {
          _tasks.push({
            num: cells[ciNum] || "",
            task: cells[ciTask] || "",
            effort: ciEffort >= 0 ? (cells[ciEffort] || "") : "",
            tier: ciTier >= 0 ? (cells[ciTier] || "") : "",
            status: cells[ciStatus] || "",
            raw: lines[i],
            sec: secIdx,
            completed: inCompleted
          });
        }
        i++;
      }
      // skip closing comment if present
      if (i < lines.length && /^<!--\s*\/completed\s*-->/.test(lines[i].trim())) i++;
      _sections.push({type:"tasks", idx:secIdx, hasEffort:secHasEffort, hasTier:secHasTier});
    } else {
      var textLines = [];
      while (i < lines.length && !/^\|\s*#\s*\|/.test(lines[i])) {
        textLines.push(lines[i]);
        i++;
      }
      _sections.push({type:"text", content:textLines.join("\n")});
    }
  }
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderPage() {
  var active = _tasks.filter(function(t) { return !t.completed; });
  var completed = _tasks.filter(function(t) { return t.completed; });
  var html = "<div class='toolbar'>"
    + "<div>"
    + "<div style='font-size:12px;color:var(--acc);margin-bottom:2px;'>&#128196; " + inline(_fileName || "TODO.md")
    + " <span style='color:var(--t2);font-size:11px;font-weight:normal;'>" + TODO_VIEWER_VERSION + "</span></div>"
    + "<div style='font-size:12px;color:var(--t2);'>" + active.length + " tasks"
    + (completed.length ? " &middot; " + completed.length + " completed" : "")
    + " &mdash; " + active.filter(isDone).length + " ready to archive</div>"
    + "<div class='legend'>&#9711; not started &middot; &#9680; partially complete &middot; &#9673; ready to test &middot; &#9989; complete</div>"
    + "</div>"
    + "<div class='toolbar-right'>"
    + "<button class='tbtn' onclick='pickFile()'>&#128194; Select TODO&hellip;</button>"
    + "<button class='tbtn' onclick='refresh()'>&#8635; Refresh</button>"
    + "<button class='tbtn' onclick='location.reload()'>Reset</button>"
    + "</div></div>";

  // Flatten sections into ordered pieces, splitting text sections at their ## headings so each
  // top-level section (heading + all its content up to the next ##) can be wrapped as collapsible.
  var pieces = [];
  for (var s = 0; s < _sections.length; s++) {
    var sec = _sections[s];
    if (sec.type === "tasks") {
      pieces.push({ type: "html", html: renderTaskTable(sec) + renderCompletedSection(sec) });
    } else {
      var lines = sec.content.split("\n");
      var buf = [];
      for (var li = 0; li < lines.length; li++) {
        var hm = lines[li].match(/^##\s+(.+?)\s*$/); // level-2 only; ### fails the \s+ after ##
        if (hm) {
          if (buf.length) { pieces.push({ type: "html", html: parseMarkdown(buf.join("\n")) }); buf = []; }
          pieces.push({ type: "heading", title: hm[1] });
        } else {
          buf.push(lines[li]);
        }
      }
      if (buf.length) pieces.push({ type: "html", html: parseMarkdown(buf.join("\n")) });
    }
  }

  // Assemble: pre-heading html (the page title) renders loose; each ## heading opens a
  // collapsible group whose body holds everything until the next ## heading.
  var body = "", cur = null;
  for (var p = 0; p < pieces.length; p++) {
    var pc = pieces[p];
    if (pc.type === "heading") {
      if (cur) body += renderSectionGroup(cur);
      cur = { title: pc.title, inner: "" };
    } else if (cur) {
      cur.inner += pc.html;
    } else {
      body += pc.html;
    }
  }
  if (cur) body += renderSectionGroup(cur);

  document.getElementById("root").innerHTML = html + body;
  wireSectionToggles();
}

function secDefaultOpen(title) {
  return false; // everything starts collapsed; click a section (then an item) to drill in
}
function attrEsc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }
function renderSectionGroup(g) {
  var open = (g.title in _secOpen) ? _secOpen[g.title] : secDefaultOpen(g.title);
  return "<div class='sec-wrap'>"
    + "<div class='sec-toggle' data-sectitle=\"" + attrEsc(g.title) + "\">"
    + "<span class='sec-arr" + (open ? " open" : "") + "'>&#9654;</span>"
    + "<span class='sec-title'>" + inline(g.title) + "</span>"
    + "</div>"
    + "<div class='sec-body" + (open ? " open" : "") + "'>" + g.inner + "</div>"
    + "</div>";
}
function wireSectionToggles() {
  var toggles = document.querySelectorAll(".sec-toggle");
  for (var i = 0; i < toggles.length; i++) {
    (function(tog) {
      var body = tog.nextElementSibling;
      if (body.querySelector("table")) {
        var count = document.createElement("span");
        count.className = "sec-count";
        count.textContent = "(" + body.querySelectorAll("tbody tr").length + ")";
        tog.appendChild(count);
      }
      tog.addEventListener("click", function() {
        var title = tog.getAttribute("data-sectitle");
        var curOpen = (title in _secOpen) ? _secOpen[title] : secDefaultOpen(title);
        _secOpen[title] = !curOpen;
        renderPage();
      });
    })(toggles[i]);
  }
}

// ── Task table ────────────────────────────────────────────────────────────────

function effortBadge(e) {
  if (!e || e === "—" || e === "-") return "<span class='eff eff-none'>—</span>";
  var key = e.toUpperCase().replace(/[^A-Z]/g, "");
  return "<span class='eff eff-" + key + "'>" + e + "</span>";
}
function tierBadge(t) {
  if (!t || t === "—" || t === "-") return "<span class='tier tier-none'>—</span>";
  var key = t.toUpperCase().replace(/[^A-Z]/g, "");
  return "<span class='tier tier-" + key + "'>" + t + "</span>";
}
// The ROW-LEVEL mark is the only one that matters, and it may only be a checkmark when the WHOLE
// row is finished (owner call 2026-08-23). The old rule matched a ✅ anywhere, so a check on a
// SUB-PART flagged the row complete — #208 (Flux dropped, ship-vs-file call still open), #207 (①
// shipped, ② design-first) and #192 (authoring half, REMAINING TAIL) all read as ready-to-archive.
// The status dot is the deliberate human triage, so it outranks any ✅ buried in the prose.
// Owner rule 2026-09-02: ○ not started · ◐ partially complete · ◉ ready to test · ✅ complete.
// ◒ is the LEGACY ready-to-test dot (archived rows still carry it) and reads as ◉.
var DOT_PARTIAL = "◐", DOT_RTT = "◉", DOT_RTT_LEGACY = "◒";
function rowDot(t) { var m = /[◒○◐◉]/.exec(t.status || ""); return m ? (m[0] === DOT_RTT_LEGACY ? DOT_RTT : m[0]) : ""; }
function isDone(t) {
  if (rowDot(t)) return false;   // an explicit ○/◐/◉ says the row is NOT finished, whatever it contains
  return /✅/.test(t.task) || /✅/.test(t.status) || /\bDone\b/.test(t.status);
}
function isPartial(t) { return rowDot(t) === DOT_PARTIAL; }
function isReadyToTest(t) {
  // An explicit dot decides BOTH ways. Without this, the prose fallback below promoted a row the
  // human had marked ○ just because its body mentioned a ready-to-test plan (#77's design sketch).
  var d = rowDot(t);
  if (d) return d === DOT_RTT;
  return !isDone(t) && /ready.to.test/i.test(t.status);
}
function isLow(t) {
  return /[Ll]ow priority/.test(t.status) || /[Ll]ow priority/.test(t.task);
}
// Collapsed-row header: the lead of a task, up to the first em/en-dash separator, else the first
// sentence, else a clamped prefix. Keeps markdown (bold/code) so inline() renders it like the full text.
function taskHeadline(md) {
  var s = String(md || "").replace(/\s+/g, " ").trim();
  var seps = [" — ", " – "], best = -1, si, idx, h = null;
  for (si = 0; si < seps.length; si++) {
    idx = s.indexOf(seps[si]);
    if (idx > 0 && idx <= 140 && (best < 0 || idx < best)) best = idx;
  }
  if (best > 0) h = s.slice(0, best).trim();
  else {
    var m = s.match(/^(.{0,140}?[.!?])(\s|$)/);
    if (m) h = m[1].trim();
    else if (s.length > 100) h = s.slice(0, 100).trim() + "…";
    else h = s;
  }
  // The cut can land INSIDE a bold/code span (audit titles put the em-dash mid-bold), leaving a
  // dangling ** or ` that inline() then renders literally (the E16 "**" artifact, 07-06). Close
  // any odd-count delimiter — code first so a doubly-dangling `**`code ends properly nested.
  if (((h.match(/`/g) || []).length) % 2) h += "`";
  if (((h.match(/\*\*/g) || []).length) % 2) h += "**";
  return h;
}
function toggleTaskExpand(i) {
  _tasks[i]._expanded = !_tasks[i]._expanded;
  renderPage();
}

// An expanded row's status text, under the task (the Status column is gone — v0.6). Nothing when the row has none.
function statusBlock(t, cls) {
  return t.status ? "<span class='task-status " + cls + "'>" + inline(t.status) + "</span>" : "";
}

function renderTaskTable(sec) {
  var hasEff = sec.hasEffort, hasTier = sec.hasTier;
  var h = "<table class='task-table'>"
    + "<thead><tr><th style='width:22px;'></th><th style='width:36px;'>#</th><th class='task-th'>Task</th>"
    + (hasEff ? "<th class='effort-th'>Effort</th>" : "")
    + (hasTier ? "<th class='tier-th'>Tier</th>" : "")
    + "</tr></thead>"
    + "<tbody class='tt-body' data-sec='"+sec.idx+"'>";
  for (var i = 0; i < _tasks.length; i++) {
    if (_tasks[i].sec !== sec.idx || _tasks[i].completed) continue;
    var t = _tasks[i];
    var done = isDone(t), rtt = isReadyToTest(t), part = isPartial(t), low = isLow(t);
    var sCls = done ? "status sdone" : low ? "status slow" : "status";
    var rowCls = done ? "done" : rtt ? "rtt" : "";
    /* #481 G3: the status glyph is shown, never clicked — it used to cycle the status (an edit) */
    var dotCls = done ? "dot done" : rtt ? "dot rtt" : part ? "dot part" : "dot";
    var dotSym = done ? "&#10003;" : rtt ? "&#9673;" : part ? "&#9680;" : "&#9711;";
    var dotTitle = done ? "complete" : rtt ? "ready to test" : part ? "partially complete" : "not started";
    var expanded = !!t._expanded;
    var taskBody = expanded
      ? "<span class='task-body'>" + inline(t.task) + statusBlock(t, sCls) + "</span>"
      : "<span class='task-body task-head' onclick='toggleTaskExpand(" + i + ")'>" + inline(taskHeadline(t.task)) + "</span>";
    var taskCell = "<td class='task-td'><div class='task-cell-inner'>"
          + "<span class='task-arr" + (expanded ? " open" : "") + "' onclick='toggleTaskExpand(" + i + ")' title='Expand / collapse'>&#9654;</span>"
          + taskBody
          + "</div></td>";
    h += "<tr class='" + rowCls + "' data-idx='" + i + "'>"
      + "<td class='check-cell'><span class='" + dotCls + "' title='" + dotTitle + "'>" + dotSym + "</span></td>"
      + "<td class='num-cell'>" + inline(t.num) + "</td>"
      + taskCell
      + (hasEff ? "<td class='effort-td'>" + effortBadge(t.effort) + "</td>" : "")
      + (hasTier ? "<td class='tier-td'>" + tierBadge(t.tier) + "</td>" : "")
      + "</tr>";
  }
  h += "</tbody></table>";
  return h;
}

function renderCompletedSection(sec) {
  var compTasks = [];
  for (var i = 0; i < _tasks.length; i++) {
    if (_tasks[i].sec === sec.idx && _tasks[i].completed) compTasks.push({task:_tasks[i], idx:i});
  }
  if (!compTasks.length) return "";
  var isOpen = !!_compOpen[sec.idx];
  var hasEff = sec.hasEffort, hasTier = sec.hasTier;
  var h = "<div class='completed-wrap'>"
    + "<div class='completed-toggle' onclick='toggleCompletedSection(" + sec.idx + ")'>"
    + "<span class='completed-arr" + (isOpen ? " open" : "") + "'>&#9654;</span>"
    + "<span class='completed-label'>Completed</span>"
    + "<span class='completed-count'>(" + compTasks.length + ")</span>"
    + "</div>"
    + "<div class='completed-body" + (isOpen ? " open" : "") + "'>"
    + "<table class='task-table'>"
    + "<thead><tr><th style='width:22px;'></th><th style='width:36px;'>#</th><th class='task-th'>Task</th>"
    + (hasEff ? "<th class='effort-th'>Effort</th>" : "")
    + (hasTier ? "<th class='tier-th'>Tier</th>" : "")
    + "</tr></thead>"
    + "<tbody>";
  for (var j = 0; j < compTasks.length; j++) {
    var t = compTasks[j].task, gi = compTasks[j].idx;
    var cExpanded = !!t._expanded;
    var cBody = cExpanded
      ? "<span class='task-body'>" + inline(t.task) + statusBlock(t, "status sdone") + "</span>"
      : "<span class='task-body task-head' onclick='toggleTaskExpand(" + gi + ")'>" + inline(taskHeadline(t.task)) + "</span>";
    h += "<tr data-idx='" + gi + "'>"
      + "<td class='check-cell'><span style='color:var(--grn);font-size:13px;'>&#10003;</span></td>"
      + "<td class='num-cell'>" + inline(t.num) + "</td>"
      + "<td class='task-td'><div class='task-cell-inner'>"
        + "<span class='task-arr" + (cExpanded ? " open" : "") + "' onclick='toggleTaskExpand(" + gi + ")' title='Expand / collapse'>&#9654;</span>"
        + cBody + "</div></td>"
      + (hasEff ? "<td class='effort-td'>" + effortBadge(t.effort) + "</td>" : "")
      + (hasTier ? "<td class='tier-td'>" + tierBadge(t.tier) + "</td>" : "")
      + "</tr>";
  }
  h += "</tbody></table></div></div>";
  return h;
}

function toggleCompletedSection(secIdx) {
  _compOpen[secIdx] = !_compOpen[secIdx];
  renderPage();
}

// #481 G3 test seam: feed a TODO.md's text straight to the renderer (no picker, no file handle). Read-only like the page.
window.__todoViewerTest = {
  loadText: function(text, name) { _fileName = name || ""; parse(String(text || "")); renderPage(); }
};

// ── Markdown renderer ─────────────────────────────────────────────────────────

function parseMarkdown(md) {
  var lines = joinWrappedRows(md.split("\n"));
  var out = "";
  var inTable=false, inUl=false, inOl=false;
  function closeList() { if (inUl) { out += "</ul>"; inUl=false; } if (inOl) { out += "</ol>"; inOl=false; } }
  function closeTable() { if (inTable) { out += "</tbody></table>"; inTable=false; } }
  for (var i = 0; i < lines.length; i++) {
    var line=lines[i], trimmed=line.trim();
    if (/^### /.test(trimmed)) { closeList(); closeTable(); out += "<h3>" + inline(trimmed.slice(4)) + "</h3>"; continue; }
    if (/^## /.test(trimmed))  { closeList(); closeTable(); out += "<h2>" + inline(trimmed.slice(3)) + "</h2>"; continue; }
    if (/^# /.test(trimmed))   { closeList(); closeTable(); out += "<h1>" + inline(trimmed.slice(2)) + "</h1>"; continue; }
    if (/^---+$/.test(trimmed)) { closeList(); closeTable(); out += "<hr>"; continue; }
    if (/^\|/.test(trimmed)) {
      var cells = splitCells(trimmed).slice(1,-1); // shared code-span-aware splitter — a raw split("|") broke on pipes inside backticks
      if (cells.every(function(c) { return /^[-: ]+$/.test(c); })) { continue; }
      if (!inTable) { inTable=true; out += "<table><thead><tr>" + cells.map(function(c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>"; continue; }
      out += "<tr>" + cells.map(function(c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
      continue;
    } else { closeTable(); }
    if (/^[-*] /.test(trimmed))    { closeTable(); if (!inUl) { out += "<ul>"; inUl=true; } out += "<li>" + inline(trimmed.slice(2)) + "</li>"; continue; }
    if (/^\d+\. /.test(trimmed))   { closeTable(); if (!inOl) { out += "<ol>"; inOl=true; } out += "<li>" + inline(trimmed.replace(/^\d+\. /,"")) + "</li>"; continue; }
    if (!trimmed) { closeList(); closeTable(); out += "<p></p>"; continue; }
    if (/^> /.test(trimmed)) { closeList(); closeTable(); out += "<blockquote>" + inline(trimmed.slice(2)) + "</blockquote>"; continue; }
    closeList(); closeTable(); out += "<p>" + inline(trimmed) + "</p>";
  }
  closeList(); closeTable();
  return out;
}

function inline(s) {
  s = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); // non-greedy, not [^*]+ — bold spans containing a bare * (e.g. "COMPANION_* tag") failed to close and rendered literal ** (E15/E16, 07-06)
  s = s.replace(/\*([^*]+)\*/g,"<em>$1</em>");
  s = s.replace(/✅/g,"<span style='color:var(--grn)'>✅</span>");
  return s;
}
</script>
