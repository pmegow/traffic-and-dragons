<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Designer — Traffic and Dragons</title>
<link rel="icon" type="image/svg+xml" href="designer-icon.svg">
<link rel="apple-touch-icon" href="designer-icon-192.png">
<meta name="theme-color" content="#0a1d33">
<!--
  Blueprint Designer (BLUEPRINT_EDITOR.md, D5 revised 2026-07-03: fully EXTERNAL page).
  Loads the REAL engine data/logic via <script src> (the test.html / todo-viewer.html pattern):
  data.js supplies TONES/AUTHORS, game.js supplies normalizeBlueprint/normalizeToneId/validateBlueprint.
  Shares localStorage with the app by same-origin (future: cloud library via storage-adapter,
  Generate mode via api.js). HARD RULE: this page never writes the game's state keys
  (tnd_core/sess/mem) — it reads engine data and emits .blueprint files only.
  ES5 only, string-concat HTML, no dependencies — same conventions as the app.
-->
<style>
/* Architectural-blueprint theme (2026-07-05, user request): cyanotype blues, light linework,
   graph-paper grid. Designer-only — the game keeps its amber identity. */
:root{--bg0:#0a1d33;--bg1:#0e2542;--bg2:#132e50;--bg3:#1a3a63;--brd:#27476e;--brd2:#3a5d8a;--t0:#eaf3fc;--t1:#b9d0e6;--t2:#7595b8;--acc:#8fc1e8;--dng:#e08a8a;--grn:#84c795;--wrn:#e0b86a;--r:6px;--font:"Segoe UI",system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg0);color:var(--t1);font-family:var(--font);font-size:14px;
  background-image:linear-gradient(rgba(143,193,232,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(143,193,232,.10) 1px,transparent 1px),linear-gradient(rgba(143,193,232,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(143,193,232,.045) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;}
#topbar{position:sticky;top:0;z-index:10;background:var(--bg1);border-bottom:1px solid var(--brd2);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#topbar h1{font-size:16px;color:var(--t0);margin:0;flex:1;min-width:200px;}
#topbar h1 .ver{font-size:10px;color:var(--t2);font-weight:normal;margin-left:8px;}
.tbtn{padding:8px 16px;font-size:12px;font-family:var(--font);background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);color:var(--t1);cursor:pointer;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);}
.tbtn.primary{background:var(--acc);border-color:var(--acc);color:#062038;font-weight:bold;}
.tbtn.primary:hover{color:#000;}
/* Topbar LLM picker (v0.32) — which model Review/Apply/Ask/Generate use. Overrides the global
   select{width:100%} so it sits inline with the buttons. */
#llm-sel{width:auto;max-width:230px;padding:7px 8px;font-size:12px;}
#statusline{width:100%;font-size:11px;min-height:15px;color:var(--t2);}
#statusline.err{color:var(--dng);}
#statusline.ok{color:var(--grn);}
#statusline.warn{color:var(--wrn);}
main{max-width:880px;margin:0 auto;padding:18px 18px 80px;}
.sect{background:var(--bg1);border:1px solid var(--brd);border-radius:10px;padding:16px;margin-bottom:16px;}
.sect h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:0;cursor:pointer;user-select:none;}
.sect h2.open{margin-bottom:12px;}
.cardlbl{cursor:pointer;user-select:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin-bottom:3px;min-height:20px;}
/* Icon-only buttons (▲ ▼ × ⤢): fixed SQUARE with the glyph flex-centered (v0.7 report — the
   compressed v0.6 breakout rendered squished/off-center). Labels share the 20px min-height so
   fld and fldB rows stay aligned. Text buttons (Done/Open/…) keep plain .mini. */
.sq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;font-size:11px;line-height:1;flex-shrink:0;}
input[type=text],select,textarea{width:100%;padding:8px 10px;font-size:13px;font-family:var(--font);background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);color:var(--t0);outline:none;}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--acc);}
/* Blueprint FIELD textareas: exactly 3 visible lines, no partial 4th ever peeking. The subtlety
   (v0.28): a scroll container's viewport is clientHeight = content + padding, and at scroll-top the
   padding-top is painted ABOVE line 1 — so with vertical padding the visible text budget
   (clientHeight − paddingTop) isn't a clean multiple of line-height and a sliver of line 4 shows
   (v0.27's bug). Fix: ZERO vertical padding so clientHeight == an exact 3×line-height (3×21 + 2px
   border = 65px); the 21px leading supplies the top/bottom breathing room the padding used to.
   overflow-y:scroll keeps the 6px scrollbar always on for visual consistency. Scoped to .bpf so the
   breakout modal + Ask input (their own textareas, normal padding) are untouched. */
textarea.bpf{resize:vertical;line-height:21px;height:65px;min-height:65px;padding:0 10px;overflow-y:scroll;}
.card{background:var(--bg2);border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.card.arc{background:var(--bg1);border-left-color:var(--brd2);margin:8px 0 8px 18px;}
.cardhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cardhead .cardlbl{flex:1;font-size:11px;color:var(--acc);font-weight:bold;text-transform:uppercase;letter-spacing:.06em;}
.card.arc .cardhead .cardlbl{color:var(--t2);}
.mini{padding:3px 9px;font-size:11px;font-family:var(--font);background:none;border:1px solid var(--brd2);border-radius:4px;color:var(--t2);cursor:pointer;}
.mini:hover{border-color:var(--acc);color:var(--acc);}
.mini.del:hover{border-color:var(--dng);color:var(--dng);}
.addbtn{padding:7px 14px;font-size:12px;font-family:var(--font);background:none;border:1px dashed var(--brd2);border-radius:var(--r);color:var(--t2);cursor:pointer;width:100%;}
.addbtn:hover{border-color:var(--acc);color:var(--acc);}
.fld{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t1);cursor:pointer;margin-bottom:8px;}
.chk input{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}
.rowline{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
.rowline .grow{flex:1;}
#counts{font-size:11px;color:var(--t2);}
.empty{font-size:12px;color:var(--t2);font-style:italic;padding:6px 0 10px;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg0);}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--acc);}
</style>
</head>
<body>
<div id="topbar">
  <h1>&#129513; Blueprint Designer<span class="ver" id="ver"></span></h1>
  <button class="tbtn" id="btn-new">New</button>
  <button class="tbtn" id="btn-load">Load&hellip;</button>
  <select id="llm-sel" title="LLM used by Review, Apply fix, Ask, and Generate"></select>
  <button class="tbtn" id="btn-generate">&#10024; Generate&hellip;</button>
  <button class="tbtn" id="btn-ask">&#128172; Ask&hellip;</button>
  <button class="tbtn" id="btn-review">&#128269; Review</button>
  <button class="tbtn" id="btn-library">&#9729; Library&hellip;</button>
  <button class="tbtn" id="btn-publish">&#9729; Publish</button>
  <button class="tbtn primary" id="btn-save">&#8595; Save .blueprint</button>
  <div id="statusline"></div>
</div>
<main id="app"></main>
<input type="file" id="file-inp" accept=".blueprint,.campaign" style="display:none;">

<!-- Engine chain in canonical order (v1.180; repaired v0.37) — state.js supplies store/keys/
     loadProviderSettings, storage-adapter the cloud library, api.js callGM/repairModelJson for
     the generate/review features. clock.js + identity.js + tag_table.js are LOAD-BEARING for
     api.js: its top-level NOTE_BUILDERS array evaluates their builder functions at load, and
     without them api.js aborts BEFORE defining callGM — which silently killed every designer
     LLM feature from v1.581 (identity.js landed in the chain) until v0.37 (the #17 rot class:
     a hand-copied engine list drifts as the engine grows; the run-tests BLUEPRINT DESIGNER
     CONTRACT now pins these three tags before api.js). HARD RULE unchanged: this page never
     writes the game's state keys (no loadState/saveCore here). -->
<script src="globals.js"></script>
<script src="data.js"></script>
<script src="class_bible.js"></script>
<script src="helpers.js"></script>
<script src="state.js"></script>
<script src="storage-adapter.js"></script>
<script src="memory.js"></script>
<script src="clock.js"></script>
<script src="identity.js"></script>
<script src="tag_table.js"></script>
<script src="api.js"></script>
<script src="campaign_generator.js"></script>
<script src="game.js"></script>
<script src="tts.js"></script>
<script>
// Designer version — SEPARATE from the game's APP_VERSION (user call 2026-07-05; the designer
// is its own tool). Bump on every designer change; the engine version rides as a suffix in the
// header because blueprint schema compatibility tracks the ENGINE, not this page.
var BP_DESIGNER_VERSION="v0.39";
var ARC_TYPES=["","combat","investigation","exploration","social"];
var bp=null,dirty=false;
// ── Draft persistence (v0.31) ─────────────────────────────────────────────────
// Reload NEVER clears the editor — that's what New is for (user rule, 07-06). Every mutation
// autosaves the RAW working state (not stripView: review selections, FAILED stamps, and collapse
// flags all survive) to localStorage, debounced; boot restores it silently. New clears it.
var DRAFT_K="bpd_draft_v1",_draftT=null;
function saveDraft(){
  if(_draftT)clearTimeout(_draftT);
  _draftT=setTimeout(function(){_draftT=null;try{localStorage.setItem(DRAFT_K,JSON.stringify({bp:bp,dirty:dirty,at:Date.now()}));}catch(e){/* quota — draft is a convenience, never block editing */}},400);
}
function clearDraft(){if(_draftT){clearTimeout(_draftT);_draftT=null;}try{localStorage.removeItem(DRAFT_K);}catch(e){}}
// Collapse state (2026-07-05, "I really hate scrolling"): sections in secOpen (undefined = open),
// cards carry a `_c` flag ON the data object so collapse travels with moves/reorders. `_c` is
// VIEW state only — stripped from Save and Publish output by stripView(). Loading an existing
// blueprint starts fully collapsed (scroll relief + spoiler cover); New starts open.
var secOpen={};
function stripView(obj){return JSON.parse(JSON.stringify(obj,function(kk,vv){return kk&&kk.charAt(0)==="_"?undefined:vv;}));}
// File output = stripView + a designerVersion provenance stamp right after "format" (v0.18,
// user request). Always re-stamped to the CURRENT version at write time (a loaded file's old
// stamp is skipped in the copy loop, not carried forward). The engine ignores the field.
function fileOut(){
  var o=stripView(bp),out={format:o.format,designerVersion:BP_DESIGNER_VERSION},k;
  for(k in o){if(k!=="format"&&k!=="designerVersion")out[k]=o[k];}
  return out;
}
function collapseAll(){
  var i,j;
  for(i=0;i<bp.acts.length;i++){bp.acts[i]._c=1;for(j=0;j<(bp.acts[i].arcs||[]).length;j++)bp.acts[i].arcs[j]._c=1;}
  for(i=0;i<bp.npcs.length;i++)bp.npcs[i]._c=1;
  for(i=0;i<bp.creatures.length;i++)bp.creatures[i]._c=1;
  for(i=0;i<bp.locations.length;i++)bp.locations[i]._c=1;
  for(i=0;i<(bp.customClasses||[]).length;i++)bp.customClasses[i]._c=1;
}

// Delegates to the engine's escHtml (helpers.js) — which, unlike the old local copy, escapes
// SINGLE quotes. txt()/fldB build single-quoted attributes (value='…'), so an unescaped
// apostrophe closed the attribute early: "Tsuto's journal" rendered as "Tsuto" and — worse —
// editing such a field would have written the truncation back into the data (2026-07-05 report).
function esc(s){return escHtml(s==null?"":s);}
function blankArc(){return {title:"",objective:"",type:"",dnaHint:"",reward:""};}
function blankAct(){return {title:"",goal:"",turningPoint:"",reward:"",parallel:false,arcs:[blankArc()]};}
// #192 — a fresh custom class starts with a full stat priority and one ability row, so the
// two validation demands an author is most likely to trip (permutation, ≥1 ability) start
// satisfied-in-shape and only need CONTENT.
function blankCustomClass(){return {name:"",desc:"",hd:8,prime:"STR",statPriority:["STR","CON","DEX","WIS","CHA","INT"],gear:"",abilities:[{nm:"",ds:""}],skillSeeds:[],features:[]};}
// #192 — keep the availability roster following custom-class identity changes: naming a class
// under an active restriction ADDS it (an author defining a class means to offer it); renaming
// rewrites the entry; clearing the name — or deleting the class — removes it, so a restriction
// can never hold an orphan the validator would refuse.
function availRename(oldName,newName){
  if(!Array.isArray(bp.availableClasses))return;
  var i,low=String(oldName==null?"":oldName).trim().toLowerCase(),nu=String(newName==null?"":newName).trim();
  for(i=bp.availableClasses.length-1;i>=0;i--){
    if(low&&String(bp.availableClasses[i]).toLowerCase()===low){
      if(nu)bp.availableClasses[i]=nu;else bp.availableClasses.splice(i,1);
      return;
    }
  }
  if(nu&&!low)bp.availableClasses.push(nu);
}
function blankBp(){return normalizeBlueprint({format:"tnd-blueprint-v1",name:"",author:"",proseAuthor:"",narratorVoice:"",tone:"",startingLocation:"",startingRegion:"",premise:"",acts:[blankAct()],npcs:[],locations:[],creatures:[],rules:[]});}

function setStatus(msg,cls){var el=document.getElementById("statusline");el.textContent=msg||"";el.className=cls||"";}
// Dirty marker keeps the blueprint's NAME in the statusline and appends the flag (bug fix
// 2026-07-05: it used to replace the name with just "Unsaved changes"). Runs on every edit,
// so a rename updates the shown name live.
function markDirty(){dirty=true;setStatus((bp&&bp.name?bp.name:"Untitled blueprint")+" — unsaved changes","");saveDraft();}

// ── Rendering ──────────────────────────────────────────────────────────────────
function fld(label,inner){return "<div class='fld'><label>"+label+"</label>"+inner+"</div>";}
// Long-form fields get a ⤢ breakout button on the label — opens the large modal editor.
// The modal textarea carries the SAME data-sec/i/j/k attributes, so the existing delegated
// onField binding updates bp live while typing; Done just syncs the inline control back.
function fldB(label,sec,i,j,k,short,inner){
  return "<div class='fld'><label style='display:flex;align-items:center;gap:8px;'>"+label
    +"<button class='mini sq' data-op='breakout' data-i='"+i+"' data-j='"+j+"' data-bsec='"+sec+"' data-bk='"+k+"' data-blabel='"+esc(short)+"' title='Open large editor' style='margin-left:auto;'>&#10530;</button></label>"+inner+"</div>";
}
function txt(sec,i,j,k,val,ph){return "<input type='text' data-sec='"+sec+"' data-i='"+i+"' data-j='"+j+"' data-k='"+k+"' value='"+esc(val)+"'"+(ph?" placeholder='"+esc(ph)+"'":"")+"/>";}
function ta(sec,i,j,k,val,ph){return "<textarea class='bpf' data-sec='"+sec+"' data-i='"+i+"' data-j='"+j+"' data-k='"+k+"'"+(ph?" placeholder='"+esc(ph)+"'":"")+">"+esc(val)+"</textarea>";}
function movBtns(op,i,j){
  return "<button class='mini sq' data-op='up"+op+"' data-i='"+i+"' data-j='"+j+"' title='Move up'>&#9650;</button>"
       +"<button class='mini sq' data-op='down"+op+"' data-i='"+i+"' data-j='"+j+"' title='Move down'>&#9660;</button>"
       +"<button class='mini sq del' data-op='del"+op+"' data-i='"+i+"' data-j='"+j+"' title='Remove'>&#215;</button>";
}
// Collapsible chrome: section h2s and card labels toggle. Arrow is a text node inside the
// clickable element so e.target always carries the data-op.
function secH(key,label){var open=secOpen[key]!==false;return "<h2 class='"+(open?"open":"")+"' data-op='togsec' data-key='"+key+"'>"+(open?"&#9662;":"&#9656;")+" "+label+"</h2>";}
// One review finding card. Extracted (v0.24) so open findings and the collapsed Completed section
// can both render it. i is the finding's index in bp.review.findings (data-i for the op handlers).
function renderFindingCard(F,i){
  var sevCol=F.sev==="HIGH"?"var(--dng)":F.sev==="LOW"?"var(--t2)":"var(--acc)";
  var done=F.status==="applied",busy=F.status==="applying";
  var h="<div class='card' style='border-left-color:"+sevCol+";"+(done?"opacity:.55;":"")+"'>"
    +"<div class='cardhead'><span class='cardlbl' style='color:"+sevCol+";cursor:default;'>["+esc(F.sev)+"] "+esc(F.section)
    +(done?" <span style='color:var(--grn);font-size:9px;border:1px solid var(--grn);border-radius:3px;padding:0 4px;vertical-align:middle;'>APPLIED</span>":"")
    +(busy?" <span style='font-size:10px;color:var(--t2);text-transform:none;letter-spacing:0;'>applying…</span>":"")
    +((!done&&!busy&&F._err)?" <span style='color:var(--dng);font-size:9px;border:1px solid var(--dng);border-radius:3px;padding:0 4px;vertical-align:middle;'>FAILED</span>":"")+"</span>"
    +"<button class='mini sq' data-op='revask' data-i='"+i+"' data-j='0' title='Ask about this finding (canon or improv? why? alternatives?)'>&#128172;</button>"
    +"<button class='mini sq del' data-op='revdel' data-i='"+i+"' data-j='0' title='Dismiss this finding'>&#215;</button></div>"
    +"<div style='font-size:13px;"+(done?"text-decoration:line-through;":"")+"'><span style='color:var(--t2);'>Issue:</span> "+esc(F.issue)+"</div>";
  if(!done&&!busy&&F._err)h+="<div style='font-size:12px;margin-top:6px;color:var(--dng);'>&#9888; Last apply failed: "+esc(F._err)+" <span style='color:var(--t2);'>— see the browser console for the full log.</span></div>";
  if(done||busy){
    var ch=typeof F.chosen==="number"?F.chosen:0;
    h+="<div style='font-size:13px;margin-top:4px;"+(done?"text-decoration:line-through;":"")+"'><span style='color:var(--t2);'>Fix:</span> "+esc(F.fixes[ch]||"")+"</div>";
  }else{
    var multi=F.fixes.length>1,oi;
    for(oi=0;oi<F.fixes.length;oi++){
      var isSel=F._sel===oi;
      h+="<div data-op='revsel' data-i='"+i+"' data-j='"+oi+"' style='font-size:13px;margin-top:6px;padding:7px 10px;border-radius:var(--r);cursor:pointer;display:flex;align-items:flex-start;gap:8px;border:1px solid "+(isSel?"var(--grn)":"var(--brd)")+";"+(isSel?"background:rgba(132,199,149,.08);":"")+"' title='"+(isSel?"Selected — click to deselect":(multi?"Click to choose this option (only one can run)":"Click to select this fix for implementation"))+"'>"
        +"<span style='pointer-events:none;flex:1;'><span style='color:"+(isSel?"var(--grn)":"var(--t2)")+";'>"+(isSel?"&#9745;":"&#9744;")+" "+(multi?"Option "+(oi+1)+":":"Fix:")+"</span> "+esc(F.fixes[oi])+"</span>"
        +"<button class='mini sq' data-op='breakout' data-bsec='revfix' data-bk='"+oi+"' data-i='"+i+"' data-j='0' data-blabel='Edit "+(multi?"option "+(oi+1):"fix")+" — "+esc(F.section)+"' title='Edit before applying'>&#9998;</button>"
        +"</div>";
    }
  }
  h+=(F.note?"<div style='font-size:12px;margin-top:6px;color:var(--grn);'>&#10003; "+esc(F.note)+"</div>":"")
    +"</div>";
  return h;
}
function cardHead(tsec,i,j,label,summary,btns){
  return "<div class='cardhead'><span class='cardlbl' data-op='togcard' data-tsec='"+tsec+"' data-i='"+i+"' data-j='"+j+"'>"
    +((tsec==="act"?bp.acts[i]._c:tsec==="arc"?bp.acts[i].arcs[j]._c:tsec==="npc"?bp.npcs[i]._c:tsec==="creature"?bp.creatures[i]._c:tsec==="cclass"?bp.customClasses[i]._c:bp.locations[i]._c)?"&#9656;":"&#9662;")
    +" "+label+(summary?" &mdash; "+esc(summary):"")+"</span>"+btns+"</div>";
}
function render(){
  saveDraft(); // every interaction rerenders, so this keeps the draft mirroring the screen — including view-only state (collapse flags, fix selections) that never calls markDirty. Debounced, so bursts cost one write.
  var h="",i,j;
  // Metadata
  var toneOpts="<option value=''>(none)</option>";for(i=0;i<TONES.length;i++){toneOpts+="<option value='"+TONES[i].id+"'"+(bp.tone===TONES[i].id?" selected":"")+">"+esc(TONES[i].nm)+"</option>";}
  var voiceOpts="";for(i=0;i<AUTHORS.length;i++){voiceOpts+="<option value='"+AUTHORS[i].id+"'"+(bp.proseAuthor===AUTHORS[i].id?" selected":"")+">"+esc(AUTHORS[i].nm)+"</option>";}
  // #9 narrator voice — the audio twin of the prose voice, from the shared TTS catalog. Empty ships
  // no opinion so the player's own narrator survives the import (applyBlueprint only pins non-empty).
  var nvList=(typeof TTS!=="undefined"&&TTS.voices)?TTS.voices():[],nVoiceOpts="<option value=''>(player's own narrator)</option>";
  for(i=0;i<nvList.length;i++){nVoiceOpts+="<option value='"+nvList[i].id+"'"+(bp.narratorVoice===nvList[i].id?" selected":"")+">"+esc(nvList[i].label)+"</option>";}
  h+="<div class='sect'>"+secH("meta","Blueprint"+(bp.name?" — "+esc(bp.name):""));
  if(secOpen.meta!==false){
    h+="<div class='grid2'>"
    +fld("Name *",txt("meta",0,0,"name",bp.name,"e.g. Rise of the Runelords"))
    +fld("Author (credit)",txt("meta",0,0,"author",bp.author,"who made this campaign"))
    +fld("World tone","<select data-sec='meta' data-i='0' data-j='0' data-k='tone'>"+toneOpts+"</select>")
    +fld("Prose voice (player can override)","<select data-sec='meta' data-i='0' data-j='0' data-k='proseAuthor'>"+voiceOpts+"</select>")
    +fld("Narrator voice (player can override)","<select data-sec='meta' data-i='0' data-j='0' data-k='narratorVoice'>"+nVoiceOpts+"</select>")
    +fld("Starting location",txt("meta",0,0,"startingLocation",bp.startingLocation,"e.g. Sandpoint"))
    +fld("Starting region",txt("meta",0,0,"startingRegion",bp.startingRegion,"e.g. Varisia"))
    +"</div>"
    +fldB("Premise *","meta",0,0,"premise","Premise",ta("meta",0,0,"premise",bp.premise,"One paragraph: the world, the threat, why it matters."));
  }
  h+="</div>";
  // Acts
  h+="<div class='sect'>"+secH("story","Story — Acts &amp; Arcs");
  if(secOpen.story!==false){
  if(!bp.acts.length)h+="<div class='empty'>No acts yet. A blueprint needs at least one.</div>";

// ── Field binding (delegated) ──────────────────────────────────────────────────
// ONE routing table for field access. onField (writes), bpFieldGet (breakout reads), and
// bpFieldSet all go through it — adding a new section means adding ONE line here, and the
// breakout works for it automatically. (Born from the bestiary-notes bug, 2026-07-05: the
// breakout had its own private sec routing that knew meta/act/arc only, so opening a
// creature's notes read "" and Done synced the emptiness back — duplicated routing, split
// brains. Rules are an array of strings, not objects, so they stay a special case in get/set.)
var FIELD_ROOTS={
  meta:function(i,j){return bp;},
  act:function(i,j){return bp.acts[i];},
  arc:function(i,j){return bp.acts[i]&&bp.acts[i].arcs[j];},
  npc:function(i,j){return bp.npcs[i];},
  creature:function(i,j){return bp.creatures[i];},
  loc:function(i,j){return bp.locations[i];},
  dt:function(i,j){return bp.deepTime&&bp.deepTime[i];},                              // #227 age ladder
  cclass:function(i,j){return bp.customClasses[i];},                                  // #192
  cabil:function(i,j){return bp.customClasses[i]&&bp.customClasses[i].abilities[j];}, // #192 starting-ability rows
  cfeat:function(i,j){return bp.customClasses[i]&&bp.customClasses[i].features[j];},  // #192 level-feature rows
  revfix:function(i,j){var f=bp.review&&bp.review.findings[i];return f&&f.fixes;} // v0.15/v0.19: review fixes are editable; k = option index into fixes[]
};
function bpFieldGet(sec,i,j,k){
  if(sec==="rule")return i<bp.rules.length?(bp.rules[i]||""):"";
  var f=FIELD_ROOTS[sec],o=f&&f(i,j);
  if(!o)return "";
  if(sec==="cclass"&&(k==="statPriority"||k==="skillSeeds"))return (o[k]||[]).join(", "); // #192 canonical arrays render as CSV
  return o[k]||"";
}
// #192 — the custom-class routing subtleties live HERE, at the single field boundary (the
// bestiary-notes lesson): bp always holds the CANONICAL shape (arrays for statPriority/
// skillSeeds, numbers for hd/lvl — what fileOut ships), the inputs speak CSV/strings, and
// the availability roster follows a class rename live so it can never hold an orphan.
function bpFieldSet(sec,i,j,k,v){
  if(sec==="rule"){if(i<bp.rules.length)bp.rules[i]=v;return;}
  var f=FIELD_ROOTS[sec],o=f&&f(i,j);
  if(!o)return;
  if(sec==="cclass"&&k==="name"){var _oldNm=o.name;o.name=v;availRename(_oldNm,v);return;}
  if(sec==="cclass"&&(k==="statPriority"||k==="skillSeeds")){o[k]=csvToList(v,k==="statPriority");return;}
  if(sec==="cclass"&&k==="hd"){o[k]=parseInt(v,10);return;}
  if(sec==="cfeat"&&k==="lvl"){o[k]=/^\d+$/.test(String(v).trim())?parseInt(v,10):String(v);return;} // non-numeric input kept verbatim — validation names it loudly at Save
  o[k]=v;
}
function onField(e){
  var t=e.target,sec=t.getAttribute("data-sec");if(!sec)return;
  var i=parseInt(t.getAttribute("data-i"),10)||0,j=parseInt(t.getAttribute("data-j"),10)||0,k=t.getAttribute("data-k");
  var v=t.type==="checkbox"?t.checked:t.value;
  bpFieldSet(sec,i,j,k,v);
  markDirty();
  if(sec==="rule"||k==="name"&&sec!=="meta")return; // card labels refresh on next structural render
  updateCounts();
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);

// ── Structural ops (delegated) ─────────────────────────────────────────────────
function move(arr,from,delta){var to=from+delta;if(to<0||to>=arr.length)return;var x=arr.splice(from,1)[0];arr.splice(to,0,x);}
document.addEventListener("click",function(e){
  var t=e.target,op=t.getAttribute&&t.getAttribute("data-op");if(!op)return;
  var i=parseInt(t.getAttribute("data-i"),10)||0,j=parseInt(t.getAttribute("data-j"),10)||0;
  if(op==="breakout"){openBreakout(t);return;}
  if(op==="gencreature"){genCreature(t);return;}
  // Selection toggle — pure view state (_sel is stripped from files), so no markDirty.
  // _sel = the chosen OPTION INDEX (radio: re-click deselects, picking a sibling replaces).
  // NB: index 0 is falsy — every _sel check must be typeof === "number", never truthiness.
  if(op==="revsel"){var sf=bp.review&&bp.review.findings[i];if(sf&&!sf.status&&!_applyingAll){if(sf._sel===j)delete sf._sel;else sf._sel=j;render();}return;}
  if(op==="revdel"){if(_applyingAll)return;/* splicing mid-batch shifts indices and corrupts the running applyFinding(idx) — audit 07-06 #2 */bp.review.findings.splice(i,1);if(!bp.review.findings.length)delete bp.review;markDirty();render();return;}
  if(op==="revapplyall"){applyAllFindings();return;}
  if(op==="revask"){var af=bp.review&&bp.review.findings[i];if(af)openAsk(af);return;}

// device (keys ride in via loadProviderSettings, same as llmReady). The pick is persisted
// DESIGNER-SIDE (bpd_llm_v1) and only flips the in-memory activeProvider for this page's
// calls — the GAME's stored provider settings are never written (hard rule: this page
// never writes the game's state keys).
var LLM_PICK_K="bpd_llm_v1";
function llmChoices(){
  var out=[],ids=Object.keys(PROVIDERS),i,j;
  for(i=0;i<ids.length;i++){
    var id=ids[i],p=PROVIDERS[id];

    var seen={},ms=[].concat(providerModels[id]?[providerModels[id]]:[],p.models||[]);

// active provider's default, which only happens when no key is set (llmReady blocks first).

function wireLlmSelect(){
  var s=document.getElementById("llm-sel"),ch=llmChoices(),i,h="",byProv={},order=[];
  if(!ch.length){s.innerHTML="<option value=''>LLM: no API key</option>";s.disabled=true;return;}
  for(i=0;i<ch.length;i++){var c=ch[i];if(!byProv[c.provider]){byProv[c.provider]=[];order.push(c.provider);}byProv[c.provider].push(c);}
  for(i=0;i<order.length;i++){

    for(j=0;j<g.length;j++)h+="<option value='"+esc(g[j].provider+"|"+g[j].model)+"'>"+esc(g[j].model)+"</option>";
    h+="</optgroup>";
  }

  // Restore the persisted pick if its provider still has a key; else default to the app's
  // current provider+model (what the calls would have used before this dropdown existed).
  var want="";try{want=localStorage.getItem(LLM_PICK_K)||"";}catch(e){}
  var valid=false;for(i=0;i<ch.length;i++)if(ch[i].provider+"|"+ch[i].model===want){valid=true;break;}
  if(!valid)want=activeProvider+"|"+(providerModels[activeProvider]||(PROVIDERS[activeProvider]||{}).defaultModel||"");
  for(i=0;i<ch.length;i++)if(ch[i].provider+"|"+ch[i].model===want){s.value=want;break;}

  s.addEventListener("change",function(){

// Compact story context — what the model needs to invent IN SERVICE to this campaign,

  for(i=0;i<bp.acts.length;i++){var a=bp.acts[i],arcs=[];
    for(j=0;j<(a.arcs||[]).length;j++)arcs.push(a.arcs[j].title+(a.arcs[j].objective?" ("+a.arcs[j].objective+")":""));

document.getElementById("btn-review").addEventListener("click",async function(){

    // section, not their sum (v0.25).

// Grouping by section-TYPE instead of a heuristic item-label makes same-item findings ALWAYS share a

  setStatus(sum+".",fails.length?"err":"ok");
}

// ── Consult / Ask (v0.16) ──────────────────────────────────────────────────────
// A window for TALKING about the blueprint ("is this canon or improv?"). Multi-turn within
// one modal session, TRANSIENT — consultations never touch bp or the file. Each ask sends
// the blueprint + the running exchange, so follow-ups have context. Entry points: toolbar
// 💬 Ask… (general) and 💬 on a finding (seeded with it).
var _askLog=[]; // [{q,a}] for the current modal session
function closeAsk(){var m=document.getElementById("ask-modal");if(m)m.remove();_askLog=[];}
function renderAskLog(){
  var el=document.getElementById("ask-log");if(!el)return;
  var h="",i;
  for(i=0;i<_askLog.length;i++){
    h+="<div style='margin-bottom:10px;'><div style='color:var(--acc);font-size:12px;margin-bottom:3px;'>You</div><div style='white-space:pre-wrap;'>"+esc(_askLog[i].q)+"</div></div>";
    h+="<div style='margin-bottom:14px;'><div style='color:var(--grn);font-size:12px;margin-bottom:3px;'>Consultant</div><div style='white-space:pre-wrap;'>"+(_askLog[i].a==null?"<em style='color:var(--t2);'>thinking…</em>":esc(_askLog[i].a))+"</div></div>";
  }
  el.innerHTML=h||"<em style='color:var(--t2);'>Ask anything about this blueprint — canon vs invention, design tradeoffs, what the source module actually says.</em>";
  el.scrollTop=el.scrollHeight;
}
function openAsk(seedFinding){
  if(!llmReady())return;
  closeAsk();
  var wrap=document.createElement("div");
  wrap.id="ask-modal";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;";
  wrap.innerHTML="<div style='background:var(--bg1);border:1px solid var(--acc);border-radius:10px;width:min(760px,94vw);height:min(640px,88vh);padding:14px;display:flex;flex-direction:column;gap:10px;'>"
    +"<div style='display:flex;align-items:center;'><span style='font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);flex:1;'>&#128172; Consult — "+esc(bp.name||"untitled")+"</span><button class='mini' id='ask-x'>Close</button></div>"
    +(seedFinding?"<div style='font-size:12px;color:var(--t2);border-left:3px solid var(--brd2);padding:6px 10px;'>Re: ["+esc(seedFinding.sev)+"] "+esc(seedFinding.section)+" — "+esc(seedFinding.issue)+"</div>":"")
    +"<div id='ask-log' style='flex:1;overflow-y:auto;font-size:13.5px;line-height:1.6;color:var(--t1);padding:4px 2px;'></div>"
    +"<div style='display:flex;gap:8px;'><textarea id='ask-inp' style='flex:1;min-height:44px;height:44px;' placeholder='"+(seedFinding?"e.g. Is this fix canon or improv?":"Ask about the blueprint…")+"'></textarea><button class='tbtn primary' id='ask-send'>Ask</button></div></div>";
  document.body.appendChild(wrap);
  wrap.addEventListener("click",function(ev){if(ev.target===wrap)closeAsk();});
  document.getElementById("ask-x").addEventListener("click",closeAsk);
  var inp=document.getElementById("ask-inp");
  async function send(){
    var q=inp.value.trim();if(!q)return;
    inp.value="";
    _askLog.push({q:q,a:null});renderAskLog();
    var btn=document.getElementById("ask-send");if(btn)btn.disabled=true;
    try{
      var payload=stripView(bp);delete payload.review;
      var msg="BLUEPRINT UNDER DISCUSSION:\n"+JSON.stringify(payload,null,1)
        +(seedFinding?"\n\nREVIEW FINDING UNDER DISCUSSION:\n["+seedFinding.sev+"] "+seedFinding.section+"\nIssue: "+seedFinding.issue+"\nFix option(s): "+(seedFinding.fixes||[seedFinding.fix||""]).join(" | "):"");
      var x;for(x=0;x<_askLog.length-1;x++){msg+="\n\nUSER ASKED: "+_askLog[x].q+"\nYOU ANSWERED: "+_askLog[x].a;}
      msg+="\n\nUSER ASKS: "+q;
      var resp=await callGM(msg,"You are a consultant on this TTRPG campaign blueprint. Answer directly and concisely; you are advising the human author and cannot edit the blueprint. Plain text only.\nWHAT 'CANON' MEANS depends on the blueprint: IF it adapts a published work (the name/author credit will say so), canon = that published source — state explicitly what comes from the source versus what is invented, and flag uncertainty about the source. IF it is ORIGINAL/homebrew, the blueprint itself is the ONLY canon — never invent or imply an outside source; instead classify claims three ways: STATED (literally in the document), CONSISTENT EXTENSION (not stated but fits everything written — flag that accepting it makes it canon), or PURE INVENTION (no anchor in the document; imported genre defaults — call these out loudly).",1200,designerModel(),{noHistory:true,kind:"other"});
      _askLog[_askLog.length-1].a=resp;
    }catch(e){_askLog[_askLog.length-1].a="(failed: "+e.message+")";}
    if(btn)btn.disabled=false;
    renderAskLog();
    inp.focus();
  }
  document.getElementById("ask-send").addEventListener("click",send);
  inp.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();send();}});
  renderAskLog();
  inp.focus();
}
document.getElementById("btn-ask").addEventListener("click",function(){openAsk(null);});

// ── Cloud library (#15) ────────────────────────────────────────────────────────
// Publish = upsert to the personal library (server slugs by name — same name overwrites).
// Auth rides in from the APP's login via same-origin localStorage (autoConnect); the designer
// never does OAuth itself — if not connected, we say where to connect (single-purpose page).
function cloudReady(){
  if(typeof storageAdapter==="undefined"||!storageAdapter.isServerMode()){
    setStatus("Not connected — open the game and use File ▸ Connect to server, then reload this page.","err");
    return false;
  }
  return true;
}
document.getElementById("btn-publish").addEventListener("click",function(){
  if(!cloudReady())return;
  var err=designerValidate();
  if(err){setStatus("Can't publish — "+err,"err");return;}
  setStatus("Publishing…","");
  storageAdapter.saveBlueprintToLibrary(fileOut(),function(e){
    if(e){setStatus("Publish failed: "+e+(String(e).indexOf("401")>=0?" — session expired; reconnect from the game.":""),"err");return;}
    dirty=false;
    setStatus("Published “"+bp.name+"” to your library (same name republishes over it).","ok");
  });
});
function closeLibModal(){var m=document.getElementById("lib-modal");if(m)m.remove();}
document.getElementById("btn-library").addEventListener("click",function(){
  if(!cloudReady())return;
  closeLibModal();
  var wrap=document.createElement("div");
  wrap.id="lib-modal";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 16px;";
  wrap.innerHTML="<div style='background:var(--bg1);border:1px solid var(--acc);border-radius:10px;max-width:560px;width:100%;max-height:75vh;overflow-y:auto;padding:16px;'>"
    +"<div style='display:flex;align-items:center;margin-bottom:12px;'><h2 style='flex:1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:0;'>&#9729; Your blueprint library</h2>"
    +"<button class='mini' id='lib-x'>&#215;</button></div>"
    +"<div id='lib-list' style='font-size:12px;color:var(--t2);'>Loading…</div></div>";
  document.body.appendChild(wrap);
  wrap.addEventListener("click",function(ev){if(ev.target===wrap)closeLibModal();});
  document.getElementById("lib-x").addEventListener("click",closeLibModal);
  storageAdapter.listBlueprintLibrary(function(e,list){
    var el=document.getElementById("lib-list");if(!el)return;
    if(e){el.innerHTML="<span style='color:var(--dng);'>Failed to load library: "+esc(e)+"</span>";return;}
    if(!list||!list.length){el.innerHTML="<em>Library is empty — Publish a blueprint to start it.</em>";return;}
    var h="",i;
    for(i=0;i<list.length;i++){
      var it=list[i],acts=(it.blueprint&&it.blueprint.acts||[]).length;
      h+="<div style='display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--brd);'>"
        +"<div style='flex:1;min-width:0;'><div style='font-size:13px;color:var(--t0);font-weight:bold;'>"+esc(it.name)
        +(it.public?" <span style='font-size:9px;color:var(--grn);border:1px solid var(--grn);border-radius:3px;padding:0 4px;vertical-align:middle;'>PUBLIC</span>":"")+"</div>"
        +"<div style='font-size:10px;color:var(--t2);'>"+acts+" act"+(acts===1?"":"s")+" · updated "+(it.updatedAt?new Date(it.updatedAt).toLocaleDateString():"?")+"</div></div>"
        +"<button class='mini' data-libopen='"+i+"'>Open</button>"
        +"<button class='mini del' data-libdel='"+i+"' data-slug='"+esc(it.slug)+"' title='Delete from library'>&#215;</button>"
        +"</div>";
    }
    el.innerHTML=h;
    el.addEventListener("click",function(ev){
      var t=ev.target,oi=t.getAttribute&&t.getAttribute("data-libopen"),di=t.getAttribute&&t.getAttribute("data-libdel");
      if(oi!=null){
        if(dirty&&!confirm("Discard unsaved changes?"))return;
        closeLibModal();loadBlueprintObject(list[parseInt(oi,10)].blueprint);
      }else if(di!=null){
        var slug=t.getAttribute("data-slug"),nm=list[parseInt(di,10)].name;
        if(!confirm("Delete “"+nm+"” from your cloud library? This cannot be undone."))return;
        storageAdapter.deleteBlueprintFromLibrary(slug,function(e2){
          if(e2){setStatus("Delete failed: "+e2,"err");return;}
          t.parentNode.parentNode.removeChild(t.parentNode);
          setStatus("Deleted “"+nm+"” from the library.","ok");
        });
      }
    });
  });
});

// ── Test seam (#192 — satellite testability rule 2026-07-29; the designer owed one) ────────
// Drives the real page logic headlessly / in the preview pane: no picker, no gesture. The pure
// halves (normalize/validate/roster assembly) live in game.js and are engine-tested; this seam
// reaches the page's own working state and its field-routing boundary.
window.__bpdTest={
  getBp:function(){return bp;},
  load:function(obj){loadBlueprintObject(obj);},
  out:function(){return fileOut();},
  validate:function(){return designerValidate();},
  fieldGet:function(s,i,j,k){return bpFieldGet(s,i,j,k);},
  fieldSet:function(s,i,j,k,v){bpFieldSet(s,i,j,k,v);},
  blankCustomClass:blankCustomClass,
  availRename:availRename,
  rerender:function(){render();}
};

// ── Boot ───────────────────────────────────────────────────────────────────────
if(typeof loadProviderSettings==="function")loadProviderSettings(); // API key/provider for the LLM features
wireLlmSelect(); // after loadProviderSettings — the choices come from the loaded keys/overrides
document.getElementById("ver").textContent=BP_DESIGNER_VERSION+(typeof APP_VERSION!=="undefined"?" · engine "+APP_VERSION:"");
// Boot: restore the working draft if one exists — reload continues where you were (New = blank).
var _draft=null;try{_draft=JSON.parse(localStorage.getItem(DRAFT_K)||"null");}catch(e){}
if(_draft&&_draft.bp&&_draft.bp.format){
  bp=normalizeBlueprint(_draft.bp);dirty=!!_draft.dirty;render();
  setStatus((bp.name||"Untitled blueprint")+" — restored from draft"+(dirty?" (unsaved changes)":""),"");
}else{
  bp=blankBp();render();setStatus("New blueprint — or Load an existing .blueprint file.","");
}
</script>
