<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blueprint Designer — Traffic and Dragons</title>
<!--
  Blueprint Designer (BLUEPRINT_EDITOR.md, D5 revised 2026-07-03: fully EXTERNAL page).
  Loads the REAL engine data/logic via <script src> (the test.html / todo-viewer.html pattern):
  data.js supplies TONES/AUTHORS, game.js supplies normalizeBlueprint/normalizeToneId/validateBlueprint.
  Shares localStorage with the app by same-origin (future: cloud library via storage-adapter,
  Generate mode via api.js). HARD RULE: this page never writes the game's state keys
  (tnd_core/sess/mem) — it reads engine data and emits .blueprint files only.
  ES5 only, string-concat HTML, no dependencies — same conventions as the app.
-->
<style>
/* Architectural-blueprint theme (2026-07-05, user request): cyanotype blues, light linework,
   graph-paper grid. Designer-only — the game keeps its amber identity. */
:root{--bg0:#0a1d33;--bg1:#0e2542;--bg2:#132e50;--bg3:#1a3a63;--brd:#27476e;--brd2:#3a5d8a;--t0:#eaf3fc;--t1:#b9d0e6;--t2:#7595b8;--acc:#8fc1e8;--dng:#e08a8a;--grn:#84c795;--r:6px;--font:"Segoe UI",system-ui,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg0);color:var(--t1);font-family:var(--font);font-size:14px;
  background-image:linear-gradient(rgba(143,193,232,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(143,193,232,.10) 1px,transparent 1px),linear-gradient(rgba(143,193,232,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(143,193,232,.045) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;}
#topbar{position:sticky;top:0;z-index:10;background:var(--bg1);border-bottom:1px solid var(--brd2);padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#topbar h1{font-size:16px;color:var(--t0);margin:0;flex:1;min-width:200px;}
#topbar h1 .ver{font-size:10px;color:var(--t2);font-weight:normal;margin-left:8px;}
.tbtn{padding:8px 16px;font-size:12px;font-family:var(--font);background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--r);color:var(--t1);cursor:pointer;}
.tbtn:hover{border-color:var(--acc);color:var(--acc);}
.tbtn.primary{background:var(--acc);border-color:var(--acc);color:#062038;font-weight:bold;}
.tbtn.primary:hover{color:#000;}
#statusline{width:100%;font-size:11px;min-height:15px;color:var(--t2);}
#statusline.err{color:var(--dng);}
#statusline.ok{color:var(--grn);}
main{max-width:880px;margin:0 auto;padding:18px 18px 80px;}
.sect{background:var(--bg1);border:1px solid var(--brd);border-radius:10px;padding:16px;margin-bottom:16px;}
.sect h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:0;cursor:pointer;user-select:none;}
.sect h2.open{margin-bottom:12px;}
.cardlbl{cursor:pointer;user-select:none;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);margin-bottom:3px;min-height:20px;}
/* Icon-only buttons (▲ ▼ × ⤢): fixed SQUARE with the glyph flex-centered (v0.7 report — the
   compressed v0.6 breakout rendered squished/off-center). Labels share the 20px min-height so
   fld and fldB rows stay aligned. Text buttons (Done/Open/…) keep plain .mini. */
.sq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;padding:0;font-size:11px;line-height:1;flex-shrink:0;}
input[type=text],select,textarea{width:100%;padding:8px 10px;font-size:13px;font-family:var(--font);background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r);color:var(--t0);outline:none;}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--acc);}
textarea{resize:vertical;min-height:56px;line-height:1.5;}
.card{background:var(--bg2);border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.card.arc{background:var(--bg1);border-left-color:var(--brd2);margin:8px 0 8px 18px;}
.cardhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cardhead .cardlbl{flex:1;font-size:11px;color:var(--acc);font-weight:bold;text-transform:uppercase;letter-spacing:.06em;}
.card.arc .cardhead .cardlbl{color:var(--t2);}
.mini{padding:3px 9px;font-size:11px;font-family:var(--font);background:none;border:1px solid var(--brd2);border-radius:4px;color:var(--t2);cursor:pointer;}
.mini:hover{border-color:var(--acc);color:var(--acc);}
.mini.del:hover{border-color:var(--dng);color:var(--dng);}
.addbtn{padding:7px 14px;font-size:12px;font-family:var(--font);background:none;border:1px dashed var(--brd2);border-radius:var(--r);color:var(--t2);cursor:pointer;width:100%;}
.addbtn:hover{border-color:var(--acc);color:var(--acc);}
.fld{margin-bottom:8px;}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t1);cursor:pointer;margin-bottom:8px;}
.chk input{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}
.rowline{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;}
.rowline .grow{flex:1;}
#counts{font-size:11px;color:var(--t2);}
.empty{font-size:12px;color:var(--t2);font-style:italic;padding:6px 0 10px;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--bg0);}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px;}::-webkit-scrollbar-thumb:hover{background:var(--acc);}
</style>
</head>
<body>
<div id="topbar">
  <h1>&#129513; Blueprint Designer<span class="ver" id="ver"></span></h1>
  <button class="tbtn" id="btn-new">New</button>
  <button class="tbtn" id="btn-load">Load&hellip;</button>
  <button class="tbtn" id="btn-review">&#128269; Review</button>
  <button class="tbtn" id="btn-library">&#9729; Library&hellip;</button>
  <button class="tbtn" id="btn-publish">&#9729; Publish</button>
  <button class="tbtn primary" id="btn-save">&#8595; Save .blueprint</button>
  <div id="statusline"></div>
</div>
<main id="app"></main>
<input type="file" id="file-inp" accept=".blueprint,.campaign" style="display:none;">

<!-- Full engine chain in canonical order (v1.180) — state.js supplies store/keys/loadProviderSettings,
     storage-adapter the cloud library, api.js callGM/repairModelJson for the generate/review features.
     HARD RULE unchanged: this page never writes the game's state keys (no loadState/saveCore here). -->
<script src="globals.js"></script>
<script src="data.js"></script>
<script src="helpers.js"></script>
<script src="state.js"></script>
<script src="storage-adapter.js"></script>
<script src="memory.js"></script>
<script src="api.js"></script>
<script src="game.js"></script>
<script>
// Designer version — SEPARATE from the game's APP_VERSION (user call 2026-07-05; the designer
// is its own tool). Bump on every designer change; the engine version rides as a suffix in the
// header because blueprint schema compatibility tracks the ENGINE, not this page.
var BP_DESIGNER_VERSION="v0.11";
var ARC_TYPES=["","combat","investigation","exploration","social"];
var bp=null,dirty=false;
// Collapse state (2026-07-05, "I really hate scrolling"): sections in secOpen (undefined = open),
// cards carry a `_c` flag ON the data object so collapse travels with moves/reorders. `_c` is
// VIEW state only — stripped from Save and Publish output by stripView(). Loading an existing
// blueprint starts fully collapsed (scroll relief + spoiler cover); New starts open.
var secOpen={};
function stripView(obj){return JSON.parse(JSON.stringify(obj,function(kk,vv){return kk&&kk.charAt(0)==="_"?undefined:vv;}));}
function collapseAll(){
  var i,j;
  for(i=0;i<bp.acts.length;i++){bp.acts[i]._c=1;for(j=0;j<(bp.acts[i].arcs||[]).length;j++)bp.acts[i].arcs[j]._c=1;}
  for(i=0;i<bp.npcs.length;i++)bp.npcs[i]._c=1;
  for(i=0;i<bp.creatures.length;i++)bp.creatures[i]._c=1;
  for(i=0;i<bp.locations.length;i++)bp.locations[i]._c=1;
}

// Delegates to the engine's escHtml (helpers.js) — which, unlike the old local copy, escapes
// SINGLE quotes. txt()/fldB build single-quoted attributes (value='…'), so an unescaped
// apostrophe closed the attribute early: "Tsuto's journal" rendered as "Tsuto" and — worse —
// editing such a field would have written the truncation back into the data (2026-07-05 report).
function esc(s){return escHtml(s==null?"":s);}
function blankArc(){return {title:"",objective:"",type:"",dnaHint:"",reward:""};}
function blankAct(){return {title:"",goal:"",turningPoint:"",reward:"",parallel:false,arcs:[blankArc()]};}
function blankBp(){return normalizeBlueprint({format:"tnd-blueprint-v1",name:"",author:"",proseAuthor:"",tone:"",startingLocation:"",startingRegion:"",premise:"",acts:[blankAct()],npcs:[],locations:[],creatures:[],rules:[]});}

function setStatus(msg,cls){var el=document.getElementById("statusline");el.textContent=msg||"";el.className=cls||"";}
// Dirty marker keeps the blueprint's NAME in the statusline and appends the flag (bug fix
// 2026-07-05: it used to replace the name with just "Unsaved changes"). Runs on every edit,
// so a rename updates the shown name live.
function markDirty(){dirty=true;setStatus((bp&&bp.name?bp.name:"Untitled blueprint")+" — unsaved changes","");}

// ── Rendering ──────────────────────────────────────────────────────────────────
function fld(label,inner){return "<div class='fld'><label>"+label+"</label>"+inner+"</div>";}
// Long-form fields get a ⤢ breakout button on the label — opens the large modal editor.
// The modal textarea carries the SAME data-sec/i/j/k attributes, so the existing delegated
// onField binding updates bp live while typing; Done just syncs the inline control back.
function fldB(label,sec,i,j,k,short,inner){
  return "<div class='fld'><label style='display:flex;align-items:center;gap:8px;'>"+label
    +"<button class='mini sq' data-op='breakout' data-i='"+i+"' data-j='"+j+"' data-bsec='"+sec+"' data-bk='"+k+"' data-blabel='"+esc(short)+"' title='Open large editor' style='margin-left:auto;'>&#10530;</button></label>"+inner+"</div>";
}
function txt(sec,i,j,k,val,ph){return "<input type='text' data-sec='"+sec+"' data-i='"+i+"' data-j='"+j+"' data-k='"+k+"' value='"+esc(val)+"'"+(ph?" placeholder='"+esc(ph)+"'":"")+"/>";}
function ta(sec,i,j,k,val,ph){return "<textarea data-sec='"+sec+"' data-i='"+i+"' data-j='"+j+"' data-k='"+k+"'"+(ph?" placeholder='"+esc(ph)+"'":"")+">"+esc(val)+"</textarea>";}
function movBtns(op,i,j){
  return "<button class='mini sq' data-op='up"+op+"' data-i='"+i+"' data-j='"+j+"' title='Move up'>&#9650;</button>"
       +"<button class='mini sq' data-op='down"+op+"' data-i='"+i+"' data-j='"+j+"' title='Move down'>&#9660;</button>"
       +"<button class='mini sq del' data-op='del"+op+"' data-i='"+i+"' data-j='"+j+"' title='Remove'>&#215;</button>";
}
// Collapsible chrome: section h2s and card labels toggle. Arrow is a text node inside the
// clickable element so e.target always carries the data-op.
function secH(key,label){var open=secOpen[key]!==false;return "<h2 class='"+(open?"open":"")+"' data-op='togsec' data-key='"+key+"'>"+(open?"&#9662;":"&#9656;")+" "+label+"</h2>";}
function cardHead(tsec,i,j,label,summary,btns){
  return "<div class='cardhead'><span class='cardlbl' data-op='togcard' data-tsec='"+tsec+"' data-i='"+i+"' data-j='"+j+"'>"
    +((tsec==="act"?bp.acts[i]._c:tsec==="arc"?bp.acts[i].arcs[j]._c:tsec==="npc"?bp.npcs[i]._c:tsec==="creature"?bp.creatures[i]._c:bp.locations[i]._c)?"&#9656;":"&#9662;")
    +" "+label+(summary?" &mdash; "+esc(summary):"")+"</span>"+btns+"</div>";
}
function render(){
  var h="",i,j;
  // Metadata
  var toneOpts="<option value=''>(none)</option>";for(i=0;i<TONES.length;i++){toneOpts+="<option value='"+TONES[i].id+"'"+(bp.tone===TONES[i].id?" selected":"")+">"+esc(TONES[i].nm)+"</option>";}
  var voiceOpts="";for(i=0;i<AUTHORS.length;i++){voiceOpts+="<option value='"+AUTHORS[i].id+"'"+(bp.proseAuthor===AUTHORS[i].id?" selected":"")+">"+esc(AUTHORS[i].nm)+"</option>";}
  h+="<div class='sect'>"+secH("meta","Blueprint"+(bp.name?" — "+esc(bp.name):""));
  if(secOpen.meta!==false){
    h+="<div class='grid2'>"
    +fld("Name *",txt("meta",0,0,"name",bp.name,"e.g. Rise of the Runelords"))
    +fld("Author (credit)",txt("meta",0,0,"author",bp.author,"who made this campaign"))
    +fld("World tone","<select data-sec='meta' data-i='0' data-j='0' data-k='tone'>"+toneOpts+"</select>")
    +fld("Prose voice (player can override)","<select data-sec='meta' data-i='0' data-j='0' data-k='proseAuthor'>"+voiceOpts+"</select>")
    +fld("Starting location",txt("meta",0,0,"startingLocation",bp.startingLocation,"e.g. Sandpoint"))
    +fld("Starting region",txt("meta",0,0,"startingRegion",bp.startingRegion,"e.g. Varisia"))
    +"</div>"
    +fldB("Premise *","meta",0,0,"premise","Premise",ta("meta",0,0,"premise",bp.premise,"One paragraph: the world, the threat, why it matters."));
  }
  h+="</div>";
  // Acts
  h+="<div class='sect'>"+secH("story","Story — Acts &amp; Arcs");
  if(secOpen.story!==false){
  if(!bp.acts.length)h+="<div class='empty'>No acts yet. A blueprint needs at least one.</div>";
  for(i=0;i<bp.acts.length;i++){
    var a=bp.acts[i];
    h+="<div class='card'>"+cardHead("act",i,0,"Act "+(i+1),a.title,movBtns("act",i,0));
    if(!a._c){
      h+="<div class='grid2'>"+fld("Title *",txt("act",i,0,"title",a.title,""))+fldB("Goal *","act",i,0,"goal","Act "+(i+1)+" goal",txt("act",i,0,"goal",a.goal,"what this act is about"))+"</div>"
      +fldB("Turning point (ends the act)","act",i,0,"turningPoint","Act "+(i+1)+" turning point",txt("act",i,0,"turningPoint",a.turningPoint,"the event that closes this act"))
      +fldB("Act reward (optional — bigger than an arc's)","act",i,0,"reward","Act "+(i+1)+" reward",txt("act",i,0,"reward",a.reward||"","a milestone grant: magic item, title, stronghold, major gold — or the key to the next act"))
      +"<label class='chk'><input type='checkbox' data-sec='act' data-i='"+i+"' data-j='0' data-k='parallel'"+(a.parallel?" checked":"")+"/> Parallel act — arcs can be pursued in any order</label>";
      for(j=0;j<(a.arcs||[]).length;j++){
        var r=a.arcs[j];
        h+="<div class='card arc'>"+cardHead("arc",i,j,"Arc "+(i+1)+"."+(j+1),r.title,movBtns("arc",i,j));
        if(!r._c){
          var typeOpts="";for(var ti=0;ti<ARC_TYPES.length;ti++){typeOpts+="<option value='"+ARC_TYPES[ti]+"'"+(r.type===ARC_TYPES[ti]?" selected":"")+">"+(ARC_TYPES[ti]||"(unset)")+"</option>";}
          h+="<div class='grid2'>"+fld("Title *",txt("arc",i,j,"title",r.title,""))+fld("Type","<select data-sec='arc' data-i='"+i+"' data-j='"+j+"' data-k='type'>"+typeOpts+"</select>")+"</div>"
          +fldB("Objective *","arc",i,j,"objective","Arc "+(i+1)+"."+(j+1)+" objective",txt("arc",i,j,"objective",r.objective,"what completing this arc means"))
          +fldB("Arc reward (optional)","arc",i,j,"reward","Arc "+(i+1)+"."+(j+1)+" reward",txt("arc",i,j,"reward",r.reward||"","loot, gold, an ability — or the prop a later arc needs; granted when the arc completes"))
          +fldB("DNA hint (how the GM should RUN this arc — optional)","arc",i,j,"dnaHint","Arc "+(i+1)+"."+(j+1)+" DNA hint",ta("arc",i,j,"dnaHint",r.dnaHint||"","author-sensibility directive; blank = generic type hint at play time"));
        }
        h+="</div>";
      }
      h+="<button class='addbtn' data-op='addarc' data-i='"+i+"' data-j='0'>+ Add arc to Act "+(i+1)+"</button>";
    }
    h+="</div>";
  }
  h+="<button class='addbtn' data-op='addact' data-i='0' data-j='0'>+ Add act</button>";
  }
  h+="</div>";
  // NPCs
  h+="<div class='sect'>"+secH("npcs","Seeded NPCs ("+bp.npcs.length+")");
  if(secOpen.npcs!==false){
  if(!bp.npcs.length)h+="<div class='empty'>None — the GM will invent everyone.</div>";
  for(i=0;i<bp.npcs.length;i++){
    var n=bp.npcs[i];
    h+="<div class='card'>"+cardHead("npc",i,0,esc(n.name||("NPC "+(i+1))),n.role,movBtns("npc",i,0));
    if(!n._c){
      h+="<div class='grid2'>"+fld("Name *",txt("npc",i,0,"name",n.name,""))+fld("Role",txt("npc",i,0,"role",n.role,"ally / enemy / neutral / …"))
      +fld("Pronouns",txt("npc",i,0,"pronouns",n.pronouns,"they/them"))+"</div>"
      +fldB("Notes (what the GM knows about them)","npc",i,0,"notes","NPC: "+(n.name||"notes"),ta("npc",i,0,"notes",n.notes,""));
    }
    h+="</div>";
  }
  h+="<button class='addbtn' data-op='addnpc' data-i='0' data-j='0'>+ Add NPC</button>";
  }
  h+="</div>";
  // Creatures (v1.176 — the campaign bestiary; monster-manual-inspired fields)
  h+="<div class='sect'>"+secH("creatures","Bestiary — Seeded Creatures ("+bp.creatures.length+")");
  if(secOpen.creatures!==false){
  h+="<button class='addbtn' data-op='gencreature' data-i='0' data-j='0' style='margin-bottom:10px;'>&#10024; Generate creature from story</button>";
  if(!bp.creatures.length)h+="<div class='empty'>None — the GM will invent the wildlife.</div>";
  for(i=0;i<bp.creatures.length;i++){
    var C=bp.creatures[i];
    h+="<div class='card'>"+cardHead("creature",i,0,esc(C.name||("Creature "+(i+1))),C.kind,movBtns("creature",i,0));
    if(!C._c){
      h+="<div class='grid2'>"+fld("Name *",txt("creature",i,0,"name",C.name,""))+fld("Kind",txt("creature",i,0,"kind",C.kind||"","beast / undead / aberration / construct / …"))+"</div>"
      +fld("Threat",txt("creature",i,0,"threat",C.threat||"","low / moderate / deadly / apex — or a CR"))
      +fldB("Notes (nature, behaviour, tactics, weaknesses)","creature",i,0,"notes","Creature: "+(C.name||"notes"),ta("creature",i,0,"notes",C.notes||"","what makes this creature ITSELF — habits, hunting style, what it fears, how it dies"));
    }
    h+="</div>";
  }
  h+="<button class='addbtn' data-op='addcreature' data-i='0' data-j='0'>+ Add creature</button>";
  }
  h+="</div>";
  // Locations
  h+="<div class='sect'>"+secH("locs","Seeded Locations ("+bp.locations.length+")");
  if(secOpen.locs!==false){
  if(!bp.locations.length)h+="<div class='empty'>None — locations emerge in play.</div>";
  for(i=0;i<bp.locations.length;i++){
    var L=bp.locations[i];
    h+="<div class='card'>"+cardHead("loc",i,0,esc(L.name||("Location "+(i+1))),null,movBtns("loc",i,0));
    if(!L._c){
      h+=fld("Name *",txt("loc",i,0,"name",L.name,""))
      +fldB("Canonical description","loc",i,0,"description","Location: "+(L.name||"description"),ta("loc",i,0,"description",L.description,"injected as the location's permanent description"));
    }
    h+="</div>";
  }
  h+="<button class='addbtn' data-op='addloc' data-i='0' data-j='0'>+ Add location</button>";
  }
  h+="</div>";
  // Rules
  h+="<div class='sect'>"+secH("rules","Custom Narrative Rules ("+bp.rules.length+")");
  if(secOpen.rules!==false){
  if(!bp.rules.length)h+="<div class='empty'>None — the default rules still apply.</div>";
  for(i=0;i<bp.rules.length;i++){
    h+="<div class='rowline'><div class='grow'>"+ta("rule",i,0,"",bp.rules[i],"a hard rule the GM must follow in this campaign")+"</div>"
      +"<button class='mini sq' data-op='breakout' data-i='"+i+"' data-j='0' data-bsec='rule' data-bk='' data-blabel='Rule "+(i+1)+"' title='Open large editor'>&#10530;</button>"
      +movBtns("rule",i,0)+"</div>";
  }
  h+="<button class='addbtn' data-op='addrule' data-i='0' data-j='0'>+ Add rule</button>";
  }
  h+="<div id='counts' style='margin-top:12px;'></div></div>";
  // Review — CBB list (v0.8). Ships WITH the blueprint (playtester notes); engine never reads it.
  if(bp.review&&bp.review.findings&&bp.review.findings.length){
    var openN=0;for(i=0;i<bp.review.findings.length;i++){if(!bp.review.findings[i].status)openN++;}
    var revOpen=secOpen.review!==false;
    h+="<div class='sect'><div style='display:flex;align-items:center;gap:8px;"+(revOpen?"margin-bottom:12px;":"")+"'>"
      +"<h2 class='"+(revOpen?"open":"")+"' data-op='togsec' data-key='review' style='flex:1;margin:0;'>"+(revOpen?"&#9662;":"&#9656;")+" &#128269; Review — could be better ("+openN+" open of "+bp.review.findings.length+")</h2>"
      +(_applyingAll?"<span style='font-size:11px;color:var(--t2);'>applying all…</span>":(openN?"<button class='mini' data-op='revapplyall' data-i='0' data-j='0' title='Apply every open fix, top to bottom'>&#9889; Apply all fixes</button>":""))
      +"<button class='mini sq del' data-op='revdelall' data-i='0' data-j='0' title='Delete the entire review'>&#215;</button></div>";
    if(revOpen){
      if(bp.review.verdict)h+="<div style='font-size:13px;color:var(--t0);font-style:italic;margin-bottom:12px;'>"+esc(bp.review.verdict)+"</div>";
      for(i=0;i<bp.review.findings.length;i++){
        var F=bp.review.findings[i],sevCol=F.sev==="HIGH"?"var(--dng)":F.sev==="LOW"?"var(--t2)":"var(--acc)";
        var done=F.status==="applied",busy=F.status==="applying";
        h+="<div class='card' style='border-left-color:"+sevCol+";"+(done?"opacity:.55;":"")+"'>"
          +"<div class='cardhead'><span class='cardlbl' style='color:"+sevCol+";cursor:default;'>["+esc(F.sev)+"] "+esc(F.section)+(done?" <span style='color:var(--grn);font-size:9px;border:1px solid var(--grn);border-radius:3px;padding:0 4px;vertical-align:middle;'>APPLIED</span>":"")+"</span>"
          +(done||busy||_applyingAll?"":"<button class='mini' data-op='revapply' data-i='"+i+"' data-j='0' title='Have the AI apply this fix'>&#9889; Apply fix</button>")
          +(busy?"<span style='font-size:11px;color:var(--t2);'>applying…</span>":"")
          +"<button class='mini sq del' data-op='revdel' data-i='"+i+"' data-j='0' title='Dismiss this finding'>&#215;</button></div>"
          +"<div style='font-size:13px;"+(done?"text-decoration:line-through;":"")+"'><span style='color:var(--t2);'>Issue:</span> "+esc(F.issue)+"</div>"
          +"<div style='font-size:13px;margin-top:4px;"+(done?"text-decoration:line-through;":"")+"'><span style='color:var(--t2);'>Fix:</span> "+esc(F.fix)+"</div>"
          +(F.note?"<div style='font-size:12px;margin-top:6px;color:var(--grn);'>&#10003; "+esc(F.note)+"</div>":"")
          +"</div>";
      }
    }
    h+="</div>";
  }
  document.getElementById("app").innerHTML=h;
  updateCounts();
}
function updateCounts(){
  var arcs=0,i;for(i=0;i<bp.acts.length;i++)arcs+=(bp.acts[i].arcs||[]).length;
  var el=document.getElementById("counts");
  if(el)el.textContent=bp.acts.length+" acts · "+arcs+" arcs · "+bp.npcs.length+" NPCs · "+bp.creatures.length+" creatures · "+bp.locations.length+" locations · "+bp.rules.length+" rules";
}

// ── Field binding (delegated) ──────────────────────────────────────────────────
// ONE routing table for field access. onField (writes), bpFieldGet (breakout reads), and
// bpFieldSet all go through it — adding a new section means adding ONE line here, and the
// breakout works for it automatically. (Born from the bestiary-notes bug, 2026-07-05: the
// breakout had its own private sec routing that knew meta/act/arc only, so opening a
// creature's notes read "" and Done synced the emptiness back — duplicated routing, split
// brains. Rules are an array of strings, not objects, so they stay a special case in get/set.)
var FIELD_ROOTS={
  meta:function(i,j){return bp;},
  act:function(i,j){return bp.acts[i];},
  arc:function(i,j){return bp.acts[i]&&bp.acts[i].arcs[j];},
  npc:function(i,j){return bp.npcs[i];},
  creature:function(i,j){return bp.creatures[i];},
  loc:function(i,j){return bp.locations[i];}
};
function bpFieldGet(sec,i,j,k){
  if(sec==="rule")return i<bp.rules.length?(bp.rules[i]||""):"";
  var f=FIELD_ROOTS[sec],o=f&&f(i,j);
  return o?(o[k]||""):"";
}
function bpFieldSet(sec,i,j,k,v){
  if(sec==="rule"){if(i<bp.rules.length)bp.rules[i]=v;return;}
  var f=FIELD_ROOTS[sec],o=f&&f(i,j);
  if(o)o[k]=v;
}
function onField(e){
  var t=e.target,sec=t.getAttribute("data-sec");if(!sec)return;
  var i=parseInt(t.getAttribute("data-i"),10)||0,j=parseInt(t.getAttribute("data-j"),10)||0,k=t.getAttribute("data-k");
  var v=t.type==="checkbox"?t.checked:t.value;
  bpFieldSet(sec,i,j,k,v);
  markDirty();
  if(sec==="rule"||k==="name"&&sec!=="meta")return; // card labels refresh on next structural render
  updateCounts();
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);

// ── Structural ops (delegated) ─────────────────────────────────────────────────
function move(arr,from,delta){var to=from+delta;if(to<0||to>=arr.length)return;var x=arr.splice(from,1)[0];arr.splice(to,0,x);}
document.addEventListener("click",function(e){
  var t=e.target,op=t.getAttribute&&t.getAttribute("data-op");if(!op)return;
  var i=parseInt(t.getAttribute("data-i"),10)||0,j=parseInt(t.getAttribute("data-j"),10)||0;
  if(op==="breakout"){openBreakout(t);return;}
  if(op==="gencreature"){genCreature(t);return;}
  if(op==="revapply"){applyFinding(i);return;}
  if(op==="revdel"){bp.review.findings.splice(i,1);if(!bp.review.findings.length)delete bp.review;markDirty();render();return;}
  if(op==="revapplyall"){applyAllFindings();return;}
  if(op==="revdelall"){if(!confirm("Delete the entire review ("+bp.review.findings.length+" finding"+(bp.review.findings.length===1?"":"s")+")? This removes the CBB notes from the blueprint."))return;delete bp.review;markDirty();render();setStatus("Review deleted.","");return;}
  // Collapse toggles — pure view state, no markDirty.
  if(op==="togsec"){var sk2=t.getAttribute("data-key");secOpen[sk2]=(secOpen[sk2]===false);render();return;}
  if(op==="togcard"){
    var ts=t.getAttribute("data-tsec");
    var co=ts==="act"?bp.acts[i]:ts==="arc"?(bp.acts[i]&&bp.acts[i].arcs[j]):ts==="npc"?bp.npcs[i]:ts==="creature"?bp.creatures[i]:bp.locations[i];
    if(co){co._c=co._c?0:1;render();}
    return;
  }
  if(op==="addact")bp.acts.push(blankAct());
  else if(op==="delact"){if(!confirm("Remove Act "+(i+1)+" and its arcs?"))return;bp.acts.splice(i,1);}
  else if(op==="upact")move(bp.acts,i,-1);
  else if(op==="downact")move(bp.acts,i,1);
  else if(op==="addarc")bp.acts[i].arcs.push(blankArc());
  else if(op==="delarc"){if(bp.acts[i].arcs.length<=1&&!confirm("Every act needs at least one arc — remove anyway?"))return;bp.acts[i].arcs.splice(j,1);}
  else if(op==="uparc")move(bp.acts[i].arcs,j,-1);
  else if(op==="downarc")move(bp.acts[i].arcs,j,1);
  else if(op==="addnpc")bp.npcs.push({name:"",role:"neutral",pronouns:"they/them",notes:""});
  else if(op==="delnpc")bp.npcs.splice(i,1);
  else if(op==="upnpc")move(bp.npcs,i,-1);
  else if(op==="downnpc")move(bp.npcs,i,1);
  else if(op==="addcreature")bp.creatures.push({name:"",kind:"",threat:"",notes:""});
  else if(op==="delcreature")bp.creatures.splice(i,1);
  else if(op==="upcreature")move(bp.creatures,i,-1);
  else if(op==="downcreature")move(bp.creatures,i,1);
  else if(op==="addloc")bp.locations.push({name:"",description:""});
  else if(op==="delloc")bp.locations.splice(i,1);
  else if(op==="uploc")move(bp.locations,i,-1);
  else if(op==="downloc")move(bp.locations,i,1);
  else if(op==="addrule")bp.rules.push("");
  else if(op==="delrule")bp.rules.splice(i,1);
  else if(op==="uprule")move(bp.rules,i,-1);
  else if(op==="downrule")move(bp.rules,i,1);
  else return;
  markDirty();render();
});

// ── Breakout editor — large modal for long-form fields ─────────────────────────
// Reads/writes through the shared FIELD_ROOTS routing (see Field binding above) — the modal
// has NO routing of its own, so every section that renders fields gets a working breakout.
function closeBreakout(){var m=document.getElementById("bo-modal");if(m)m.remove();}
function openBreakout(btn){
  closeBreakout();
  var sec=btn.getAttribute("data-bsec"),i=parseInt(btn.getAttribute("data-i"),10)||0,j=parseInt(btn.getAttribute("data-j"),10)||0;
  var k=btn.getAttribute("data-bk"),label=btn.getAttribute("data-blabel")||k;
  var wrap=document.createElement("div");
  wrap.id="bo-modal";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;";
  wrap.innerHTML="<div style='background:var(--bg1);border:1px solid var(--acc);border-radius:10px;width:min(900px,94vw);padding:14px;display:flex;flex-direction:column;gap:10px;'>"
    +"<div style='display:flex;align-items:center;'><span style='font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);flex:1;'>"+esc(label)+"</span><button class='mini' id='bo-done'>Done</button></div>"
    +"<textarea id='bo-ta' data-sec='"+sec+"' data-i='"+i+"' data-j='"+j+"' data-k='"+k+"' style='height:55vh;min-height:180px;resize:vertical;font-size:14px;line-height:1.6;'></textarea>"
    +"<div style='font-size:10px;color:var(--t2);'>Edits apply live &middot; drag the bottom-right corner to resize &middot; Esc or click outside to close</div></div>";
  document.body.appendChild(wrap);
  var taEl=document.getElementById("bo-ta");
  taEl.value=bpFieldGet(sec,i,j,k); // the shared onField binding takes it from here (same data attrs)
  taEl.focus();
  function done(){
    // Sync the inline control directly instead of render() — a full re-render would dump scroll position.
    var els=document.querySelectorAll("[data-sec='"+sec+"'][data-i='"+i+"'][data-j='"+j+"'][data-k='"+k+"']"),x;
    for(x=0;x<els.length;x++){if(els[x]!==taEl)els[x].value=bpFieldGet(sec,i,j,k);}
    document.removeEventListener("keydown",onEsc);
    closeBreakout();
  }
  function onEsc(ev){if(ev.key==="Escape")done();}
  document.getElementById("bo-done").addEventListener("click",done);
  wrap.addEventListener("click",function(ev){if(ev.target===wrap)done();});
  document.addEventListener("keydown",onEsc);
}

// ── LLM features (v1.180): generate creature + review ─────────────────────────
// Both use callGM with sysOverride + noHistory — one self-contained message, no game
// state touched, telemetry under kind:"other". API key rides in from the app's provider
// settings (loadProviderSettings at boot, same-origin localStorage).
function llmReady(){
  if(typeof callGM!=="function"){setStatus("Engine API layer not loaded.","err");return false;}
  if(!(providerKeys[activeProvider]||apiKey)){setStatus("No API key — open the game, set one (Dev Mode ▸ 🧠 Language Model…), then reload this page.","err");return false;}
  return true;
}
// Compact story context — what the model needs to invent IN SERVICE to this campaign,
// nothing else. Existing creatures included so it complements instead of duplicating.
function storyContext(){
  var L=["CAMPAIGN BLUEPRINT:","Name: "+(bp.name||"(unnamed)"),"Tone: "+(bp.tone||"unset"),"Premise: "+(bp.premise||"(none)")],i,j;
  for(i=0;i<bp.acts.length;i++){var a=bp.acts[i],arcs=[];
    for(j=0;j<(a.arcs||[]).length;j++)arcs.push(a.arcs[j].title+(a.arcs[j].objective?" ("+a.arcs[j].objective+")":""));
    L.push("Act "+(i+1)+": "+a.title+" — "+a.goal+(arcs.length?" | Arcs: "+arcs.join("; "):""));}
  if(bp.locations.length)L.push("Locations: "+bp.locations.map(function(x){return x.name;}).join(", "));
  if(bp.creatures.length)L.push("Existing bestiary (do NOT duplicate): "+bp.creatures.map(function(c){return c.name+(c.kind?" ("+c.kind+(c.threat?", "+c.threat:"")+")":"");}).join("; "));
  return L.join("\n");
}
async function genCreature(btn){
  if(!llmReady())return;
  btn.disabled=true;btn.textContent="Consulting the story…";setStatus("Generating a creature in service to the story…","");
  try{
    var msg=storyContext()
      +"\n\nTASK: Invent exactly ONE new creature for this campaign's bestiary, IN SERVICE to the story above."
      +"\n- It must plausibly belong to this campaign's regions, factions, tone, and conflicts. Never inject an off-theme creature because it is cool: no named tyrannosaur in a goblin-centric dungeon crawl."
      +"\n- It may be humble (a rodent of unusual size that plagues the same cellars the plot visits) or unique and mythic (a rodent of mythic proportions) — pick the scale the story most lacks right now, considering the existing bestiary."
      +"\n- notes = its nature, behaviour, tactics, and weaknesses/how it dies, 2-4 sentences, written as GM guidance. CHARACTER, not stats — the engine handles stats separately."
      +"\n- kind = one or two words (beast/undead/aberration/construct/monstrosity/...); threat = low/moderate/deadly/apex or a CR."
      +"\nOutput ONLY this JSON object: {\"name\":\"\",\"kind\":\"\",\"threat\":\"\",\"notes\":\"\"}";
    var resp=await callGM(msg,"You design bestiary entries for tabletop RPG campaign blueprints. Output ONLY one valid JSON object — no markdown, no prose, no code fences.",500,null,{noHistory:true,kind:"other"});
    var c=JSON.parse(repairModelJson(resp));
    if(!c||!c.name)throw new Error("model returned no usable creature");
    bp.creatures.push({name:String(c.name),kind:String(c.kind||""),threat:String(c.threat||""),notes:String(c.notes||"")});
    markDirty();render();
    setStatus("Added “"+c.name+"” to the bestiary — it's yours now: review, edit, or delete freely.","ok");
  }catch(e){setStatus("Creature generation failed: "+e.message,"err");}
  var b2=document.querySelector("[data-op='gencreature']");
  if(b2){b2.disabled=false;b2.innerHTML="✨ Generate creature from story";}
}
// Review v2 (designer v0.8): structured findings written INTO bp.review — a persistent
// CBB ("could be better") list that ships with the file for playtesters. Invisible to the
// engine (canary engine test enforces it). Each finding: ✗ dismiss, or ⚡ Apply fix (LLM
// applies it via bounded section replacement, below). A fresh review replaces the old list.
// Engine-contract block calibrates the reviewer: it must not flag what the RUNTIME already
// provides (first live run dinged parallel acts — which buildSkeletonBlock explains per-turn).
var ENGINE_CONTRACT="ENGINE CONTRACT — the game runtime ALREADY handles all of the following; do NOT raise findings about them:\n"
  +"- parallel:true acts: the engine injects full parallel-play instructions every turn (arcs active simultaneously, player chooses, GM weaves hooks).\n"
  +"- Arc/act rewards: the engine instructs the GM to grant them in the same response as the completion emission; reward mechanics never need explaining in the blueprint.\n"
  +"- Arc types: the engine supplies generic type guidance (combat/investigation/exploration/social) when no dnaHint exists.\n"
  +"- Location descriptions: injected permanently and verbatim whenever the party is there; they need no delivery mechanism.\n"
  +"- Creatures: injected into every prompt as a canonical bestiary; NPC notes become the GM's private knowledge base; rules are injected every turn.\n"
  +"- Stats, dice, HP, XP, leveling, combat mechanics: entirely engine-side; blueprints carry CHARACTER, never numbers.\n"
  +"THE SCHEMA IS FIXED. Never propose new fields, sections, or structures — the engine reads exactly the fields that exist, and anything else is dead data it will never deliver to the GM. Express every fix as an edit to EXISTING fields. In particular: an NPC's secrets, behavioral hooks, escalation guidance, and betrayal conditions all belong INSIDE its notes field — notes are delivered verbatim to the GM as that NPC's knowledge base, so 'add a secrets field' is wrong and 'rewrite the notes to include the secret and when it surfaces' is right.";
document.getElementById("btn-review").addEventListener("click",async function(){
  if(!llmReady())return;
  if(bp.review&&bp.review.findings&&bp.review.findings.some(function(f){return !f.status;})&&!confirm("A review with open findings exists — replace it with a fresh review?"))return;
  var btn=this;btn.disabled=true;setStatus("Submitting the blueprint for review…","");
  try{
    var payload=stripView(bp);delete payload.review;
    var msg="Review this TTRPG campaign blueprint. It is consumed by an AI Game Master: every gap you find is a gap the GM will fill by IMPROVISING — which causes canon drift over a long campaign.\n\nBLUEPRINT:\n"+JSON.stringify(payload,null,1)
      +"\n\n"+ENGINE_CONTRACT
      +"\n\nREVIEW CRITERIA, in priority order:"
      +"\n1. NAME-DROP violations: any person, place, faction, god, or thing referenced in the premise, notes, rules, or descriptions that is NOT defined anywhere in the blueprint. (Real bug class: a rule referenced 'the nine trickster gods' without naming them.)"
      +"\n2. Missing or empty high-value data: acts without concrete turning points, climactic arcs without rewards, NPCs without run-instructions or secrets, locations missing their load-bearing facts."
      +"\n3. Arcs that are PLACES rather than completable objectives (the engine can never complete those)."
      +"\n4. Rules that are vague, are lore-dumps rather than directives, or reference data the document doesn't contain."
      +"\n5. Drift risks: anything important a GM would have to invent — unnamed leaders of named factions, unexplained props, contradictions between sections, tone/voice mismatch."
      +"\n\nOutput ONLY this JSON (no markdown, no prose outside it), findings worst-first, MAX 10 findings, issue and fix each ONE tight sentence (the fix must be concrete enough to apply, not an essay):\n{\"verdict\":\"one blunt sentence\",\"findings\":[{\"sev\":\"HIGH|MED|LOW\",\"section\":\"which part of the blueprint\",\"issue\":\"what is wrong\",\"fix\":\"concrete, applyable instruction\"}]}";
    // 5000-token ceiling — a circuit breaker against runaway generation, NOT a length governor
    // (the prompt governs size: max 10 terse findings). The first live run truncated mid-array
    // at a 1600 cap (JSON parse error at ~5300 chars ≈ exactly 1600 tokens) — for JSON output,
    // amputation is total loss, so the ceiling sits far above any legitimate response.
    var resp=await callGM(msg,"You are a meticulous, blunt reviewer of TTRPG campaign blueprints. Output ONLY valid JSON in the requested shape. Keep every finding terse.",5000,null,{noHistory:true,kind:"other"});
    var rev=JSON.parse(repairModelJson(resp));
    if(!rev||!rev.findings)throw new Error("model returned no findings object");
    bp.review={verdict:String(rev.verdict||""),findings:rev.findings.map(function(f){return {sev:String(f.sev||"MED").toUpperCase(),section:String(f.section||""),issue:String(f.issue||""),fix:String(f.fix||""),status:""};})};
    markDirty();render();
    var sect=document.querySelector("[data-key='review']");if(sect)sect.scrollIntoView({behavior:"smooth"});
    setStatus("Review: "+bp.review.verdict,"ok");
  }catch(e){setStatus("Review failed: "+e.message,"err");}
  btn.disabled=false;
});
// Apply one finding — BOUNDED section replacement: the model returns ONLY the top-level
// sections it changed, complete and in-schema; we merge, normalize, validate, and ROLL BACK
// wholesale if the result doesn't validate. Applied findings stay (struck) as the CBB trail.
var BP_SECTIONS=["name","author","tone","proseAuthor","premise","startingLocation","startingRegion","acts","npcs","creatures","locations","rules"];
var _applyingAll=false; // suppresses per-finding Apply buttons + the Apply-all button while the batch runs
async function applyFinding(idx){
  if(!llmReady())return;
  var f=bp.review&&bp.review.findings[idx];if(!f||f.status)return;
  f.status="applying";render();setStatus("Applying fix: "+f.issue.slice(0,60)+"…","");
  try{
    var payload=stripView(bp);delete payload.review;
    var msg="Here is a TTRPG campaign blueprint:\n"+JSON.stringify(payload,null,1)
      +"\n\nAPPLY THIS REVIEW FINDING:\nSection: "+f.section+"\nIssue: "+f.issue+"\nFix to apply: "+f.fix
      +"\n\nApply the fix. Output ONLY a JSON object containing:\n- the top-level blueprint sections you CHANGED (any of: "+BP_SECTIONS.join(", ")+"), each COMPLETE in the same schema as the input (whole array/string, not a diff)\n- a \"note\" field: one line stating what you changed\nDo NOT include unchanged sections. Preserve everything unrelated to the fix exactly as it was.\nTHE SCHEMA IS FIXED: use exactly the field names the input uses — never invent new fields (no 'secrets', 'hooks', etc.). Content that a fix asks for goes INTO the existing fields (NPC secrets/hooks into that NPC's notes).";
    var resp=await callGM(msg,"You edit TTRPG campaign blueprints surgically. Output ONLY valid JSON. Change nothing beyond what the finding requires.",3000,null,{noHistory:true,kind:"other"});
    var patch=JSON.parse(repairModelJson(resp));
    var snapshot=JSON.parse(JSON.stringify(bp));
    var changed=[],k;
    for(k in patch){if(BP_SECTIONS.indexOf(k)>=0){
      // Shrink guard: a surgical fix must never EMPTY a section that had content — an empty
      // acts[] is technically valid (premise-only blueprints exist) but as a "fix" it's a wipe.
      if(Object.prototype.toString.call(bp[k])==="[object Array]"&&bp[k].length&&(!patch[k]||!patch[k].length)){bp=snapshot;throw new Error("fix tried to empty '"+k+"' — rolled back");}
      bp[k]=patch[k];changed.push(k);
    }}
    if(!changed.length)throw new Error("model returned no recognisable sections");
    normalizeBlueprint(bp);
    var err=validateBlueprint(bp);
    if(err){bp=snapshot;throw new Error("fix produced an invalid blueprint ("+err+") — rolled back");}
    bp.review.findings[idx].status="applied";
    if(patch.note)bp.review.findings[idx].note=String(patch.note);
    markDirty();render();
    setStatus("Applied ("+changed.join(", ")+")"+(patch.note?" — "+patch.note:""),"ok");
  }catch(e){
    if(bp.review&&bp.review.findings[idx])bp.review.findings[idx].status="";
    render();setStatus("Apply failed: "+e.message,"err");
  }
}
// Apply every open finding, top to bottom, SEQUENTIALLY — each fix is applied to the blueprint
// the previous fix produced, so they compound instead of clobbering. Failures roll back (per
// applyFinding's guards), stay open, and the batch continues past them.
async function applyAllFindings(){
  if(_applyingAll||!llmReady()||!bp.review)return;
  _applyingAll=true;render();
  var ok=0,fail=0,i;
  try{
    for(i=0;i<bp.review.findings.length;i++){
      if(!bp.review||!bp.review.findings[i]||bp.review.findings[i].status)continue;
      setStatus("Applying fix "+(ok+fail+1)+"…","");
      await applyFinding(i);
      if(bp.review&&bp.review.findings[i]&&bp.review.findings[i].status==="applied")ok++;else fail++;
    }
  }finally{_applyingAll=false;}
  render();
  setStatus("Apply all done: "+ok+" applied"+(fail?", "+fail+" failed and left open":"")+".",fail?"err":"ok");
}

// ── Cloud library (#15) ────────────────────────────────────────────────────────
// Publish = upsert to the personal library (server slugs by name — same name overwrites).
// Auth rides in from the APP's login via same-origin localStorage (autoConnect); the designer
// never does OAuth itself — if not connected, we say where to connect (single-purpose page).
function cloudReady(){
  if(typeof storageAdapter==="undefined"||!storageAdapter.isServerMode()){
    setStatus("Not connected — open the game and use File ▸ Connect to server, then reload this page.","err");
    return false;
  }
  return true;
}
document.getElementById("btn-publish").addEventListener("click",function(){
  if(!cloudReady())return;
  var err=designerValidate();
  if(err){setStatus("Can't publish — "+err,"err");return;}
  setStatus("Publishing…","");
  storageAdapter.saveBlueprintToLibrary(stripView(bp),function(e){
    if(e){setStatus("Publish failed: "+e+(String(e).indexOf("401")>=0?" — session expired; reconnect from the game.":""),"err");return;}
    dirty=false;
    setStatus("Published “"+bp.name+"” to your library (same name republishes over it).","ok");
  });
});
function closeLibModal(){var m=document.getElementById("lib-modal");if(m)m.remove();}
document.getElementById("btn-library").addEventListener("click",function(){
  if(!cloudReady())return;
  closeLibModal();
  var wrap=document.createElement("div");
  wrap.id="lib-modal";
  wrap.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px 16px;";
  wrap.innerHTML="<div style='background:var(--bg1);border:1px solid var(--acc);border-radius:10px;max-width:560px;width:100%;max-height:75vh;overflow-y:auto;padding:16px;'>"
    +"<div style='display:flex;align-items:center;margin-bottom:12px;'><h2 style='flex:1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--acc);margin:0;'>&#9729; Your blueprint library</h2>"
    +"<button class='mini' id='lib-x'>&#215;</button></div>"
    +"<div id='lib-list' style='font-size:12px;color:var(--t2);'>Loading…</div></div>";
  document.body.appendChild(wrap);
  wrap.addEventListener("click",function(ev){if(ev.target===wrap)closeLibModal();});
  document.getElementById("lib-x").addEventListener("click",closeLibModal);
  storageAdapter.listBlueprintLibrary(function(e,list){
    var el=document.getElementById("lib-list");if(!el)return;
    if(e){el.innerHTML="<span style='color:var(--dng);'>Failed to load library: "+esc(e)+"</span>";return;}
    if(!list||!list.length){el.innerHTML="<em>Library is empty — Publish a blueprint to start it.</em>";return;}
    var h="",i;
    for(i=0;i<list.length;i++){
      var it=list[i],acts=(it.blueprint&&it.blueprint.acts||[]).length;
      h+="<div style='display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--brd);'>"
        +"<div style='flex:1;min-width:0;'><div style='font-size:13px;color:var(--t0);font-weight:bold;'>"+esc(it.name)
        +(it.public?" <span style='font-size:9px;color:var(--grn);border:1px solid var(--grn);border-radius:3px;padding:0 4px;vertical-align:middle;'>PUBLIC</span>":"")+"</div>"
        +"<div style='font-size:10px;color:var(--t2);'>"+acts+" act"+(acts===1?"":"s")+" · updated "+(it.updatedAt?new Date(it.updatedAt).toLocaleDateString():"?")+"</div></div>"
        +"<button class='mini' data-libopen='"+i+"'>Open</button>"
        +"<button class='mini del' data-libdel='"+i+"' data-slug='"+esc(it.slug)+"' title='Delete from library'>&#215;</button>"
        +"</div>";
    }
    el.innerHTML=h;
    el.addEventListener("click",function(ev){
      var t=ev.target,oi=t.getAttribute&&t.getAttribute("data-libopen"),di=t.getAttribute&&t.getAttribute("data-libdel");
      if(oi!=null){
        if(dirty&&!confirm("Discard unsaved changes?"))return;
        closeLibModal();loadBlueprintObject(list[parseInt(oi,10)].blueprint);
      }else if(di!=null){
        var slug=t.getAttribute("data-slug"),nm=list[parseInt(di,10)].name;
        if(!confirm("Delete “"+nm+"” from your cloud library? This cannot be undone."))return;
        storageAdapter.deleteBlueprintFromLibrary(slug,function(e2){
          if(e2){setStatus("Delete failed: "+e2,"err");return;}
          t.parentNode.parentNode.removeChild(t.parentNode);
          setStatus("Deleted “"+nm+"” from the library.","ok");
        });
      }
    });
  });
});

// ── Boot ───────────────────────────────────────────────────────────────────────
if(typeof loadProviderSettings==="function")loadProviderSettings(); // API key/provider for the LLM features
document.getElementById("ver").textContent=BP_DESIGNER_VERSION+(typeof APP_VERSION!=="undefined"?" · engine "+APP_VERSION:"");
bp=blankBp();render();setStatus("New blueprint — or Load an existing .blueprint file.","");
</script>
</body>
</html>
