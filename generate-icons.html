<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Icon Generator</title></head>
<body style="background:#111;color:#c8922a;font-family:Georgia,serif;padding:24px;">
<h2>T&D Icon Generator</h2>
<p style="color:#888;margin:8px 0 20px;">Click the buttons to download the PNG icons needed for the PWA.</p>
<button onclick="gen(192)" style="margin-right:10px;padding:10px 20px;font-family:Georgia,serif;background:#c8922a;color:#000;border:none;border-radius:4px;cursor:pointer;">Download icon-192.png</button>
<button onclick="gen(512)" style="padding:10px 20px;font-family:Georgia,serif;background:#c8922a;color:#000;border:none;border-radius:4px;cursor:pointer;">Download icon-512.png</button>
<br><br>
<canvas id="cv" style="border:1px solid #333;margin-top:16px;max-width:256px;"></canvas>
<script>
function gen(size){
  var cv=document.getElementById("cv");
  cv.width=size;cv.height=size;
  var ctx=cv.getContext("2d");

  // Rounded background
  var r=size*0.176;
  ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
  ctx.fillStyle="#111111";ctx.fill();

  // Gradient overlay — amber top-right to black bottom-left at 5% opacity
  var grad=ctx.createLinearGradient(size,0,0,size);
  grad.addColorStop(0,"rgba(200,146,42,0.05)");
  grad.addColorStop(1,"rgba(0,0,0,0.05)");
  ctx.save();ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
  ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
  ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();ctx.restore();

  ctx.fillStyle="#c8922a";
  ctx.textAlign="center";
  ctx.textBaseline="alphabetic";

  var small=Math.round(size*0.135);
  var big=Math.round(size*0.43);

  ctx.textBaseline="middle";

  // Traffic — top zone center (y=12.5%)
  ctx.globalAlpha=0.6;
  ctx.font=small+"px Georgia,serif";
  ctx.fillText("Traffic",size/2,size*0.125);

  // Separator 1 at y=25%
  ctx.globalAlpha=0.3;
  ctx.strokeStyle="#c8922a";ctx.lineWidth=size*0.004;
  ctx.beginPath();ctx.moveTo(size*0.16,size*0.25);ctx.lineTo(size*0.84,size*0.25);ctx.stroke();

  // & — centered in full middle zone (y=50%)
  ctx.globalAlpha=1;
  ctx.font="bold "+big+"px Georgia,serif";
  ctx.fillText("&",size/2,size*0.5);

  // Separator 2 at y=75%
  ctx.globalAlpha=0.3;
  ctx.beginPath();ctx.moveTo(size*0.16,size*0.75);ctx.lineTo(size*0.84,size*0.75);ctx.stroke();

  // Dragons — bottom zone center (y=87.5%)
  ctx.globalAlpha=0.6;
  ctx.font=small+"px Georgia,serif";
  ctx.fillText("Dragons",size/2,size*0.875);
  ctx.globalAlpha=1;

  // Download
  var a=document.createElement("a");
  a.download="icon-"+size+".png";
  a.href=cv.toDataURL("image/png");
  a.click();
}
window.onload=function(){gen(512);};
</script>
</body>
</html>
