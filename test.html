<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Traffic and Dragons -- engine sanity test</title>
<!--
  TODO #14 — manual-run sanity page. No framework, no build, no CI. Open in a browser tab.
  The suites live in dev/engine-tests.js and run against the REAL engine files (same order
  as index.html, minus char-creation/ui/stt which wire the game DOM on load). The SAME
  suites gate every commit headlessly via dev/run-tests.js + .git/hooks/pre-commit.
  The script list below mirrors dev/load-engine.js FILES (the canonical ordered list —
  a browser page can't require it, so this copy is manual; the load guard in the reporter
  script names any file that goes missing instead of showering false-red assertions).
  NOT loaded by index.html; does not affect APP_VERSION/CACHE on its own.
  NOTE: the service worker runtime-caches same-origin GETs — if this page looks stale
  after an engine change, hard-refresh (Ctrl+Shift+R).
-->
<style>
  body{background:#111;color:#ccc;font-family:Georgia,serif;max-width:860px;margin:24px auto;padding:0 16px;}
  h1{color:#b8935a;font-size:20px;} h2{color:#b8935a;font-size:14px;margin:22px 0 6px;} /* no uppercase transform — section names are camelCase function names and must stay readable */
  #summary{padding:10px 14px;border-radius:8px;font-size:15px;margin:12px 0;border:1px solid #333;}
  #summary.ok{background:#10240f;border-color:#2c5c28;color:#7fbf78;}
  #summary.bad{background:#2a1010;border-color:#6a2020;color:#e07070;}
  .t{padding:4px 10px;font-size:13px;border-left:3px solid #2c5c28;margin:2px 0;background:#181818;}
  .t.fail{border-left-color:#8b2a2a;background:#1f1414;color:#e0a0a0;}
  .t .d{color:#777;font-size:11px;display:block;}
</style>
</head>
<body>
<h1 id="page-title">Traffic and Dragons -- engine sanity test</h1>
<div id="summary">Running…</div>
<div id="out"></div>

<!-- Real engine, same order as index.html (char-creation.js/ui.js/stt.js excluded: they wire
     the game DOM on load; tts.js IS loaded — the suites exercise its text-prep).
     Keep in step with dev/load-engine.js FILES (AUDIT_FABLE_07_16_2026 #17/#18). -->
<script src="globals.js"></script>
<script src="error-report.js"></script>
<script src="compress.js"></script>
<script src="data.js"></script>
<script src="capability_bible.js"></script>
<script src="class_bible.js"></script>
<script src="helpers.js"></script>
<script src="state.js"></script>
<script src="storage-adapter.js"></script>
<script src="memory.js"></script>
<script src="tag_table.js"></script>
<script src="api.js"></script>
<script src="campaign_generator.js"></script>
<script src="game.js"></script>
<script src="tts.js"></script>
<script src="dev/engine-tests.js"></script>

<script>
// Engine-load guard (#18): if a script tag above 404'd / a file was renamed / the list rots,
// name the missing file LOUDLY instead of showering dozens of mystery-red assertion failures
// (#17's failure mode — 55 false reds that would hide a real regression).
var __engineSyms=[["globals.js","APP_VERSION"],["compress.js","LZ"],["data.js","TONES"],
  ["capability_bible.js","CAPABILITY_BIBLE"],["helpers.js","skillLevel"],["state.js","blankMemory"],
  ["storage-adapter.js","storageAdapter"],["memory.js","resolveNpcName"],["tag_table.js","TAG_TABLE"],
  ["api.js","buildSysPrompt"],["campaign_generator.js","validateSkeletonStructure"],
  ["game.js","checkLevelUp"],["tts.js","TTS"],["dev/engine-tests.js","runEngineTests"]];
var __missing=[];
for(var __i=0;__i<__engineSyms.length;__i++){
  if(typeof window[__engineSyms[__i][1]]==="undefined")__missing.push(__engineSyms[__i][0]+" ("+__engineSyms[__i][1]+" is undefined)");
}
if(__missing.length){
  var __sum=document.getElementById("summary");
  __sum.className="bad";
  __sum.textContent="ENGINE FILE(S) FAILED TO LOAD: "+__missing.join(", ")+" — fix the <script> list above (mirror dev/load-engine.js FILES) before trusting anything on this page.";
  document.title="✗ ENGINE LOAD FAILED -- engine sanity test";
  throw new Error("engine load incomplete: "+__missing.join(", "));
}
// Browser reporter — renders each suite/assertion as a red/green row.
var __pageTitle="Traffic and Dragons "+APP_VERSION+" -- engine sanity test"; // live version from globals.js
document.getElementById("page-title").textContent=__pageTitle;
var __pass=0,__fail=0,__out=document.getElementById("out");
runEngineTests({
  section:function(name){var h=document.createElement("h2");h.textContent=name;__out.appendChild(h);},
  t:function(name,fn){
    var row=document.createElement("div");row.className="t";
    try{
      var r=fn();
      if(r===true||r===undefined){__pass++;row.textContent="✓ "+name;}
      else{__fail++;row.className="t fail";row.innerHTML="✗ "+name+'<span class="d">'+String(r).replace(/</g,"&lt;")+"</span>";}
    }catch(e){__fail++;row.className="t fail";row.innerHTML="✗ "+name+'<span class="d">threw: '+String(e.message).replace(/</g,"&lt;")+"</span>";}
    __out.appendChild(row);
  }
});
var s=document.getElementById("summary");
s.textContent=__fail===0?("ALL GREEN — "+__pass+" assertions passed"):(__fail+" FAILED / "+__pass+" passed");
s.className=__fail===0?"ok":"bad";
document.title=(__fail===0?"✓ ":"✗ ")+__pageTitle;
</script>
</body>
</html>
