<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Traffic and Dragons -- engine sanity test</title>
<!--
  TODO #14 — manual-run sanity page. No framework, no build, no CI. Open in a browser tab.
  The suites live in dev/engine-tests.js and run against the REAL engine files (same order
  as index.html, minus ui/tts/stt which need the game DOM). The SAME suites gate every
  commit headlessly via dev/run-tests.js + .git/hooks/pre-commit.
  NOT loaded by index.html; does not affect APP_VERSION/CACHE on its own.
  NOTE: the service worker runtime-caches same-origin GETs — if this page looks stale
  after an engine change, hard-refresh (Ctrl+Shift+R).
-->
<style>
  body{background:#111;color:#ccc;font-family:Georgia,serif;max-width:860px;margin:24px auto;padding:0 16px;}
  h1{color:#b8935a;font-size:20px;} h2{color:#b8935a;font-size:14px;margin:22px 0 6px;} /* no uppercase transform — section names are camelCase function names and must stay readable */
  #summary{padding:10px 14px;border-radius:8px;font-size:15px;margin:12px 0;border:1px solid #333;}
  #summary.ok{background:#10240f;border-color:#2c5c28;color:#7fbf78;}
  #summary.bad{background:#2a1010;border-color:#6a2020;color:#e07070;}
  .t{padding:4px 10px;font-size:13px;border-left:3px solid #2c5c28;margin:2px 0;background:#181818;}
  .t.fail{border-left-color:#8b2a2a;background:#1f1414;color:#e0a0a0;}
  .t .d{color:#777;font-size:11px;display:block;}
</style>
</head>
<body>
<h1 id="page-title">Traffic and Dragons -- engine sanity test</h1>
<div id="summary">Running…</div>
<div id="out"></div>

<!-- Real engine, same order as index.html (ui.js/tts.js/stt.js excluded: they wire the game DOM on load) -->
<script src="globals.js"></script>
<script src="data.js"></script>
<script src="helpers.js"></script>
<script src="state.js"></script>
<script src="memory.js"></script>
<script src="tag_table.js"></script>
<script src="api.js"></script>
<script src="campaign_generator.js"></script>
<script src="game.js"></script>
<script src="dev/engine-tests.js"></script>

<script>
// Browser reporter — renders each suite/assertion as a red/green row.
var __pageTitle="Traffic and Dragons "+APP_VERSION+" -- engine sanity test"; // live version from globals.js
document.getElementById("page-title").textContent=__pageTitle;
var __pass=0,__fail=0,__out=document.getElementById("out");
runEngineTests({
  section:function(name){var h=document.createElement("h2");h.textContent=name;__out.appendChild(h);},
  t:function(name,fn){
    var row=document.createElement("div");row.className="t";
    try{
      var r=fn();
      if(r===true||r===undefined){__pass++;row.textContent="✓ "+name;}
      else{__fail++;row.className="t fail";row.innerHTML="✗ "+name+'<span class="d">'+String(r).replace(/</g,"&lt;")+"</span>";}
    }catch(e){__fail++;row.className="t fail";row.innerHTML="✗ "+name+'<span class="d">threw: '+String(e.message).replace(/</g,"&lt;")+"</span>";}
    __out.appendChild(row);
  }
});
var s=document.getElementById("summary");
s.textContent=__fail===0?("ALL GREEN — "+__pass+" assertions passed"):(__fail+" FAILED / "+__pass+" passed");
s.className=__fail===0?"ok":"bad";
document.title=(__fail===0?"✓ ":"✗ ")+__pageTitle;
</script>
</body>
</html>
