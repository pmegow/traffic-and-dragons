<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic and Dragons — Campaign Map</title>
<!-- ─── MAP VIEWER SATELLITE (filed with TODO #154) ──────────────────────────────────────────
     Interactive view of the campaign's location graph — the GM's actual working geography:
     memory.map nodes + edges, sublocations clustered under parents, current party position,
     split members, NPC last-seen markers, and per-node stats on click. READ-ONLY by
     construction: this page never writes localStorage (the recall_gate discipline).
     Data sources, in precedence order:
       1. window.__mapTest.load(data)  — test seam (the no-untestable-surface rule)
       2. file import (.tnd export or raw {worldState,memory} JSON) — drag/drop or picker
       3. same-origin localStorage (tnd_mem_v10 + tnd_core_v10) — the LIVE view when opened
          on the deployed origin beside the game
     Like all satellites it must ride sw.js's network-first allowlist (the bug_tracker
     stale-pin lesson) — done in the same commit that created this file. -->
<style>
  :root{--bg:#0a0a0c;--bg2:#121214;--bg3:#1b1a1c;--bg4:#232124;--brd:#29272b;--brd2:#3a3537;--acc:#b8935a;--acc2:#ddb978;--t0:#eee7db;--t1:#b9b0a0;--t2:#777064;--bad:#b86b6b;--good:#80aa70;--r:8px;--font:'Segoe UI',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--t1);font-family:var(--font);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  #bar{display:flex;align-items:center;gap:18px;min-height:58px;padding:9px 18px;background:linear-gradient(180deg,#171619 0%,var(--bg2) 100%);border-bottom:1px solid var(--brd);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:2}
  #brand{display:flex;align-items:center;gap:11px;flex:0 0 auto}
  #brandmark{width:31px;height:31px;border:1px solid #4b402f;position:relative;transform:rotate(45deg);background:#19150f;box-shadow:inset 0 0 0 5px #121214}
  #brandmark:after{content:"";position:absolute;inset:9px;background:var(--acc);border-radius:50%}
  #bar h1{font-size:15px;color:var(--t0);font-weight:650;letter-spacing:.3px;line-height:1.1}
  #bar .muted{display:block;color:var(--acc);font-size:9px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px}
  #src{min-width:0;flex:1;font-size:11px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--brd);padding-left:18px}
  #src.live{color:var(--good)}
  #src.err{color:var(--bad)}
  #tools{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  #bar button,#bar label.btn{background:var(--bg3);color:var(--t1);border:1px solid var(--brd2);border-radius:6px;padding:7px 11px;font-size:11px;cursor:pointer;font-family:var(--font);transition:border-color .16s,background .16s,color .16s}
  #bar button:hover,#bar label.btn:hover{border-color:#725d3e;background:var(--bg4);color:var(--t0)}
  #bar button:focus-visible,#bar label.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
  #wrap{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0;background-color:var(--bg);background-image:radial-gradient(circle at 50% 45%,rgba(184,147,90,.055),transparent 36%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
  #stage>#svg{width:100%;height:100%;display:block;cursor:grab}
  #stage>#svg.panning{cursor:grabbing}
  #panel{width:360px;flex:0 0 360px;border-left:1px solid var(--brd);background:linear-gradient(180deg,#171619 0%,var(--bg2) 150px);overflow-y:auto;padding:21px 20px 28px;display:block;scrollbar-color:#4c4742 transparent;scrollbar-width:thin}
  #panel .panel-kicker{font-size:9px;color:var(--acc);font-weight:650;text-transform:uppercase;letter-spacing:1.7px;margin-bottom:9px}
  #panel h2{font-size:17px;color:var(--t0);font-weight:620;line-height:1.3;margin-bottom:4px}
  #panel .sub{font-size:10px;color:var(--t2);margin-bottom:16px;text-transform:uppercase;letter-spacing:1.15px}
  #panel .sec{margin:12px 0}
  #panel .sec h3{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  #panel .sec div,#panel .sec li{font-size:12px;line-height:1.5;color:var(--t1)}
  #panel .desc{font-size:12px;line-height:1.62;color:var(--t1);border-left:2px solid #4b4133;padding-left:10px}
  #panel .chip{display:block;font-size:10px;color:var(--acc2);letter-spacing:.8px;padding:3px 0 3px 9px;border-left:2px solid var(--acc);margin:0 0 5px;font-family:monospace;text-transform:uppercase}
  #panel .chip.away{border-left-color:var(--bad);color:#c88787}
  #panel a{color:var(--acc2);cursor:pointer;text-decoration:none}
  #panel a:hover{text-decoration:underline}
  #panel .dead{color:var(--t2);text-decoration:line-through}
  #panel ul{list-style:none}
  #panel .cascade ul{padding-left:14px}
  #panel .cascade>ul{padding-left:0}
  #panel .cascade summary{cursor:pointer;color:var(--t1)}
  #panel .cascade summary::marker{color:var(--acc)}
  #panel .cascade details{margin:1px 0}
  #panel .crec{border-left:2px solid var(--brd2);margin:4px 0 10px 3px;padding:2px 0 2px 10px}
  #panel .crec .sec{margin:8px 0}
  #panel .mk{font-size:10px;color:var(--acc2)}
  #panel .mk.away{color:var(--bad)}
  #panel .panel-empty{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 7px 60px;color:var(--t2)}
  #panel .empty-mark{width:58px;height:58px;border:1px solid #433a2d;transform:rotate(45deg);margin:0 0 30px 10px;position:relative;background:rgba(184,147,90,.035)}
  #panel .empty-mark:after{content:"";position:absolute;inset:20px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 7px #161514}
  #panel .panel-empty h2{font-size:19px;margin-bottom:8px}
  #panel .panel-empty p{font-size:12px;line-height:1.65;max-width:275px}
  #panel .empty-meta{margin-top:20px;padding-top:13px;border-top:1px solid var(--brd);font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:#8e8373}
  #legend{position:absolute;left:16px;bottom:16px;width:292px;background:rgba(18,18,20,.94);border:1px solid var(--brd);border-radius:var(--r);padding:12px 13px 11px;font-size:10.5px;color:var(--t2);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
  #legend .legend-title{display:flex;justify-content:space-between;align-items:baseline;color:var(--t0);font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
  #legend .legend-title span:last-child{color:var(--t2);font-size:8px;font-weight:500;letter-spacing:1.1px}
  #legend .legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  #legend .legend-item{display:flex;align-items:center;min-width:0;color:var(--t1);line-height:1.25}
  #legend .legend-item span{display:block}
  #legend .legend-item small{display:block;color:var(--t2);font-size:9px;margin-top:2px}
  #legend svg{width:16px;height:16px;display:block;flex:0 0 16px;cursor:default;margin-right:7px;overflow:visible}
  #legend .legend-note{border-top:1px solid var(--brd);margin-top:10px;padding-top:8px;font-size:9px;line-height:1.45;color:var(--t2)}
  #drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,13,13,.85);color:var(--acc);font-size:16px;border:2px dashed var(--acc);z-index:5;pointer-events:none}
  .nodeg{cursor:pointer}
  .nodeg text{font-family:var(--font);fill:var(--t1);pointer-events:none}
  .nodeg.world text{fill:var(--t0)}
  .nodeg:hover text{fill:var(--acc2)}
  .edge{stroke:var(--brd2);stroke-width:1.2}
  .edge.ghosted{stroke:var(--bad);stroke-dasharray:4 3}
  .subedge{stroke:#242424;stroke-width:1}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t2);font-size:13px;text-align:center;padding:0 40px}
  #empty div:first-child{font-size:17px;color:var(--t0)}
  #empty div:last-child{max-width:480px;line-height:1.6}
  @media(max-width:900px){
    #bar{gap:11px;padding:9px 12px;flex-wrap:wrap}
    #src{order:3;flex-basis:100%;border-left:0;padding:0 0 2px 42px}
    #wrap{flex-direction:column}
    #stage{min-height:52vh}
    #panel{width:100%;flex:0 0 36vh;border-left:0;border-top:1px solid var(--brd);padding:18px 20px}
    #panel .panel-empty{min-height:auto;padding:12px 4px 24px}
    #panel .empty-mark{display:none}
  }
  @media(max-width:620px){
    #tools{width:100%;overflow-x:auto;padding-bottom:2px}
    #bar button,#bar label.btn{white-space:nowrap}
    #legend{left:10px;bottom:10px;width:255px}
    #legend .legend-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="bar">
  <div id="brand"><div id="brandmark" aria-hidden="true"></div><h1>Campaign Map <span class="muted">Atlas · read-only</span></h1></div>
  <span id="src">no data yet</span>
  <div id="tools">
    <label class="btn">📂 Import save<input type="file" id="file" accept=".tnd,.json" style="display:none"></label>
    <button id="relayout">↻ Re-run layout</button>
    <button id="fit">⤢ Fit</button>
    <button id="expsvg">⬇ Export SVG</button>
  </div>
</div>
<div id="wrap">
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"></div>
    <div id="drop">drop a .tnd export anywhere</div>
    <div id="empty">
      <div>No campaign data found in this browser's storage.</div>
      <div>Open this page on the same origin as a played campaign, drop a <b>.tnd</b> export here, or use 📂 Import save.</div>
    </div>
  </div>
  <aside id="panel" aria-label="Location details" aria-live="polite"></aside>
</div>

<script>
(function(){
  "use strict";
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  // ── state ──────────────────────────────────────────────────────────────────
  var CUR=null;      // {mem, ws, srcLabel} — the loaded campaign
  var G=null;        // built graph {nodes:[], edges:[], byKey:{}}
  var view={x:0,y:0,w:1200,h:800};
  var selected=null;

  // ── data loading (three sources, one normalizer) ───────────────────────────
  function normalize(data,label){
    // Accepts a .tnd export ({worldState, memory, ...}) or bare pieces.
    var ws=data.worldState||data.ws||null;
    var mem=data.memory||data.mem||null;
    if(!mem&&data.map)mem=data;                       // a raw memory object
    if(!mem||!mem.map||!mem.map.nodes){setSrc("no map data in that source ("+label+")",true);return false;}
    CUR={mem:mem,ws:ws||{},srcLabel:label};
    selected=null;buildGraph();layout();render();fit();renderPanelEmpty();
    var n=G.nodes.length,e=G.edges.length;
    setSrc(label+" — "+n+" locations, "+e+" routes"+(CUR.ws&&CUR.ws.turn?", turn "+CUR.ws.turn:""),false,label.indexOf("live")===0);
    $("empty").style.display="none";
    return true;
  }
  function setSrc(txt,isErr,isLive){var el=$("src");el.textContent=txt;el.className=isErr?"err":(isLive?"live":"");}
  function tryLocalStorage(){
    try{
      var m=localStorage.getItem("tnd_mem_v10"),c=localStorage.getItem("tnd_core_v10");
      if(!m)return false;
      var mem=JSON.parse(m),ws=null;
      try{ws=c?JSON.parse(c):null;}catch(e2){ws=null;}
      // worldState's transcript may be the {__lz} compressed form — never needed here, drop it.
      if(ws&&ws.transcript)delete ws.transcript;
      return normalize({memory:mem,worldState:ws},"live localStorage"+(ws&&ws.campName?" · "+ws.campName:""));
    }catch(e){setSrc("localStorage read failed: "+e.message,true);return false;}
  }
  function loadFile(f){
    var r=new FileReader();
    r.onload=function(){
      try{var d=JSON.parse(r.result);if(d.worldState&&d.worldState.transcript)delete d.worldState.transcript;normalize(d,"import · "+f.name);}
      catch(e){setSrc("could not parse "+f.name+": "+e.message,true);}
    };
    r.onerror=function(){setSrc("could not read "+f.name,true);};
    r.readAsText(f);
  }
  // Test seam — inject a campaign without storage or pickers (drives every render path).
  window.__mapTest={load:function(d,label){return normalize(d,label||"seam");},graph:function(){return G;},select:function(k){selectNode(k);return selected;}};

  // ── graph build ────────────────────────────────────────────────────────────
  var ROAD_RE=/\broad\b|\bpass\b|\btrail\b|\btunnel\b|\bapproach\b|\bridge\b|\briver\b|\bcrossing\b/i;
  function buildGraph(){
    var mem=CUR.mem,ws=CUR.ws||{},nodes=[],byKey={},i,k;
    var raw=mem.map.nodes||{};
    function add(key,ghost){
      if(byKey[key])return byKey[key];
      var src=raw[key]||{};
      var pipe=key.indexOf("|");
      var parent=src.parent||(pipe>=0?key.slice(0,pipe):null);
      var n={key:key,label:pipe>=0?key.slice(pipe+1):key,parent:parent,world:!parent,
             visits:src.visits||0,firstVisit:src.firstVisit,description:src.description||null,
             stateNotes:src.stateNotes||[],items:src.items||[],ghost:!!ghost,
             guestbook:src.guestbook||null,/* #173: per-character visit provenance + residents */
             road:ROAD_RE.test(key),npcsHere:[],x:0,y:0,vx:0,vy:0};
      byKey[key]=n;nodes.push(n);return n;
    }
    for(k in raw)add(k,false);
    var edges=[];
    var rawE=mem.map.edges||[];
    for(i=0;i<rawE.length;i++){
      var e=rawE[i];if(!e||!e.from||!e.to)continue;
      var a=byKey[e.from]||add(e.from,true);       // ghost: edge names a node that was never filed
      var b=byKey[e.to]||add(e.to,true);
      edges.push({a:a,b:b,turn:e.turn,ghosted:a.ghost||b.ghost});
    }
    // Ensure every sublocation's parent exists (ghost if the world node was never filed).
    for(i=0;i<nodes.length;i++){if(nodes[i].parent&&!byKey[nodes[i].parent])add(nodes[i].parent,true);}
    // Cascade hierarchy (legibility pass, user call 2026-08-09): sublocations never render on
    // the canvas — they live in a cascading list on their WORLD node's panel. The tree derives
    // from KEY STRUCTURE (successive "|" prefixes), not the stored .parent field, because real
    // saves stamp .parent inconsistently ("Sandpoint|Sandpoint Bathhouse|Private Room" carries
    // parent:"Sandpoint"); each node hangs off its LONGEST existing prefix, so
    // sub-sub-locations cascade naturally. rootKey = the rendered world node that owns the
    // subtree (current-position ring and split badges resolve to it).
    function treeParentKey(key){
      var segs=key.split("|");
      if(segs.length<2)return null;
      for(var s=segs.length-1;s>=1;s--){var pref=segs.slice(0,s).join("|");if(byKey[pref])return pref;}
      return null;
    }
    for(i=0;i<nodes.length;i++){
      var nd=nodes[i];
      if(nd.world){nd.rootKey=nd.key;nd.treeParent=null;continue;}
      nd.treeParent=treeParentKey(nd.key)||nd.parent;
      var seen={},walk=nd,guard=0;
      while(walk&&!walk.world&&guard++<20){
        var pk=walk.treeParent!==undefined?walk.treeParent:walk.parent;
        if(walk!==nd&&pk===undefined)pk=treeParentKey(walk.key)||walk.parent;
        if(!pk||seen[pk])break;seen[pk]=1;walk=byKey[pk];
      }
      nd.rootKey=(walk&&walk.world)?walk.key:(nd.key.indexOf("|")>=0?nd.key.split("|")[0]:nd.key);
    }
    var childIdx={},descCount={};
    for(i=0;i<nodes.length;i++){
      var c2=nodes[i];if(c2.world)continue;
      var pk2=c2.treeParent||c2.rootKey;
      if(!childIdx[pk2])childIdx[pk2]=[];
      childIdx[pk2].push(c2.key);
      descCount[c2.rootKey]=(descCount[c2.rootKey]||0)+1;
    }
    for(k in childIdx)childIdx[k].sort();
    // NPC last-seen markers + death flags (memory side).
    var mn=mem.npcs||{};
    for(k in mn){
      var at=mn[k]&&mn[k].lastSeenAt;if(!at)continue;
      var tn=byKey[at];if(!tn&&at.indexOf("|")>=0)tn=byKey[at.slice(0,at.indexOf("|"))];
      if(tn)tn.npcsHere.push({name:k,dead:!!mn[k].dead});
    }
    // Party overlay (worldState side): current position + split members.
    var cur=ws.world?ws.world.location:null;
    var curSub=ws.world&&ws.world.sublocation?cur+"|"+ws.world.sublocation:null;
    var curKey=curSub&&byKey[curSub]?curSub:(cur&&byKey[cur]?cur:null);
    var splits=[];
    var roster=ws.npcs||[];
    for(i=0;i<roster.length;i++){
      var p=roster[i];
      if(p.partyMember&&p.charSheet&&p.charSheet.splitLoc){
        var sl=p.charSheet.splitLoc;
        var skey=sl.sublocation?sl.location+"|"+sl.sublocation:sl.location;
        splits.push({name:p.name,key:byKey[skey]?skey:(byKey[sl.location]?sl.location:null),raw:sl});
      }
    }
    var worlds=[];for(i=0;i<nodes.length;i++)if(nodes[i].world)worlds.push(nodes[i]);
    // Badges attach to the RENDERED node — a sub-located party/split resolves to its world root.
    function renderedKey(key){var nn=byKey[key];return nn?nn.rootKey:null;}
    for(i=0;i<splits.length;i++)if(splits[i].key)splits[i].badgeKey=renderedKey(splits[i].key);
    G={nodes:nodes,worlds:worlds,edges:edges,byKey:byKey,childIdx:childIdx,descCount:descCount,
       current:curKey,currentBadge:curKey?renderedKey(curKey):null,splits:splits,
       playerName:(ws.character&&ws.character.name)||"the party"};
  }

  // ── force layout (hand-rolled; no deps by project rule) ────────────────────
  // Layout runs over WORLD nodes only — sublocations never hit the canvas (they cascade in the
  // panel), which is the whole legibility win: ~20 labeled nodes instead of ~80.
  function layout(){
    var N=G.worlds,i,j,it;
    N.sort(function(a,b){return (a.firstVisit||0)-(b.firstVisit||0);});
    var R=Math.max(220,N.length*46);
    for(i=0;i<N.length;i++){var th=(i/Math.max(1,N.length))*Math.PI*2;N[i].x=Math.cos(th)*R;N[i].y=Math.sin(th)*R;}
    for(it=0;it<400;it++){
      var cool=1-it/400;
      for(i=0;i<N.length;i++){N[i].vx=0;N[i].vy=0;}
      for(i=0;i<N.length;i++)for(j=i+1;j<N.length;j++){
        var a=N[i],b=N[j];
        var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<1)d2=1;
        var d=Math.sqrt(d2);
        var rep=12000/d2;
        var fx=dx/d*rep,fy=dy/d*rep;
        a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
      }
      for(i=0;i<G.edges.length;i++){
        var E=G.edges[i];
        if(!E.a.world||!E.b.world)continue; // edges into sub keys pull their world roots instead
        spring(E.a,E.b,240,0.012);
      }
      for(i=0;i<G.edges.length;i++){
        var E2=G.edges[i];
        if(E2.a.world&&E2.b.world)continue;
        var ra=G.byKey[E2.a.rootKey],rb=G.byKey[E2.b.rootKey];
        if(ra&&rb&&ra!==rb)spring(ra,rb,240,0.012);
      }
      for(i=0;i<N.length;i++){var n=N[i];n.vx-=n.x*0.0012;n.vy-=n.y*0.0012;n.x+=n.vx*cool;n.y+=n.vy*cool;}
    }
    function spring(a,b,len,k){
      var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      var f=(d-len)*k,fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
    }
  }

  // ── render ─────────────────────────────────────────────────────────────────
  function nodeR(n){return n.world?(10+Math.min(16,Math.sqrt(n.visits||1)*2.4)):(4+Math.min(7,Math.sqrt(n.visits||1)*1.5));}
  function render(){
    var s=[],i;
    // Every edge draws between WORLD roots; an edge whose endpoints share a root is internal
    // to one settlement and stays off the canvas (its story lives in the cascade). Dedupe
    // root-pairs so five sub-edges into one city don't stack five lines.
    var drawn={};
    for(i=0;i<G.edges.length;i++){var e=G.edges[i];
      var ra=G.byKey[e.a.rootKey],rb=G.byKey[e.b.rootKey];
      if(!ra||!rb||ra===rb)continue;
      var pairKey=ra.key<rb.key?ra.key+""+rb.key:rb.key+""+ra.key;
      if(drawn[pairKey])continue;drawn[pairKey]=1;
      s.push('<line class="edge'+(e.ghosted?' ghosted':'')+'" x1="'+ra.x+'" y1="'+ra.y+'" x2="'+rb.x+'" y2="'+rb.y+'"><title>t'+esc(e.turn)+': '+esc(e.a.key)+' ↔ '+esc(e.b.key)+'</title></line>');}
    for(i=0;i<G.worlds.length;i++){s.push(nodeSVG(G.worlds[i]));}
    // Party + split badges last (topmost) — attached to the rendered world root.
    if(G.currentBadge){var c=G.byKey[G.currentBadge];if(c)s.push('<circle cx="'+c.x+'" cy="'+c.y+'" r="'+(nodeR(c)+7)+'" fill="none" stroke="#d9b47c" stroke-width="2" stroke-dasharray="3 3"><title>'+esc(G.playerName)+' is here'+(G.current!==G.currentBadge?' — at '+esc(G.current):'')+'</title></circle>');}
    for(i=0;i<G.splits.length;i++){var sp=G.splits[i];if(!sp.badgeKey)continue;var sn=G.byKey[sp.badgeKey];if(!sn)continue;
      s.push('<g><circle cx="'+(sn.x+nodeR(sn)+7)+'" cy="'+(sn.y-nodeR(sn)-7)+'" r="8" fill="#221212" stroke="#a05a5a"/><text x="'+(sn.x+nodeR(sn)+7)+'" y="'+(sn.y-nodeR(sn)-3.5)+'" text-anchor="middle" font-size="9" fill="#c88">'+esc(sp.name.charAt(0))+'</text><title>'+esc(sp.name)+' — split from the party, at '+esc(sp.key)+'</title></g>');}
    $("svg").innerHTML='<g id="root">'+s.join("")+'</g>';
    $("svg").setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);
    wireNodes();renderLegend();
  }
  function nodeSVG(n){
    var r=nodeR(n),shape;
    var isSel=n.key===selected;
    var stroke=n.ghost?"#a05a5a":(n.key===G.current?"#d9b47c":"#b8935a");
    var fill=n.world?"#1e1a12":"#181818";
    if(isSel){fill="#b8935a";stroke="#e8d9b8";} // selected: filled accent + 50% larger label
    var dash=n.ghost?' stroke-dasharray="3 2"':'';
    if(n.road){shape='<rect x="'+(n.x-r)+'" y="'+(n.y-r)+'" width="'+(r*2)+'" height="'+(r*2)+'" transform="rotate(45 '+n.x+' '+n.y+')" fill="'+fill+'" stroke="'+stroke+'"'+dash+' stroke-width="1.4"/>';}
    else{shape='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'"'+dash+' stroke-width="1.4"/>';}
    var nSubs=G.descCount[n.key]||0;
    var label=esc(n.key)+(nSubs?" ("+nSubs+" sublocation"+(nSubs===1?"":"s")+")":"");
    var fs=isSel?18:12;
    var ttl=esc(n.key)+(n.visits?" — "+n.visits+" visit"+(n.visits===1?"":"s"):"")+(nSubs?" — click to browse "+nSubs+" sublocation"+(nSubs===1?"":"s"):"")+(n.ghost?" (GHOST: referenced but never filed)":"");
    return '<g class="nodeg'+(n.world?' world':'')+'" data-k="'+esc(n.key)+'">'+shape+
      '<text x="'+n.x+'" y="'+(n.y+r+fs+1)+'" text-anchor="middle" font-size="'+fs+'">'+label+'</text><title>'+ttl+'</title></g>';
  }
  function renderLegend(){
    $("legend").innerHTML=
      '<div class="legend-title"><span>Map key</span><span>Drag · scroll</span></div>'+
      '<div class="legend-grid">'+
        '<div class="legend-item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#1e1a12" stroke="#b8935a"/></svg><span>Location<small>settlement or site</small></span></div>'+
        '<div class="legend-item"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" transform="rotate(45 8 8)" fill="#181818" stroke="#b8935a"/></svg><span>Route<small>road or corridor</small></span></div>'+
        '<div class="legend-item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#d9b47c" stroke-dasharray="3 3"/></svg><span>Party<small>current position</small></span></div>'+
        '<div class="legend-item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="#221212" stroke="#a05a5a"/></svg><span>Split<small>member away</small></span></div>'+
      '</div>'+
      '<div class="legend-note">Larger nodes mean more visits. Dashed red routes point to records that were referenced but never filed.</div>';
  }

  // ── node panel ─────────────────────────────────────────────────────────────
  // One location's record body — shared between the panel header view and every cascade entry
  // (user call 2026-08-09 #2: a sublocation EXPANDS IN PLACE with its full record instead of
  // navigating the panel away; browsing Sandpoint's shops never loses Sandpoint).
  function nodeRecordHTML(n){
    var h='';
    var marks='';
    if(n.key===G.current)marks+='<span class="chip">'+esc(G.playerName)+' is here</span>';
    for(var si=0;si<G.splits.length;si++)if(G.splits[si].key===n.key)marks+='<span class="chip away">'+esc(G.splits[si].name)+' — away from party</span>';
    if(marks)h+='<div class="sec">'+marks+'</div>';
    h+='<div class="sec"><h3>Record</h3><div>'+(n.visits||0)+' visit'+(n.visits===1?'':'s')+(n.firstVisit!=null?' · first at turn '+esc(n.firstVisit):'')+(n.ghost?' · <span style="color:var(--bad)">ghost — referenced, never filed</span>':'')+'</div></div>';
    if(n.description)h+='<div class="sec"><h3>Canonical description (write-once, GM-injected)</h3><div class="desc">'+esc(n.description)+'</div></div>';
    if(n.stateNotes&&n.stateNotes.length){h+='<div class="sec"><h3>Durable changes (#105)</h3><ul>';for(var i2=0;i2<n.stateNotes.length;i2++)h+='<li>· '+esc(n.stateNotes[i2].n)+' <span style="color:var(--t2)">(t'+esc(n.stateNotes[i2].t)+')</span></li>';h+='</ul></div>';}
    if(n.items&&n.items.length){h+='<div class="sec"><h3>Items here</h3><ul>';for(var i3=0;i3<n.items.length;i3++){var it=n.items[i3];h+='<li'+(it.taken?' class="dead"':'')+'>· '+esc(it.name)+(it.taken?' (taken)':'')+'</li>';}h+='</ul></div>';}
    if(n.npcsHere.length){h+='<div class="sec"><h3>NPCs last seen here</h3><ul>';for(var i4=0;i4<n.npcsHere.length;i4++){var np=n.npcsHere[i4];h+='<li'+(np.dead?' class="dead"':'')+'>· '+esc(np.name)+(np.dead?' (deceased)':'')+'</li>';}h+='</ul></div>';}
    // #173: the guestbook — per-character recorded visits + residents. Visits render each exact
    // turn plus the folded aggregate ("t10–t80 ×12" = 12 older turns compressed); residents are
    // an association, never presence, and the header says so.
    if(n.guestbook){
      var gNames=Object.keys(n.guestbook),gVis=[],gRes=[],gi;
      gNames.sort();
      for(gi=0;gi<gNames.length;gi++){var gr=n.guestbook[gNames[gi]];if(!gr)continue;
        var gT=gr.turns||[];
        if(gT.length||gr.agg){
          var gp=[];
          if(gr.agg)gp.push('t'+gr.agg.first+'–t'+gr.agg.last+' ×'+gr.agg.count);
          for(var gj=0;gj<gT.length;gj++)gp.push('t'+gT[gj]);
          gVis.push('<li>· '+esc(gNames[gi])+' <span style="color:var(--t2)">('+esc(gp.join(', '))+')</span>'+(gr.resident?' <span class="mk">— resident</span>':'')+'</li>');
        }else if(gr.resident)gRes.push(esc(gNames[gi]));
      }
      if(gVis.length)h+='<div class="sec"><h3>Recorded visits (#173 — per character)</h3><ul>'+gVis.join('')+'</ul></div>';
      if(gRes.length)h+='<div class="sec"><h3>Residents (usual base — not presence)</h3><div>'+gRes.join(', ')+'</div></div>';
    }
    return h;
  }
  // Every cascade entry is an accordion: summary = the name, body = the full record + its own
  // children, recursively. Nothing navigates; everything unfolds where it stands.
  function cascadeFull(key){
    var kids=G.childIdx[key]||[];
    if(!kids.length)return "";
    var out="<ul>";
    for(var ci=0;ci<kids.length;ci++){
      var kn=G.byKey[kids[ci]];if(!kn)continue;
      var mark='';
      if(kn.key===G.current)mark=' <span class="mk">● party</span>';
      for(var mi=0;mi<G.splits.length;mi++)if(G.splits[mi].key===kn.key)mark+=' <span class="mk away">● '+esc(G.splits[mi].name)+'</span>';
      var line=esc(kn.label)+(kn.ghost?' <span style="color:var(--bad)">(ghost)</span>':'')+(kn.visits>1?' <span style="color:var(--t2)">×'+kn.visits+'</span>':'')+mark;
      out+='<li><details><summary>'+line+'</summary><div class="crec">'+nodeRecordHTML(kn)+cascadeSection(kn.key,true)+'</div></details></li>';
    }
    return out+"</ul>";
  }
  function cascadeSection(key,nested){
    var tree=cascadeFull(key);
    if(!tree)return "";
    if(nested)return '<div class="sec"><h3>Sublocations</h3><div class="cascade">'+tree+'</div></div>';
    return '<div class="sec"><h3>Sublocations ('+(G.descCount[key]||0)+')</h3><div class="cascade">'+tree+'</div></div>';
  }
  function renderPanelEmpty(){
    selected=null;
    var loaded=!!(G&&G.worlds);
    var title=loaded?'Choose a location':'Location details';
    var copy=loaded?'Select any location on the map to inspect its record, durable changes, people, items, routes, and nested places.':'Import a campaign save to explore its remembered geography.';
    var meta=loaded?G.worlds.length+' map locations · '+G.edges.length+' recorded routes':'Waiting for campaign data';
    var pn=$("panel");
    pn.innerHTML='<div class="panel-empty"><div class="empty-mark" aria-hidden="true"></div><div class="panel-kicker">Location details</div><h2>'+title+'</h2><p>'+copy+'</p><div class="empty-meta">'+meta+'</div></div>';
    pn.scrollTop=0;
  }
  function selectNode(key){
    var n=G.byKey[key];if(!n)return;
    selected=key;
    var up=n.world?null:(n.treeParent||n.rootKey);
    var h='<div class="panel-kicker">Location details</div><h2>'+esc(n.world?n.key:n.label)+'</h2><div class="sub">'+(n.ghost?'ghost — referenced, never filed':(n.world?(n.road?'road / corridor':'world location'):'inside <a data-go="'+esc(up)+'" style="text-transform:none;letter-spacing:0">'+esc(up)+'</a>'))+'</div>';
    h+=nodeRecordHTML(n);
    h+=cascadeSection(n.key,false);
    var conn=[];for(var i7=0;i7<G.edges.length;i7++){var E=G.edges[i7];if(E.a.key===n.key)conn.push({k:E.b.key,t:E.turn});else if(E.b.key===n.key)conn.push({k:E.a.key,t:E.turn});}
    if(conn.length){h+='<div class="sec"><h3>Connected (first travel)</h3><ul>';for(var i8=0;i8<conn.length;i8++)h+='<li>· <a data-go="'+esc(conn[i8].k)+'">'+esc(conn[i8].k)+'</a> <span style="color:var(--t2)">(t'+esc(conn[i8].t)+')</span></li>';h+='</ul></div>';}
    var pn=$("panel");pn.innerHTML=h;pn.scrollTop=0;
    render();/* selected-node highlight: filled shape + enlarged label (re-render keeps SVG and panel in step) */
    var links=pn.querySelectorAll("a[data-go]");
    for(var i9=0;i9<links.length;i9++)links[i9].addEventListener("click",function(){var k2=this.getAttribute("data-go");selectNode(k2);centerOn(k2);});
  }
  function centerOn(key){var n=G.byKey[key];if(!n)return;var r=n.world?n:G.byKey[n.rootKey];if(!r)return;view.x=r.x-view.w/2;view.y=r.y-view.h/2;$("svg").setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);}

  // ── interactions ───────────────────────────────────────────────────────────
  function wireNodes(){
    var gs=$("svg").querySelectorAll(".nodeg");
    for(var i=0;i<gs.length;i++)gs[i].addEventListener("click",function(ev){ev.stopPropagation();selectNode(this.getAttribute("data-k"));});
  }
  (function(){
    var svg=$("svg"),drag=null;
    svg.addEventListener("mousedown",function(ev){drag={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y};svg.setAttribute("class","panning");});
    window.addEventListener("mousemove",function(ev){if(!drag)return;var sc=view.w/svg.clientWidth;view.x=drag.vx-(ev.clientX-drag.x)*sc;view.y=drag.vy-(ev.clientY-drag.y)*sc;svg.setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);});
    window.addEventListener("mouseup",function(){drag=null;svg.removeAttribute("class");});
    svg.addEventListener("wheel",function(ev){ev.preventDefault();
      var f=ev.deltaY>0?1.15:0.87;
      var mx=view.x+ev.offsetX/svg.clientWidth*view.w,my=view.y+ev.offsetY/svg.clientHeight*view.h;
      view.w*=f;view.h*=f;view.x=mx-(mx-view.x)*f;view.y=my-(my-view.y)*f;
      svg.setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);
    },{passive:false});
    svg.addEventListener("click",function(){renderPanelEmpty();render();});
  })();
  function fit(){
    if(!G||!G.worlds.length)return;
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,i;
    for(i=0;i<G.worlds.length;i++){var n=G.worlds[i];if(n.x<minX)minX=n.x;if(n.x>maxX)maxX=n.x;if(n.y<minY)minY=n.y;if(n.y>maxY)maxY=n.y;}
    var pad=90;view.x=minX-pad;view.y=minY-pad;view.w=(maxX-minX)+pad*2;view.h=(maxY-minY)+pad*2;
    // Match the stage aspect so nothing squashes.
    var svg=$("svg"),ar=svg.clientWidth/Math.max(1,svg.clientHeight),var_ar=view.w/view.h;
    if(var_ar<ar)view.w=view.h*ar;else view.h=view.w/ar;
    svg.setAttribute("viewBox",view.x+" "+view.y+" "+view.w+" "+view.h);
  }
  $("relayout").addEventListener("click",function(){if(G){layout();render();fit();}});
  $("fit").addEventListener("click",fit);
  // Standalone-SVG export — the same render, wrapped self-contained (inline styles + bg) so the
  // file is shareable anywhere. Exposed on the seam so a headless run can produce the image too.
  function exportSVG(title){
    if(!G||!G.worlds.length)return null;
    var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,i;
    for(i=0;i<G.worlds.length;i++){var n=G.worlds[i];if(n.x<minX)minX=n.x;if(n.x>maxX)maxX=n.x;if(n.y<minY)minY=n.y;if(n.y>maxY)maxY=n.y;}
    var p=110,w=(maxX-minX)+2*p,hh=(maxY-minY)+2*p;
    var css="text{font-family:Segoe UI,system-ui,sans-serif;fill:#b0a890}.nodeg.world text{fill:#e8e0d0}.edge{stroke:#333;stroke-width:1.2}.edge.ghosted{stroke:#a05a5a;stroke-dasharray:4 3}.subedge{stroke:#242424;stroke-width:1}";
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+(minX-p)+' '+(minY-p)+' '+w+' '+hh+'"><style>'+css+'</style>'+
      '<rect x="'+(minX-p)+'" y="'+(minY-p)+'" width="'+w+'" height="'+hh+'" fill="#0d0d0d"/>'+
      '<text x="'+(minX-p+24)+'" y="'+(minY-p+34)+'" font-size="20" fill="#b8935a">'+esc(title||"Campaign geography")+'</text>'+
      $("svg").querySelector("#root").innerHTML+'</svg>';
  }
  window.__mapTest.exportSVG=exportSVG;
  $("expsvg").addEventListener("click",function(){
    var label=(CUR&&CUR.ws&&CUR.ws.campName?CUR.ws.campName:"campaign")+(CUR&&CUR.ws&&CUR.ws.turn?" — turn "+CUR.ws.turn:"");
    var svg=exportSVG(label+" — campaign geography");
    if(!svg)return;
    var a=document.createElement("a");
    a.href="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    a.download="campaign_map.svg";
    document.body.appendChild(a);a.click();a.remove();
  });
  $("file").addEventListener("change",function(){if(this.files&&this.files[0])loadFile(this.files[0]);});
  (function(){
    var stage=$("stage");
    ["dragenter","dragover"].forEach(function(evn){stage.addEventListener(evn,function(ev){ev.preventDefault();$("drop").style.display="flex";});});
    stage.addEventListener("dragleave",function(ev){if(ev.target===stage)$("drop").style.display="none";});
    stage.addEventListener("drop",function(ev){ev.preventDefault();$("drop").style.display="none";if(ev.dataTransfer.files&&ev.dataTransfer.files[0])loadFile(ev.dataTransfer.files[0]);});
  })();

  // ── boot ───────────────────────────────────────────────────────────────────
  renderPanelEmpty();
  if(!tryLocalStorage())setSrc("no campaign in this browser's storage — import a .tnd export",false);
})();
</script>
</body>
</html>
