    if (start < 0 || end < 0) throw new Error("could not find the CAPABILITY_BIBLE data block — is that capability_bible.js?");
    var entries = [], lead = [];
    for (i = start + 1; i < end; i++) {
      var l = lines[i], m = l.match(/^\s*"([^"]+)"\s*:\s*\{/);

  var SERVER = "http://127.0.0.1:7373";
  var STAGED = {};   // key → entry object, merged into the bible on Add-staged
  var SAVED = {};    // key → 1 once the server confirms the install (pill: "saved to bible")

  // Per-run write token (ChatGPT review 2026-08-01) — same contract as bible_editor.html: the
  // server refuses /install without the token it printed at startup; asked once per browser
  // session, re-asked on a 403 (server restarted). Cancelling aborts the save loudly.
  function srvToken(forceAsk) {
    var k = "tnd_bible_srv_tok_v1", t = null;
    try { t = sessionStorage.getItem(k); } catch (e) {}
    if (forceAsk || !t) {
      t = prompt("bible-server write token (printed in the server's terminal at startup):", t || "");
      if (t === null) return null;
      t = t.trim();
      try { sessionStorage.setItem(k, t); } catch (e) {}
    }
    return t;
  }
  function srvInstall(body) {
    var t = srvToken(false);
    if (t === null) return Promise.reject(new Error("save cancelled — no write token entered (it is printed in the bible-server terminal)"));
    function post(tok) {
      return fetch(SERVER + "/install", { method: "POST", headers: { "Content-Type": "text/plain", "X-Bible-Token": tok }, body: body });
    }
    return post(t).then(function (r) {
      if (r.status !== 403) return r;
      var t2 = srvToken(true);
      if (t2 === null) return r;
      return post(t2);
    });
  }

  function stagedCount() { var n = 0, k; for (k in STAGED) n++; return n; }
  // Compose every staged entry onto the real source. Existing keys are REPLACED in place (their
  // line is re-emitted), new keys are appended — so comments and untouched entries stay
  // byte-identical, exactly as the in-place path did.
  function composeBible(src) {
    var st = parseCap(src), k, i, hit;
    for (k in STAGED) {
      hit = null;
      for (i = 0; i < st.entries.length; i++) if (st.entries[i].key === k) hit = st.entries[i];
      if (hit) { hit.obj = STAGED[k]; hit.dirty = true; }
      else st.entries.push({ key: k, line: "", lead: [], obj: STAGED[k], dirty: true });
    }
    return serializeCap(st);
  }
  function addStagedToBible() {
    var n = stagedCount();
    if (!n) { status("nothing staged yet — press Stage on the entries you want", true); return; }
    status("saving " + n + " staged " + (n === 1 ? "entry" : "entries") + " through the local bible server…");
    $("dl").disabled = true;
    fetch(SERVER + "/bible").then(function (r) { return r.json(); }).then(function (g) {
      if (!g.ok) throw new Error(g.output || "the server could not read capability_bible.js");
      var out = composeBible(g.text);   // parseCap inside throws loudly if the server text is not the bible
      return srvInstall(out)
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) throw new Error("install-bible REFUSED the file — nothing was written:\n" + j.output);
          var keys = Object.keys(STAGED);
          keys.forEach(function (k) { CAPABILITY_BIBLE[k] = STAGED[k]; SAVED[k] = 1; delete STAGED[k]; });
          render();
          status("✓ saved to capability_bible.js: " + keys.join(", ") + "  (validated by install-bible before the write)");
          console.info("[necro] install output:\n" + j.output);
        });
    })["catch"](function (e) {
      var m = (e && e.message) || "";
      if (/Failed to fetch|NetworkError|load failed/i.test(m)) {
        status("✗ the local bible server isn't running. Start it once in a terminal and leave it open:   node dev/bible-server.js   — then click again. (Your staged entries are untouched.)", true);
      } else {
        status("✗ " + m + " — nothing was written; your staged entries are untouched.", true);
      }
      console.warn("[necro] add-staged failed:", m);
    }).then(function () { $("dl").disabled = stagedCount() === 0; });
  }
  // ── validation (the CAP VALIDATOR rules that matter here) ─────────────────
  function issues(en) {
    var errs = [];
    if (!en.category.length) errs.push("pick at least one category");
    if (en.isMagical && en.category.length === 1 && en.category[0] === "martial") errs.push("magical + martial-only is contradictory");
    if (!String(en.effect).trim()) errs.push("effect is empty");
    if (/\b\d*d\d+\b/.test(en.effect) && (!en.dice || en.dice === "N/A")) errs.push("effect names dice but the dice field is N/A (the #101 drift class)");
    return errs;
  }
  function bibleObj(en) {
    return { kind: en.kind, tier: en.tier, cost: en.cost || "N/A", isMagical: en.isMagical, category: en.category.slice(),
      range: en.range || "N/A", targets: en.targets || "N/A", duration: en.duration || "N/A",
      save: en.save || "N/A", dice: en.dice || "N/A", effect: en.effect };
  }

  // Staging is pure memory: instant, and it CANNOT fail — no file, no handle, no permission.
  // The one real save on this page is the Add-staged button, which goes through the server.
  function stage(idx) {
    var en = ENTRIES[idx], key = keyOf(en), bad = issues(en), errEl = $("err-" + idx);
    if (!key) bad.unshift("name is empty");
    if (bad.length) { errEl.textContent = "✗ " + bad.join(" · "); return; }
    errEl.textContent = "";
    STAGED[key] = bibleObj(en);
    delete SAVED[key];   // re-staging after an edit supersedes the earlier saved state
    render();
    status("staged \"" + key + "\" (" + stagedCount() + " staged) — press Add staged to bible when ready.");
  }
  function unstage(key) { delete STAGED[key]; render(); status("unstaged \"" + key + "\" (" + stagedCount() + " staged)"); }

  // ── render ──────────────────────────────────────────────────────────────────
  function inBible(en) { return !!CAPABILITY_BIBLE[keyOf(en)]; }
  function isStaged(en) { return !!STAGED[keyOf(en)]; }
  function isSaved(en) { return !!SAVED[keyOf(en)]; }
  function render() {
    var h = "", n = 0, have = 0;
    ENTRIES.forEach(function (en, i) {
      n++;
      var got = inBible(en); if (got) have++;
      var stg = isStaged(en), sav = !stg && isSaved(en);
      var draft = /drafted here/.test(en.src);
      h += "<div class='card" + (stg ? " staged" : (sav || got) ? " inbible" : "") + "'>" +
        "<div class='hd'><input type='text' class='nmInput' data-i='" + i + "' data-f='nm' value='" + esc(en.nm) + "' title='spell name — the bible key derives from it'>" +
        (sav ? "<span class='state saved'>saved to bible</span>" : "<span class='state " + (got ? "have" : "new") + "'>" + (got ? "in bible" : "new") + "</span>") +
        (stg ? "<span class='state stg'>staged ✓</span>" : "") +
        (draft ? "<span class='state draft'>drafted</span>" : "") +
        "<button class='x' data-del='" + i + "' title='remove from this page only — the bible is untouched'>✕</button></div>" +
        "<p class='src'>" + esc(en.src) + "</p>" +
        "<div class='row'><span class='lbl'>kind</span><select data-i='" + i + "' data-f='kind'><option" + (en.kind === "spell" ? " selected" : "") + ">spell</option><option" + (en.kind === "ability" ? " selected" : "") + ">ability</option></select>" +
        "<span class='lbl' style='width:auto'>tier</span><select data-i='" + i + "' data-f='tier'>" + [0,1,2,3,4,5,6].map(function (t) { return "<option" + (en.tier === t ? " selected" : "") + ">" + t + "</option>"; }).join("") + "</select>" +
        "<span class='lbl' style='width:auto'>magical</span><select data-i='" + i + "' data-f='isMagical'><option" + (en.isMagical ? " selected" : "") + ">true</option><option" + (!en.isMagical ? " selected" : "") + ">false</option></select>" +
        "<span class='lbl' style='width:auto'>cost</span><input type='text' class='tiny' data-i='" + i + "' data-f='cost' value='" + esc(en.cost) + "'></div>" +
        "<div class='row'><span class='lbl'>category</span>" + CATS.map(function (c) {
          var on = en.category.indexOf(c) >= 0;
          return "<label class='catlbl' style='color:" + (on ? "var(--acc)" : "var(--t1)") + "'><input type='checkbox' data-i='" + i + "' data-cat='" + c + "'" + (on ? " checked" : "") + "> " + c + "</label>";
        }).join("") + "</div>" +
        "<div class='row'><span class='lbl'>range</span><input type='text' class='short' data-i='" + i + "' data-f='range' value='" + esc(en.range) + "'>" +
        "<span class='lbl' style='width:auto'>targets</span><input type='text' data-i='" + i + "' data-f='targets' style='width:210px' value='" + esc(en.targets) + "'>" +
        "<span class='lbl' style='width:auto'>duration</span><input type='text' class='short' data-i='" + i + "' data-f='duration' value='" + esc(en.duration) + "'></div>" +
        "<div class='row'><span class='lbl'>save</span><input type='text' data-i='" + i + "' data-f='save' style='width:220px' value='" + esc(en.save) + "'>" +
        "<span class='lbl' style='width:auto'>dice</span><input type='text' data-i='" + i + "' data-f='dice' style='width:220px' value='" + esc(en.dice) + "'></div>" +
        "<div class='row'><span class='lbl'>effect</span><textarea rows='2' data-i='" + i + "' data-f='effect'>" + esc(en.effect) + "</textarea></div>" +
        "<div class='err' id='err-" + i + "'></div>" +
        "<div class='row' style='margin-top:8px'><button class='primary' data-add='" + i + "'>Stage</button>" +
        (stg ? "<button data-unstage='" + esc(keyOf(en)) + "'>unstage</button><span class='muted'>queued — Add staged to bible saves it</span>" : "") +
        "</div></div>";
    });
    $("main").innerHTML = h;
    var sc = stagedCount();
    $("counts").textContent = n + " drafts · " + have + " already in bible · " + sc + " staged";
    $("dl").textContent = "Add staged to bible (" + sc + ")";
    $("dl").disabled = !sc;
    wire();
  }
  function titleCase(s) {
    var MINOR = { of:1, "in":1, the:1, a:1, an:1, to:1, and:1, or:1, "for":1, "with":1, at:1, by:1, from:1, on:1, into:1 };
    var w = String(s || "").split(/\s+/);
    return w.map(function (x, k) {
      var lo = x.toLowerCase();
      if (k > 0 && k < w.length - 1 && MINOR[lo]) return lo;
      return lo.charAt(0).toUpperCase() + lo.slice(1);
    }).join(" ");
  }
  function wire() {
    var m = $("main"), i;
    var flds = m.querySelectorAll("[data-f]");
    for (i = 0; i < flds.length; i++) flds[i].onchange = function () {
      var en = ENTRIES[+this.getAttribute("data-i")], f = this.getAttribute("data-f"), v = this.value;
      if (f === "tier") en.tier = parseInt(v, 10) || 0;
      else if (f === "isMagical") en.isMagical = (v === "true");
      else if (f === "nm") { en.nm = v; saveDraft(); render(); return; }   // re-render: the derived key may now collide (or stop colliding) with the bible
      else en[f] = v;
      saveDraft();
    };
    var dels = m.querySelectorAll("button[data-del]");
    for (i = 0; i < dels.length; i++) dels[i].onclick = function () {
      var idx = +this.getAttribute("data-del");
      if (!confirm("Remove \"" + ENTRIES[idx].nm + "\" from THIS PAGE?\n\nThe capability bible is untouched — this only drops the draft card.")) return;
      ENTRIES.splice(idx, 1);
      saveDraft(); render();
      status("draft removed from the page — the bible was not touched");
    };
    var cats = m.querySelectorAll("[data-cat]");
    for (i = 0; i < cats.length; i++) cats[i].onchange = function () {
      var en = ENTRIES[+this.getAttribute("data-i")], c = this.getAttribute("data-cat");
      var at = en.category.indexOf(c);
      if (this.checked && at < 0) en.category.push(c);
      if (!this.checked && at >= 0) en.category.splice(at, 1);
      saveDraft();
    };
    var adds = m.querySelectorAll("button[data-add]");
    for (i = 0; i < adds.length; i++) adds[i].onclick = function () { stage(+this.getAttribute("data-add")); };
    var uns = m.querySelectorAll("button[data-unstage]");
    for (i = 0; i < uns.length; i++) uns[i].onclick = function () { unstage(this.getAttribute("data-unstage")); };
  }

  $("dl").onclick = addStagedToBible;
  $("reset").onclick = function () {
    if (!confirm("Throw away every edit on this page and restore the original 41 drafts?\n\n(Entries already written into capability_bible.js are untouched.)")) return;
    ENTRIES = JSON.parse(JSON.stringify(SEED));
    normalizeEntries();
    try { localStorage.removeItem(DRAFT_K); } catch (e) {}
    render();
    status("reset to the original drafts");
  };

  // test seam (house rule: no surface untestable) — drive compose/save without a real server
  window.__necroTest = {
    compose: composeBible,
    staged: function () { return STAGED; },
    saved: function () { return SAVED; },
    addStaged: addStagedToBible,
    entries: function () { return ENTRIES; }
  };

  render();
})();
</script>
</body>
</html>
