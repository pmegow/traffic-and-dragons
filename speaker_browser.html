<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speaker Browser — the 904-voice stable</title>
<!--
  speaker_browser.html (TODO #95, spec S3) — the audition / casting tool for the 904 speakers
  inside en_US-libritts_r-medium.

  SATELLITE PAGE: opened directly like blueprint-designer.html and bible_study.html. It is
  deliberately OUTSIDE the SW app shell (sw.js untouched) — nothing here is needed offline, and
  staying out of the shell is the recommended half of S3.

  DEPLOYMENT ASSUMPTION: served same-origin with the game, so localStorage carries the session
  token the game already stored. This page NEVER asks for credentials — no token means a banner
  telling you to connect in the game.

  Every ▶ is ONE real POST /api/tts on the TTS server. Nothing is pre-rendered and nothing is
  cached client-side.

  SECURITY: server-derived strings (error bodies) and user-entered labels are inserted via
  textContent — never innerHTML. Keep it that way when editing.

  METADATA IS OPTIONAL, FIELD BY FIELD (the #95 follow-up, option 2). A speakers entry is
  {i, g} at minimum and may additionally carry:
      n   reader's real name          d   acoustic descriptor ("deep, measured")
      f0  median pitch in Hz          sps syllables per second
      pb  pitch bucket  deep|mid|bright
      rb  rate bucket   measured|steady|quick
  and the file may carry a top-level "acoustics" {generated, sampleText, method}.
  EVERY ONE of those may be missing. Each UI affordance built on them is gated on a HAS_*
  flag computed from the loaded data, so a metadata file with none of them renders exactly
  the page that shipped before this change — same DOM, same controls. Never derive a bucket
  from a number, never guess a name: absent is absent.
-->
<style>
  :root{--bg:#121212;--card:#181818;--card2:#1c1c1c;--line:#2c2a26;--ink:#e6e2d8;--dim:#a39a88;
        --dim2:#6f695e;--acc:#b8935a;--good:#7aa86a;--bad:#c0564a;
        --mono:Consolas,"SF Mono",Menlo,ui-monospace,monospace;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:#0d0d0d;}
  ::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--acc);}
  .wrap{max-width:900px;margin:0 auto;padding:26px 18px 90px;}
  h1{font-size:21px;margin:0 0 4px;color:var(--acc);}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px;}
  h2.sect{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--acc);
          border-bottom:1px solid var(--line);padding-bottom:6px;margin:30px 0 12px;}

  .banner{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);
          border-radius:8px;padding:12px 14px;margin:0 0 16px;font-size:13.5px;color:var(--dim);}
  .banner.bad{border-left-color:var(--bad);}
  .banner b{color:var(--ink);}
  .note{color:var(--dim2);font-size:12.5px;margin:8px 0 0;}

  .bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
       padding:10px 0 12px;margin-bottom:10px;}
  .bar .lbl{font-size:12px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;
            display:block;margin-bottom:5px;}
  input[type=text]{font-family:inherit;font-size:14px;background:var(--card2);color:var(--ink);
                   border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;}
  input[type=text]:focus{border-color:var(--acc);}
  #line{width:100%;}
  .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .filt{display:flex;gap:6px;flex-wrap:wrap;}
  button{font-family:inherit;font-size:13px;background:#222;color:var(--ink);
         border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;}
  button:hover{border-color:var(--acc);color:var(--acc);}
  button:disabled{opacity:.35;cursor:default;}
  button:disabled:hover{border-color:var(--line);color:var(--ink);}
  .filt button.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:700;}
  .filt button.on:hover{color:#111;}
  #jump{width:170px;}
  .spacer{flex:1;}
  select{font-family:inherit;font-size:13px;background:var(--card2);color:var(--ink);
         border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none;cursor:pointer;}
  select:focus{border-color:var(--acc);}
  .sortwrap{display:flex;gap:6px;align-items:center;}
  .sortwrap .slbl{font-size:12px;color:var(--dim2);letter-spacing:.04em;text-transform:uppercase;}

  .rows{margin-top:4px;}
  .r{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);
     border:1px solid var(--line);border-radius:9px;margin:6px 0;flex-wrap:wrap;}
  .r.starred{border-color:#4a4132;background:var(--card2);}
  .r.hit{border-color:var(--acc);}
  .r .idx{font-family:var(--mono);font-size:13.5px;color:var(--acc);font-weight:700;min-width:62px;}
  .r .rd{font-size:13px;color:var(--dim);min-width:96px;}
  .r .nm{font-size:12.5px;color:var(--dim2);min-width:118px;word-break:break-word;}
  .r .g{font-family:var(--mono);font-size:11.5px;color:var(--dim2);min-width:22px;text-align:center;}
  .r .desc{font-size:12.5px;color:var(--dim);flex:1.3;min-width:132px;word-break:break-word;}
  .r .st{font-size:12.5px;color:var(--dim);flex:1;min-width:120px;word-break:break-word;}
  .r .st.err{color:var(--bad);}
  button.play{min-width:38px;font-size:14px;}
  button.play.on{background:var(--acc);border-color:var(--acc);color:#111;}
  button.play.on:hover{color:#111;}
  button.star{min-width:34px;font-size:14px;line-height:1;}
  button.star.on{color:var(--acc);border-color:#4a4132;}

  /* Narrow screens: with the name + descriptor cells present the row no longer fits on one
     line, and left alone it wraps the ☆ down by itself. Give the descriptor a deliberate
     second line instead. Scoped to .rows.rich — a metadata file without those fields never
     gets the class, so the pre-option-2 layout is untouched at every width. */
  @media (max-width:760px){
    .rows.rich .r .nm{min-width:90px;}
    .rows.rich .r .st{min-width:0;}
    .rows.rich .r .desc{flex-basis:100%;min-width:0;order:9;}
  }

  .pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 0;
         color:var(--dim);font-size:12.5px;}

  .stars{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .sr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;
      border-bottom:1px solid #232120;}
  .sr:last-child{border-bottom:none;}
  .sr .sid{font-family:var(--mono);font-size:12px;color:var(--acc);min-width:210px;
           word-break:break-all;}
  .sr .smeta{font-size:12px;color:var(--dim2);min-width:150px;word-break:break-word;}
  .sr input[type=text]{flex:1;min-width:170px;font-size:13px;padding:6px 10px;}
  .sr .msg{font-size:12px;color:var(--good);min-width:52px;}
  .empty{color:var(--dim2);font-style:italic;font-size:13.5px;}

  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
         color:var(--dim2);font-size:12.5px;line-height:1.7;}
  code{font-family:var(--mono);font-size:.9em;color:var(--dim);}
</style>
</head>
<body>
<div class="wrap">

<h1>Speaker Browser</h1>
<div class="sub">Audition and cast the 904 speakers inside <code>en_US-libritts_r-medium</code>.
Type a line, press &#9654; on any speaker, star the keepers.</div>

<div id="conn"></div>
<div id="metanote"></div>

<div class="bar">
  <label class="lbl" for="line">Audition line</label>
  <input id="line" type="text" spellcheck="false" autocomplete="off">
  <div class="row2">
    <div class="filt" id="filt"></div>
    <div class="filt" id="filtpitch"></div>
    <span class="spacer"></span>
    <span class="sortwrap" id="sortwrap"></span>
    <input id="jump" type="text" placeholder="Jump to index&hellip;" autocomplete="off">
    <button id="jumpgo">Go</button>
    <button id="stopall">&#9632; Stop</button>
  </div>
</div>

<div class="rows" id="rows"></div>
<div class="pager" id="pager"></div>

<h2 class="sect">&#9733; Starred</h2>
<div class="stars" id="starpanel"></div>

<footer id="foot"></footer>

</div>
<script>
(function () {
  "use strict";

  // ── CONFIG ─────────────────────────────────────────────────────────────────────────────────
  var TTS_SERVER_DEFAULT = "https://tnd-tts.fly.dev";
  var TTS_URL_K   = "tnd_tts_url_v1";        // dev override, same key tts.js reads
  var TOKEN_K     = "tnd_server_tok_v1";     // written by the game's Connect to server flow
  var STARS_K     = "tnd_speaker_stars_v1";  // [{id,label}] — the in-game dropdown reads this
  var BASE_VOICE  = "en_US-libritts_r-medium";
  var SPEAKER_N   = 904;                     // speakers in the base model (fixed by the model)
  var META_URL    = "./libritts_speakers.json";
  var DEFAULT_LINE = "The gate was already open, and the mist had not yet lifted.";
  var PAGE_SIZE   = 60;
  var RATE        = 1.0;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

  function serverUrl() {
    var u = lsGet(TTS_URL_K);
    u = (u && String(u).trim()) || TTS_SERVER_DEFAULT;
    return u.replace(/\/+$/, "");
  }
  function token() { var t = lsGet(TOKEN_K); return (t && String(t).trim()) || ""; }

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = String(txt);
    return n;
  }

  // ── Connection banner ──────────────────────────────────────────────────────────────────────
  var HAVE_TOKEN = !!token();

  function renderConn() {
    var box = $("conn");
    box.innerHTML = "";
    var b = el("div", "banner" + (HAVE_TOKEN ? "" : " bad"));
    if (HAVE_TOKEN) {
      b.appendChild(el("span", null, "Connected. Auditions synthesize on "));
      var c = el("code", null, serverUrl());
      b.appendChild(c);
      b.appendChild(el("span", null, " using your game session."));
    } else {
      b.appendChild(el("b", null, "Not connected"));
      b.appendChild(el("span", null,
        " — open the game, File ▸ Admin ▸ Connect to server, then reload this page."));
      var n = el("div", "note", "Auditions are disabled until then. Starring still works — it is a local list.");
      b.appendChild(n);
    }
    box.appendChild(b);
  }

  // ── Speaker table ──────────────────────────────────────────────────────────────────────────
  // SPEAKERS is always the full 0..SPEAKER_N-1 range, one entry per piper index. Metadata, when
  // it loads, decorates entries with a LibriTTS reader id + gender, and OPTIONALLY with a real
  // name and acoustic measurements. Anything the metadata does not cover stays visible as an
  // unknown — never hidden, never guessed.
  var SPEAKERS = [];
  var META_OK  = false;
  var metaMsg  = "";
  var metaWarn = false;
  var ACOUSTICS = null;                       // top-level {generated, sampleText, method}, if any

  // Per-field presence flags — every UI affordance that depends on an optional field is gated
  // on one of these, so "field absent" degrades to the pre-option-2 page rather than to an
  // empty control. Computed in applyMeta from what actually landed.
  var HAS_NAME = false, HAS_DESC = false, HAS_PB = false, HAS_F0 = false, HAS_SPS = false;

  var PITCH_BUCKETS = ["deep", "mid", "bright"];
  var RATE_BUCKETS  = ["measured", "steady", "quick"];

  (function seed() {
    for (var i = 0; i < SPEAKER_N; i++) {
      SPEAKERS.push({ spk: i, reader: null, g: "?",
                      name: null, desc: null, f0: null, sps: null, pb: null, rb: null });
    }
  })();

  // Defensive scalar coercions for the optional fields. Each returns null on anything it does
  // not recognise — a bad value must never become a rendered lie.
  function normStr(v, max) {
    if (v === undefined || v === null || typeof v === "object") return null;
    var s = String(v).replace(/[\u0000-\u001f\u007f]/g, " ").replace(/\s+/g, " ").trim();
    if (!s) return null;
    if (max && s.length > max) s = s.slice(0, max - 1) + "…";
    return s;
  }
  function normNum(v) {
    if (v === undefined || v === null || v === "" || typeof v === "object") return null;
    var n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    return n;
  }
  function normBucket(v, allowed) {
    var s = String(v === undefined || v === null ? "" : v).trim().toLowerCase();
    for (var i = 0; i < allowed.length; i++) if (allowed[i] === s) return s;
    return null;                              // unknown bucket word → no bucket, not a guess
  }
  function round1(n) { return Math.round(n * 10) / 10; }

  function normGender(v) {
    var s = String(v == null ? "" : v).trim().toLowerCase();
    if (s === "f" || s === "female" || s === "w" || s === "woman") return "F";
    if (s === "m" || s === "male" || s === "man") return "M";
    return "?";
  }
  function pick(o, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (o && Object.prototype.hasOwnProperty.call(o, keys[i]) && o[keys[i]] !== null && o[keys[i]] !== "") {
        return o[keys[i]];
      }
    }
    return undefined;
  }
  function asIndex(v) {
    if (v === undefined || v === null || v === "") return -1;
    var n = Number(v);
    if (!isFinite(n) || Math.floor(n) !== n || n < 0) return -1;
    return n;
  }

  // Accepts the shapes the metadata generator could plausibly emit; anything else is refused
  // with a visible note rather than silently mis-cast.
  //   { "1034": {g:"F", spk:0}, ... }        (the S4 shape)
  //   { "1034": 0, ... }                     (reader -> index, gender unknown)
  //   { "1034": "F", ... }                   (reader -> gender; index taken from file order)
  //   [ {readerId:"1034", g:"F", spk:0}, ...]
  //   { speakers: <any of the above> }
  function parseMeta(raw) {
    if (!raw || typeof raw !== "object") return { ok: false, why: "not a JSON object or array" };
    var inner = pick(raw, ["speakers", "readers", "data"]);
    if (!Array.isArray(raw) && inner && typeof inner === "object") raw = inner;

    var out = [], orderIdx = 0, orderUsed = false, bad = 0, i, k, reader, v, spk, g;

    function take(readerKey, val, ord) {
      var rd = readerKey, sp = -1, gd = "?";
      var nm = null, ds = null, f0 = null, sps = null, pb = null, rb = null;
      if (val && typeof val === "object" && !Array.isArray(val)) {
        if (rd === null) rd = pick(val, ["readerId", "reader_id", "reader", "id", "name"]);
        sp = asIndex(pick(val, ["spk", "speaker", "speaker_id", "speakerId", "index", "idx", "i", "sid"]));
        gd = normGender(pick(val, ["g", "gender", "sex"]));
        // Optional option-2 fields. Each is independent — a name with no acoustics, or
        // acoustics with no name, are both perfectly valid inputs.
        nm  = normStr(pick(val, ["n", "readerName", "reader_name", "name"]), 60);
        ds  = normStr(pick(val, ["d", "desc", "descriptor"]), 80);
        f0  = normNum(pick(val, ["f0", "pitch", "medianF0"]));
        sps = normNum(pick(val, ["sps", "rate", "syllablesPerSecond"]));
        pb  = normBucket(pick(val, ["pb", "pitchBucket"]), PITCH_BUCKETS);
        rb  = normBucket(pick(val, ["rb", "rateBucket"]), RATE_BUCKETS);
        // In the array shape the reader id is harvested from "name" as a last resort; if that
        // is what happened, do not also render it as the reader's real name.
        if (nm !== null && rd !== undefined && rd !== null && nm === String(rd)) nm = null;
      } else if (typeof val === "number") {
        sp = asIndex(val);
      } else if (typeof val === "string") {
        var maybe = asIndex(val);
        if (maybe >= 0 && /^\d+$/.test(val.trim())) sp = maybe;
        else gd = normGender(val);
      }
      if (sp < 0) { sp = ord; orderUsed = true; }          // fall back to file order
      if (sp < 0 || sp >= SPEAKER_N) { bad++; return; }
      out.push({ spk: sp, reader: (rd === undefined || rd === null) ? null : String(rd), g: gd,
                 name: nm, desc: ds, f0: f0, sps: sps, pb: pb, rb: rb });
    }

    if (Array.isArray(raw)) {
      for (i = 0; i < raw.length; i++) take(null, raw[i], orderIdx++);
    } else {
      var keys = Object.keys(raw);
      if (!keys.length) return { ok: false, why: "empty object" };
      for (i = 0; i < keys.length; i++) { k = keys[i]; take(k, raw[k], orderIdx++); }
    }
    if (!out.length) return { ok: false, why: "no usable entries" };
    return { ok: true, list: out, bad: bad, orderUsed: orderUsed };
  }

  function applyMeta(res) {
    var seen = {}, dup = 0, applied = 0, i, e, t;
    var nNames = 0, nDesc = 0, nPb = 0, nF0 = 0, nSps = 0;
    for (i = 0; i < res.list.length; i++) {
      e = res.list[i];
      if (seen[e.spk]) { dup++; continue; }
      seen[e.spk] = 1;
      t = SPEAKERS[e.spk];
      t.reader = e.reader;
      t.g = e.g;
      t.name = e.name; t.desc = e.desc;
      t.f0 = e.f0; t.sps = e.sps; t.pb = e.pb; t.rb = e.rb;
      if (t.name) nNames++;
      if (t.desc) nDesc++;
      if (t.pb) nPb++;
      if (t.f0 !== null) nF0++;
      if (t.sps !== null) nSps++;
      applied++;
    }
    META_OK = true;
    HAS_NAME = nNames > 0; HAS_DESC = nDesc > 0;
    HAS_PB = nPb > 0; HAS_F0 = nF0 > 0; HAS_SPS = nSps > 0;

    var parts = ["Speaker metadata loaded — " + applied + " of " + SPEAKER_N + " speakers described."];
    if (applied < SPEAKER_N) parts.push((SPEAKER_N - applied) + " show as unknown (?).");
    if (dup) parts.push(dup + " duplicate index entries ignored.");
    if (res.bad) parts.push(res.bad + " entries dropped (index missing or out of range).");
    if (res.orderUsed) parts.push("Some indices were taken from file order because no explicit speaker index was present — verify a few auditions against the reader ids.");
    // Optional-field coverage is informational, never a warning — absence is a valid state.
    if (nNames) parts.push(nNames + " carry a reader name.");
    if (nDesc) parts.push(nDesc + " carry an acoustic descriptor.");
    metaWarn = !!(dup || res.bad || res.orderUsed || applied < SPEAKER_N);
    metaMsg = parts.join(" ");
  }

  // Top-level "acoustics" block, captured before parseMeta descends into .speakers.
  function captureAcoustics(raw) {
    var a = raw && raw.acoustics;
    if (!a || typeof a !== "object" || Array.isArray(a)) return;
    ACOUSTICS = {
      generated:  normStr(a.generated, 40),
      sampleText: normStr(a.sampleText, 240),
      method:     normStr(a.method, 140)
    };
  }

  function renderMetaNote() {
    var box = $("metanote");
    box.innerHTML = "";
    if (!metaMsg) return;
    var b = el("div", "banner" + (metaWarn ? " bad" : ""));
    b.appendChild(el("span", null, metaMsg));
    box.appendChild(b);
  }

  function loadMeta(done) {
    var fin = function (msg, warn) { metaMsg = msg; metaWarn = !!warn; renderMetaNote(); done(); };
    if (typeof fetch !== "function") { fin("No fetch support — showing all " + SPEAKER_N + " speakers by piper index.", true); return; }
    fetch(META_URL, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (j) {
      captureAcoustics(j);
      var res = parseMeta(j);
      if (!res.ok) { fin("libritts_speakers.json could not be read (" + res.why + ") — showing all " + SPEAKER_N + " speakers by piper index, no gender filter.", true); return; }
      applyMeta(res);
      renderMetaNote();
      done();
    })["catch"](function (e) {
      fin("libritts_speakers.json not loaded (" + ((e && e.message) || e) + ") — showing all " +
          SPEAKER_N + " speakers by piper index, no gender filter. Serve this page over http:// if you opened it from file://.", true);
      done();
    });
  }

  // ── Stars ──────────────────────────────────────────────────────────────────────────────────
  // CONTRACT: localStorage["tnd_speaker_stars_v1"] = [{id:"<model>#<idx>", label:"<user text>"}]
  var stars = [];

  function loadStars() {
    stars = [];
    var raw = lsGet(STARS_K);
    if (!raw) return;
    var arr;
    try { arr = JSON.parse(raw); } catch (e) { console.warn("[speaker_browser] stars unreadable, starting empty:", e); return; }
    if (!Array.isArray(arr)) { console.warn("[speaker_browser] stars not an array, starting empty"); return; }
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      if (!it) continue;
      var id = (typeof it === "string") ? it : it.id;
      if (!id || typeof id !== "string") continue;
      stars.push({ id: id, label: String((it && it.label) || "") });
    }
  }
  function saveStars() {
    if (!lsSet(STARS_K, JSON.stringify(stars))) {
      alert("Could not save stars — localStorage is full or blocked. Your latest change was NOT stored.");
    }
  }
  function idFor(spk) { return BASE_VOICE + "#" + spk; }
  function starPos(id) {
    for (var i = 0; i < stars.length; i++) if (stars[i].id === id) return i;
    return -1;
  }
  function defaultLabel(s) {
    var t = "Speaker " + s.spk;
    if (s.reader) t += " · reader " + s.reader;
    if (s.g === "F" || s.g === "M") t += " (" + s.g + ")";
    return t;
  }
  function toggleStar(s) {
    var id = idFor(s.spk), p = starPos(id);
    if (p >= 0) stars.splice(p, 1);
    else stars.push({ id: id, label: defaultLabel(s) });
    saveStars();
    renderStars();
  }

  // ── Audition ───────────────────────────────────────────────────────────────────────────────
  var curAudio = null, curUrl = null, curCtl = null, curSpk = null, gen = 0;
  var rowEls = {};   // spk -> {btn, st, row}  (current page only)

  function setPlayUI(spk, mode) {
    var r = rowEls[spk];
    if (!r) return;
    if (mode === "load") { r.btn.className = "play on"; r.btn.textContent = "…"; }
    else if (mode === "play") { r.btn.className = "play on"; r.btn.textContent = "■"; }
    else { r.btn.className = "play"; r.btn.textContent = "▶"; }
  }
  function setStatus(spk, text, isErr) {
    var r = rowEls[spk];
    if (!r) return;
    r.st.className = "st" + (isErr ? " err" : "");
    r.st.textContent = text || "";
  }

  function stopAudition() {
    gen++;                                  // invalidates any in-flight response
    if (curCtl) { try { curCtl.abort(); } catch (e) {} curCtl = null; }
    if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio.onended = null; curAudio.onerror = null; curAudio = null; }
    if (curUrl) { try { URL.revokeObjectURL(curUrl); } catch (e) {} curUrl = null; }
    // Clear the stopped row's status too — a superseded audition must not leave a stale
    // "synthesizing…" behind. Error paths call stopAudition FIRST and write the message after,
    // so a real failure still shows.
    if (curSpk !== null) { setPlayUI(curSpk, "idle"); setStatus(curSpk, "", false); curSpk = null; }
  }

  function auditionText() {
    var t = $("line").value;
    t = (t === undefined || t === null) ? "" : String(t).trim();
    return t || DEFAULT_LINE;
  }

  function audition(s) {
    if (!HAVE_TOKEN) return;
    var was = (curSpk === s.spk);
    stopAudition();
    if (was) return;                        // second press on the playing row = stop

    var my = gen, spk = s.spk, vid = idFor(spk), text = auditionText();
    curSpk = spk;
    setPlayUI(spk, "load");
    setStatus(spk, "synthesizing…", false);

    var ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    curCtl = ctl;
    var opts = {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token() },
      body: JSON.stringify({ text: text, voiceId: vid, rate: RATE })
    };
    if (ctl) opts.signal = ctl.signal;

    fetch(serverUrl() + "/api/tts", opts).then(function (res) {
      if (my !== gen) return null;
      if (!res.ok) {
        return res.text().then(function (body) {
          var detail = "";
          try { var j = JSON.parse(body); if (j && j.error) detail = String(j.error); } catch (e) {}
          if (!detail && body) detail = String(body).slice(0, 200);
          throw new Error("HTTP " + res.status + (detail ? " — " + detail : ""));
        }, function () { throw new Error("HTTP " + res.status); });
      }
      return res.blob();
    }).then(function (blob) {
      if (my !== gen || !blob) return;
      curUrl = URL.createObjectURL(blob);
      curCtl = null;
      var a = new Audio(curUrl);
      curAudio = a;
      a.onended = function () { if (my === gen) { setStatus(spk, "", false); stopAudition(); } };
      a.onerror = function () {
        if (my !== gen) return;
        setStatus(spk, "playback failed (the browser could not decode the audio)", true);
        stopAudition();
      };
      var p = a.play();
      if (p && typeof p["catch"] === "function") {
        p["catch"](function (e) {
          if (my !== gen) return;
          setStatus(spk, "playback blocked: " + ((e && e.message) || e), true);
          stopAudition();
        });
      }
      setPlayUI(spk, "play");
      setStatus(spk, "playing…", false);
    })["catch"](function (e) {
      if (my !== gen) return;
      var msg = (e && e.name === "AbortError") ? "cancelled" : ((e && e.message) || String(e));
      console.warn("[speaker_browser] audition " + vid + " failed:", msg);
      stopAudition();                       // resets the button; the message below survives it
      setStatus(spk, msg, true);
    });
  }

  // ── Grid ───────────────────────────────────────────────────────────────────────────────────
  // Two independent filters (gender, pitch bucket) that COMPOSE, plus a sort. With no optional
  // metadata the pitch filter stays "all" and sort stays "idx", so viewList() returns SPEAKERS
  // itself — the identical list the pre-option-2 page paged through.
  var filter = "all", pitchFilter = "all", sortMode = "idx", page = 0, hitSpk = null;

  function matchG(s) { return !META_OK || filter === "all" || s.g === filter; }
  function matchP(s) { return !HAS_PB || pitchFilter === "all" || s.pb === pitchFilter; }

  // Stable sort by an optional numeric key; entries missing the key keep their relative order
  // and go last. (Decorate/sort/undecorate — engine sort stability is not assumed.)
  function sortList(list) {
    if (sortMode === "idx") return list;
    var key = (sortMode === "rate") ? "sps" : "f0";
    var desc = (sortMode === "f0desc");
    var dec = list.map(function (s, i) {
      return { s: s, i: i, v: (typeof s[key] === "number" && isFinite(s[key])) ? s[key] : null };
    });
    dec.sort(function (a, b) {
      if (a.v === null && b.v === null) return a.i - b.i;
      if (a.v === null) return 1;
      if (b.v === null) return -1;
      if (a.v !== b.v) return desc ? (b.v - a.v) : (a.v - b.v);
      return a.i - b.i;
    });
    return dec.map(function (x) { return x.s; });
  }

  function viewList() {
    var list = SPEAKERS;
    if (META_OK && filter !== "all") list = list.filter(matchG);
    if (HAS_PB && pitchFilter !== "all") list = list.filter(matchP);
    return sortList(list);                  // never mutates SPEAKERS (filter/map return copies)
  }

  // Counts are cross-filtered so the two chip rows describe what clicking them would actually
  // yield. With no pitch data both reduce to the plain global counts shown before.
  function countsGender() {
    var c = { all: 0, F: 0, M: 0, "?": 0 }, i, s;
    for (i = 0; i < SPEAKERS.length; i++) {
      s = SPEAKERS[i];
      if (!matchP(s)) continue;
      c.all++;
      c[s.g === "F" ? "F" : s.g === "M" ? "M" : "?"]++;
    }
    return c;
  }
  function countsPitch() {
    var c = { all: 0, deep: 0, mid: 0, bright: 0 }, i, s;
    for (i = 0; i < SPEAKERS.length; i++) {
      s = SPEAKERS[i];
      if (!matchG(s)) continue;
      c.all++;
      if (s.pb && c.hasOwnProperty(s.pb)) c[s.pb]++;
    }
    return c;
  }

  function renderFilters() {
    var box = $("filt");
    box.innerHTML = "";
    if (!META_OK) return;                   // S4: no metadata, no gender filter — never guess
    var c = countsGender();
    var defs = [["all", "All"], ["F", "F"], ["M", "M"], ["?", "?"]];
    defs.forEach(function (d) {
      var b = el("button", filter === d[0] ? "on" : "", d[1] + " " + c[d[0]]);
      b.onclick = function () { filter = d[0]; page = 0; hitSpk = null; stopAudition(); renderRows(); };
      box.appendChild(b);
    });
  }

  function renderPitchFilters() {
    var box = $("filtpitch");
    box.innerHTML = "";
    if (!HAS_PB) return;                    // no pitch buckets in the file → no chips at all
    var c = countsPitch();
    var defs = [["all", "All"], ["deep", "Deep"], ["mid", "Mid"], ["bright", "Bright"]];
    defs.forEach(function (d) {
      var b = el("button", pitchFilter === d[0] ? "on" : "", d[1] + " " + c[d[0]]);
      b.title = (d[0] === "all") ? "Any pitch" : "Speakers measured as " + d[0];
      b.onclick = function () { pitchFilter = d[0]; page = 0; hitSpk = null; stopAudition(); renderRows(); };
      box.appendChild(b);
    });
  }

  function renderSort() {
    var box = $("sortwrap");
    box.innerHTML = "";
    if (!HAS_F0 && !HAS_SPS) return;        // nothing measurable to sort by → no control
    var opts = [["idx", "Piper index"]];
    if (HAS_F0) { opts.push(["f0asc", "Pitch low → high"]); opts.push(["f0desc", "Pitch high → low"]); }
    if (HAS_SPS) opts.push(["rate", "Speaking rate slow → fast"]);
    if (opts.length < 2) return;

    var sel = document.createElement("select");
    sel.id = "sort";
    opts.forEach(function (o) {
      var op = document.createElement("option");
      op.value = o[0];
      op.textContent = o[1];
      if (sortMode === o[0]) op.selected = true;
      sel.appendChild(op);
    });
    sel.onchange = function () {
      sortMode = sel.value; page = 0; hitSpk = null; stopAudition(); renderRows();
    };
    box.appendChild(el("span", "slbl", "Sort"));
    box.appendChild(sel);
  }

  // Numbers live in the tooltip, not the row — the row stays plain descriptor words.
  function acousticTip(s) {
    var p = [];
    if (s.f0 !== null && s.f0 !== undefined) p.push("median pitch " + Math.round(s.f0) + " Hz");
    if (s.sps !== null && s.sps !== undefined) p.push(round1(s.sps) + " syllables/sec");
    if (s.pb) p.push("pitch: " + s.pb);
    if (s.rb) p.push("rate: " + s.rb);
    return p.join(" · ");
  }

  function renderRows() {
    var list = viewList(), total = list.length;
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (page > pages - 1) page = pages - 1;
    if (page < 0) page = 0;
    var start = page * PAGE_SIZE, end = Math.min(total, start + PAGE_SIZE);

    var box = $("rows");
    // .rich only when the extra cells actually exist — it is what the narrow-screen layout
    // rule keys off, so the degraded page keeps exactly its old class list.
    box.className = "rows" + ((HAS_NAME || HAS_DESC) ? " rich" : "");
    box.innerHTML = "";
    rowEls = {};

    if (!total) {
      box.appendChild(el("div", "empty", "No speakers match this filter."));
    }

    for (var i = start; i < end; i++) {
      (function (s) {
        var starred = starPos(idFor(s.spk)) >= 0;
        var row = el("div", "r" + (starred ? " starred" : "") + (hitSpk === s.spk ? " hit" : ""));

        var pb = el("button", "play", "▶");
        pb.title = HAVE_TOKEN ? "Audition this speaker (one server call)" : "Connect in the game to audition";
        pb.disabled = !HAVE_TOKEN;
        pb.onclick = function () { audition(s); };

        var sb = el("button", "star" + (starred ? " on" : ""), starred ? "★" : "☆");
        sb.title = starred ? "Remove from starred" : "Add to starred";
        sb.onclick = function () { toggleStar(s); renderRows(); };

        row.appendChild(pb);
        row.appendChild(el("div", "idx", "#" + s.spk));
        row.appendChild(el("div", "rd", s.reader ? "reader " + s.reader : "—"));
        // Name and descriptor cells exist only when the file actually carries those fields, so
        // a file without them produces the exact DOM the page produced before option 2.
        if (HAS_NAME) row.appendChild(el("div", "nm", s.name || ""));
        row.appendChild(el("div", "g", s.g));
        if (HAS_DESC) {
          var dc = el("div", "desc", s.desc || "");
          var tip = acousticTip(s);
          if (tip) dc.title = tip;
          row.appendChild(dc);
        }
        var st = el("div", "st", "");
        row.appendChild(st);
        row.appendChild(sb);
        box.appendChild(row);

        rowEls[s.spk] = { btn: pb, st: st, row: row };
        if (curSpk === s.spk) { setPlayUI(s.spk, curAudio ? "play" : "load"); }
      })(list[i]);
    }

    var pg = $("pager");
    pg.innerHTML = "";
    var prev = el("button", "", "← Prev");
    prev.disabled = (page <= 0);
    prev.onclick = function () { page--; hitSpk = null; renderRows(); window.scrollTo(0, 0); };
    var next = el("button", "", "Next →");
    next.disabled = (page >= pages - 1);
    next.onclick = function () { page++; hitSpk = null; renderRows(); window.scrollTo(0, 0); };
    pg.appendChild(prev);
    pg.appendChild(next);
    var isFiltered = (META_OK && filter !== "all") || (HAS_PB && pitchFilter !== "all");
    pg.appendChild(el("span", null, "Page " + (page + 1) + " / " + pages +
      (total ? " · showing " + (start + 1) + "–" + end + " of " + total : "") +
      (isFiltered ? " (filtered)" : "") +
      (sortMode !== "idx" ? " · sorted" : "")));

    renderFilters();
    renderPitchFilters();
    renderSort();
  }

  function jumpTo(q) {
    q = String(q || "").replace(/^#/, "").trim();
    if (!q) return;
    var list = viewList(), i, pos = -1;
    var n = Number(q);
    if (/^\d+$/.test(q)) {
      for (i = 0; i < list.length; i++) if (list[i].spk === n) { pos = i; break; }
    }
    if (pos < 0) {                          // not an index in view — try reader id
      for (i = 0; i < list.length; i++) if (list[i].reader && String(list[i].reader) === q) { pos = i; break; }
    }
    if (pos < 0 && HAS_NAME) {              // …then a case-insensitive name substring, first match
      var ql = q.toLowerCase();
      for (i = 0; i < list.length; i++) {
        if (list[i].name && list[i].name.toLowerCase().indexOf(ql) >= 0) { pos = i; break; }
      }
    }
    if (pos < 0) {
      alert(HAS_NAME
        ? ("Nothing matching “" + q + "” in the current filter. Try a piper index (0–" +
           (SPEAKER_N - 1) + "), a reader id, or part of a name.")
        : ("No speaker " + q + " in the current filter. Indices run 0–" + (SPEAKER_N - 1) + "."));
      return;
    }
    page = Math.floor(pos / PAGE_SIZE);
    hitSpk = list[pos].spk;
    renderRows();
    var r = rowEls[hitSpk];
    if (r && r.row.scrollIntoView) r.row.scrollIntoView({ block: "center" });
  }

  // ── Starred panel ──────────────────────────────────────────────────────────────────────────
  function copyId(id, msgEl) {
    function ok() { msgEl.textContent = "copied"; setTimeout(function () { msgEl.textContent = ""; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(id).then(ok, function () { window.prompt("Copy this voice id:", id); });
    } else {
      window.prompt("Copy this voice id:", id);
    }
  }

  // Resolve a starred id back to loaded metadata, for display only. STORAGE IS UNTOUCHED —
  // stars remain [{id,label}] under the same key; this just annotates what is on screen.
  var NO_STAR_META = { text: "", tip: "" };
  function starMeta(id) {
    id = String(id || "");
    if (id.indexOf(BASE_VOICE + "#") !== 0) return NO_STAR_META;  // another model — do not guess
    var m = /#(\d+)$/.exec(id);
    if (!m) return NO_STAR_META;
    var spk = Number(m[1]);
    if (!(spk >= 0 && spk < SPEAKER_N)) return NO_STAR_META;
    var s = SPEAKERS[spk];
    if (!s) return NO_STAR_META;
    var p = [];
    if (s.name) p.push(s.name);
    if (s.desc) p.push(s.desc);
    return { text: p.join(" · "), tip: acousticTip(s) };
  }

  function renderStars() {
    var box = $("starpanel");
    box.innerHTML = "";
    if (!stars.length) {
      box.appendChild(el("div", "empty",
        "Nothing starred yet. Press ☆ on a speaker to keep it — the game's voice dropdown reads this list."));
      return;
    }
    stars.forEach(function (item, idx) {
      var r = el("div", "sr");

      var pb = el("button", "play", "▶");
      pb.disabled = !HAVE_TOKEN;
      pb.title = HAVE_TOKEN ? "Audition" : "Connect in the game to audition";
      pb.onclick = function () {
        var m = /#(\d+)$/.exec(item.id);
        if (!m) { alert("This starred id has no speaker index: " + item.id); return; }
        var spk = Number(m[1]);
        if (spk >= 0 && spk < SPEAKER_N) audition(SPEAKERS[spk]);
        else alert("Speaker index out of range: " + item.id);
      };

      var inp = document.createElement("input");
      inp.type = "text";
      inp.value = item.label || "";
      inp.placeholder = "Label (e.g. Gravelly innkeeper)";
      inp.oninput = function () { stars[idx].label = inp.value; saveStars(); };

      var msg = el("span", "msg", "");
      var cb = el("button", "", "copy id");
      cb.onclick = function () { copyId(item.id, msg); };
      var xb = el("button", "", "✕");
      xb.title = "Remove from starred";
      xb.onclick = function () { stars.splice(idx, 1); saveStars(); renderStars(); renderRows(); };

      r.appendChild(pb);
      r.appendChild(el("div", "sid", item.id));
      var sm = starMeta(item.id);
      if (sm.text) {
        var smEl = el("div", "smeta", sm.text);
        if (sm.tip) smEl.title = sm.tip;
        r.appendChild(smEl);
      }
      r.appendChild(inp);
      r.appendChild(cb);
      r.appendChild(msg);
      r.appendChild(xb);
      box.appendChild(r);
    });
  }

  // ── Footer ─────────────────────────────────────────────────────────────────────────────────
  function renderFooter() {
    var f = $("foot");
    f.innerHTML = "";
    f.appendChild(el("div", null,
      "Auditions synthesize on the server — every ▶ is one real /api/tts call, nothing is pre-rendered."));
    f.appendChild(el("div", null,
      "In game, speaker voices play server-side; offline play falls back to the base voice (" + BASE_VOICE + ")."));
    if (ACOUSTICS && ACOUSTICS.sampleText) {
      f.appendChild(el("div", null,
        "Acoustic descriptors were measured from one fixed sample line — “" + ACOUSTICS.sampleText + "”" +
        (ACOUSTICS.method ? " · " + ACOUSTICS.method : "") +
        (ACOUSTICS.generated ? " · " + ACOUSTICS.generated : "") + "."));
    }
    f.appendChild(el("div", null,
      "Stars live in this browser only (localStorage · " + STARS_K + "). TODO #95 · satellite page, outside the app shell."));
  }

  // ── Boot ───────────────────────────────────────────────────────────────────────────────────
  $("line").value = DEFAULT_LINE;
  $("jumpgo").onclick = function () { jumpTo($("jump").value); };
  $("jump").onkeydown = function (e) { if (e.key === "Enter" || e.keyCode === 13) jumpTo($("jump").value); };
  $("stopall").onclick = function () { stopAudition(); };
  window.addEventListener("beforeunload", function () { stopAudition(); });

  renderConn();
  renderFooter();
  loadStars();
  renderStars();
  renderRows();
  loadMeta(function () {
    // Metadata may have added names/descriptors, so the rows, the starred panel and the
    // footer's provenance line all repaint once, after it lands.
    if (HAS_NAME) $("jump").placeholder = "Jump to index or name…";
    renderRows();
    renderStars();
    renderFooter();
  });
})();
</script>
</body>
</html>
