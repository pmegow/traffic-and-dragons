<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-label="A dragon squeezed into a small car, stuck in evening traffic.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f142a"/>
      <stop offset=".45" stop-color="#3a2a52"/>
      <stop offset=".78" stop-color="#b3563c"/>
      <stop offset="1" stop-color="#f0a650"/>
    </linearGradient>
    <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tail" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3b30" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23212c"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <!-- one ordinary car, facing right; its colour comes from the <use> element's "color" -->
    <g id="car">
      <path d="M414 96 L520 70 L520 146 L414 108 Z" fill="url(#beam)"/>
      <circle cx="8" cy="94" r="54" fill="url(#tail)"/>
      <path d="M6 136 L6 96 Q6 80 24 76 L86 68 L128 22 Q136 12 150 12 L262 12 Q276 12 286 22 L330 70 L396 80 Q414 84 414 102 L414 136 Z" fill="currentColor"/>
      <path d="M140 26 L258 26 Q266 26 272 33 L304 68 L106 68 Z" fill="#0b0d15" fill-opacity=".85"/>
      <rect x="196" y="24" width="8" height="46" fill="currentColor"/>
      <rect x="6" y="118" width="408" height="18" fill="#000" fill-opacity=".25"/>
      <circle cx="90" cy="136" r="34" fill="#08080b"/><circle cx="90" cy="136" r="14" fill="#30333d"/>
      <circle cx="330" cy="136" r="34" fill="#08080b"/><circle cx="330" cy="136" r="14" fill="#30333d"/>
      <rect x="3" y="86" width="12" height="16" rx="4" fill="#ff3b30"/>
      <rect x="404" y="90" width="10" height="12" rx="3" fill="#ffe9a8"/>
    </g>
  </defs>

  <!-- sky, stars, sun -->
  <rect width="1600" height="660" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="120" cy="80" r="2" opacity=".8"/><circle cx="310" cy="150" r="1.5" opacity=".6"/><circle cx="470" cy="60" r="2" opacity=".7"/>
    <circle cx="700" cy="120" r="1.5" opacity=".6"/><circle cx="880" cy="50" r="2" opacity=".8"/><circle cx="1050" cy="170" r="1.5" opacity=".5"/>
    <circle cx="1490" cy="90" r="2" opacity=".7"/><circle cx="1560" cy="210" r="1.5" opacity=".5"/><circle cx="60" cy="240" r="1.5" opacity=".5"/>
  </g>
  <path d="M0 640 L0 500 L160 380 L330 520 L520 400 L760 560 L980 470 L1200 560 L1400 420 L1600 520 L1600 640 Z" fill="#2a2147" opacity=".85"/>
  <circle cx="1010" cy="610" r="340" fill="url(#sunglow)"/>
  <circle cx="1010" cy="610" r="100" fill="#ffd27a"/>

  <!-- the skyline: a castle among the office blocks -->
  <path fill="#1b1830" d="M0 640 L0 566 L70 566 L70 528 L130 528 L130 580 L190 580 L190 470 L180 470 L215 418 L250 470 L240 470 L240 540 L255 540 L255 528 L270 528 L270 540 L285 540 L285 528 L300 528 L300 430 L290 430 L340 356 L390 430 L380 430 L380 528 L395 528 L395 540 L410 540 L410 528 L425 528 L425 540 L430 540 L430 482 L422 482 L450 438 L478 482 L470 482 L470 590 L540 590 L540 500 L600 500 L600 560 L660 560 L660 470 L700 470 L700 450 L720 450 L720 470 L740 470 L740 590 L820 590 L820 530 L890 530 L890 600 L1130 600 L1130 540 L1190 540 L1190 490 L1250 490 L1250 560 L1320 560 L1320 440 L1390 440 L1390 520 L1450 520 L1450 480 L1520 480 L1520 570 L1600 570 L1600 640 Z"/>
  <path d="M340 356 L340 326" stroke="#1b1830" stroke-width="4"/>
  <path d="M340 326 L368 335 L340 344 Z" fill="#c8922a"/>
  <g fill="#f6cf6a" opacity=".8">
    <rect x="86" y="540" width="8" height="10"/><rect x="108" y="552" width="8" height="10"/><rect x="330" y="456" width="8" height="14"/><rect x="346" y="486" width="8" height="14"/>
    <rect x="210" y="494" width="7" height="12"/><rect x="556" y="520" width="8" height="10"/><rect x="578" y="544" width="8" height="10"/><rect x="676" y="490" width="8" height="10"/>
    <rect x="712" y="520" width="8" height="10"/><rect x="842" y="548" width="8" height="10"/><rect x="1206" y="510" width="8" height="10"/><rect x="1340" y="462" width="8" height="10"/>
    <rect x="1364" y="494" width="8" height="10"/><rect x="1470" y="500" width="8" height="10"/><rect x="1494" y="530" width="8" height="10"/>
  </g>

  <!-- the road sign -->
  <rect x="1298" y="340" width="14" height="310" fill="#22232b"/>
  <rect x="1140" y="226" width="330" height="116" rx="8" fill="#1e5b45" stroke="#e8eef0" stroke-width="4"/>
  <text x="1164" y="282" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="#f2f6f7">CASTLE</text>
  <text x="1446" y="282" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="bold" fill="#f2f6f7" text-anchor="end">2 mi</text>
  <text x="1164" y="322" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#cfe3da">NEXT EXIT</text>
  <rect x="1165" y="352" width="280" height="46" rx="5" fill="#d8a04a"/>
  <text x="1305" y="384" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#1a1408" text-anchor="middle">EXPECT DELAYS</text>

  <!-- the road -->
  <rect y="630" width="1600" height="270" fill="url(#road)"/>
  <g fill="#ff3b30">
    <circle cx="40" cy="640" r="3" opacity=".6"/><circle cx="52" cy="640" r="3" opacity=".6"/><circle cx="210" cy="641" r="3" opacity=".6"/><circle cx="222" cy="641" r="3" opacity=".6"/>
    <circle cx="420" cy="640" r="3" opacity=".6"/><circle cx="432" cy="640" r="3" opacity=".6"/><circle cx="650" cy="641" r="3" opacity=".6"/><circle cx="662" cy="641" r="3" opacity=".6"/>
    <circle cx="930" cy="640" r="3" opacity=".6"/><circle cx="942" cy="640" r="3" opacity=".6"/><circle cx="1180" cy="641" r="3" opacity=".6"/><circle cx="1192" cy="641" r="3" opacity=".6"/>
    <circle cx="1450" cy="640" r="3" opacity=".6"/><circle cx="1462" cy="640" r="3" opacity=".6"/>
  </g>

  <!-- the far lane -->
  <g opacity=".95">
    <use xlink:href="#car" href="#car" transform="translate(-90 586) scale(.62)" style="color:#263247"/>
    <use xlink:href="#car" href="#car" transform="translate(196 586) scale(.62)" style="color:#3a2c3f"/>
    <use xlink:href="#car" href="#car" transform="translate(482 586) scale(.62)" style="color:#2c3a36"/>
    <use xlink:href="#car" href="#car" transform="translate(768 586) scale(.62)" style="color:#33304a"/>
    <use xlink:href="#car" href="#car" transform="translate(1054 586) scale(.62)" style="color:#41302c"/>
    <use xlink:href="#car" href="#car" transform="translate(1340 586) scale(.62)" style="color:#263247"/>
  </g>
  <path d="M0 712 H1600" stroke="#e8eef0" stroke-opacity=".3" stroke-width="5" stroke-dasharray="70 50"/>

  <!-- the near lane: the cars behind and ahead -->
  <use xlink:href="#car" href="#car" transform="translate(-396 621.5) scale(1.05)" style="color:#4a2a33"/>
  <use xlink:href="#car" href="#car" transform="translate(60 621.5) scale(1.05)" style="color:#2b4160"/>
  <use xlink:href="#car" href="#car" transform="translate(1100 621.5) scale(1.05)" style="color:#5b2f3a"/>
  <use xlink:href="#car" href="#car" transform="translate(1556 621.5) scale(1.05)" style="color:#2f4a44"/>

  <!-- the dragon's car: a hatchback one size too small -->
  <path d="M1000 716 L1100 690 L1100 772 L1000 730 Z" fill="url(#beam)"/>
  <circle cx="604" cy="716" r="58" fill="url(#tail)"/>
  <path d="M600 782 L600 716 Q600 698 618 694 L652 690 L686 612 Q692 598 708 598 L870 598 Q886 598 896 610 L944 690 L982 698 Q1000 702 1000 722 L1000 782 Z" fill="#c8922a"/>
  <rect x="600" y="758" width="400" height="24" fill="#000" fill-opacity=".22"/>
  <!-- windows, full of dragon -->
  <path d="M700 616 L776 616 L776 686 L670 686 Z" fill="#3f8459"/>
  <path d="M790 616 L866 616 Q876 616 882 624 L920 686 L790 686 Z" fill="#3f8459"/>
  <ellipse cx="846" cy="672" rx="40" ry="26" fill="#d9c98a" opacity=".85"/>
  <path d="M700 616 L776 616 L776 686 L670 686 Z" fill="#0b0d15" fill-opacity=".38"/>
  <path d="M790 616 L866 616 Q876 616 882 624 L920 686 L790 686 Z" fill="#0b0d15" fill-opacity=".3"/>
  <ellipse cx="892" cy="662" rx="8" ry="25" transform="rotate(-22 892 662)" fill="none" stroke="#15161c" stroke-width="6"/>
  <path d="M786 692 L786 776" stroke="#8a631a" stroke-width="3"/>
  <rect x="800" y="706" width="26" height="6" rx="3" fill="#8a631a"/>
  <circle cx="678" cy="762" r="40" fill="#08080b"/><circle cx="678" cy="762" r="17" fill="#30333d"/>
  <circle cx="918" cy="762" r="40" fill="#08080b"/><circle cx="918" cy="762" r="17" fill="#30333d"/>
  <rect x="598" y="706" width="11" height="18" rx="4" fill="#ff3b30"/>
  <rect x="991" y="708" width="9" height="14" rx="3" fill="#ffe9a8"/>
  <rect x="748" y="594" width="106" height="10" rx="4" fill="#15161c"/>

  <!-- the tail, out of the hatch and across the bonnet of the car behind -->
  <path d="M624 690 C570 688 548 716 520 708 C492 700 478 690 452 692 C430 694 420 684 410 672 L400 680 C412 700 430 712 454 710 C480 708 492 724 522 730 C556 736 580 716 626 722 Z" fill="#4f9a6a"/>
  <path d="M390 692 L386 648 L426 668 Z" fill="#2f6a4a"/>

  <!-- one wing, out of the rear window -->
  <path d="M742 662 L640 420 Q630 480 566 486 Q590 536 540 572 Q626 596 700 668 Z" fill="#3b7d58"/>
  <g stroke="#2f6a4a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M742 662 L640 420"/><path d="M742 662 L566 486"/><path d="M742 662 L540 572"/>
  </g>
  <path d="M640 420 L634 398 L652 414 Z" fill="#d9c98a"/>

  <!-- neck and head, up through the sunroof -->
  <g fill="#2f6a4a">
    <path d="M760 574 L736 552 L761 544 Z"/><path d="M768 530 L748 500 L778 502 Z"/><path d="M790 492 L780 458 L808 468 Z"/>
  </g>
  <path d="M760 604 C750 540 778 476 836 452 L796 414 L852 436 L830 388 L878 428 C902 420 930 426 946 440 L996 452 Q1012 458 1008 472 L1000 482 L926 498 Q896 502 886 520 C866 556 852 582 850 604 Z" fill="#4f9a6a"/>
  <path d="M886 520 C866 556 852 582 850 604 L824 604 C830 578 846 546 868 514 Z" fill="#d9c98a"/>
  <g stroke="#b9a86a" stroke-width="2" fill="none">
    <path d="M860 536 L878 542"/><path d="M848 558 L866 564"/><path d="M838 582 L856 586"/>
  </g>
  <path d="M882 500 L850 522 L884 478 Z" fill="#2f6a4a"/>
  <ellipse cx="914" cy="450" rx="10" ry="7" fill="#f4cf5a"/>
  <ellipse cx="915" cy="451" rx="2.4" ry="6" fill="#1a1408"/>
  <path d="M904 450 A10 7 0 0 1 924 450 Z" fill="#3f8459"/>
  <path d="M902 450 L926 450" stroke="#1f4a34" stroke-width="2.5"/>
  <path d="M898 436 L932 441" stroke="#2f6a4a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="992" cy="460" r="3.2" fill="#1f4a34"/>
  <path d="M1002 480 L940 491" stroke="#2f6a4a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#dcdce6">
    <circle cx="1034" cy="438" r="10" opacity=".55"/><circle cx="1060" cy="408" r="16" opacity=".4"/><circle cx="1096" cy="370" r="24" opacity=".26"/>
  </g>

  <!-- an arm out of the driver's window -->
  <path d="M812 676 Q830 660 852 668 L868 676 Q876 682 872 694 L862 744 Q858 754 848 752 L834 748 Q826 744 828 734 L836 698 Q822 696 812 690 Z" fill="#4f9a6a"/>
  <g fill="#d9c98a">
    <path d="M832 746 L830 764 L841 749 Z"/><path d="M842 750 L844 768 L853 752 Z"/><path d="M853 752 L858 768 L862 748 Z"/>
  </g>

  <rect y="820" width="1600" height="80" fill="#000" opacity=".28"/>
  <path d="M0 846 H1600" stroke="#e8eef0" stroke-opacity=".22" stroke-width="6"/>
</svg>
