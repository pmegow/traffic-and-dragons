<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Traffic and Dragons</title>
<meta name="description" content="A sword and sorcery RPG narrated by an AI Game Master. Play in your browser."/>
<meta property="og:title" content="Traffic and Dragons"/>
<meta property="og:description" content="A sword and sorcery RPG narrated by an AI Game Master. Play in your browser."/>
<meta property="og:url" content="https://trafficanddragons.com/"/>
<meta name="theme-color" content="#0c0d11"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<!--
  landing/index.html — the LANDING PAGE served at trafficanddragons.com (TODO #550, owner ask 2026-10-02:
  "just an image and a button"). One job: a short address to say out loud, which sends the visitor on to
  the game. It is its own tiny site — a second Cloudflare Pages project whose output directory is landing/ —
  so it loads no game file, touches no game storage and is not in the service worker's app shell.

  The picture ROTATES: one entry of ART per day. Adding a picture = dropping the file in landing/art/ and
  adding one entry to ART below. PLAY_URL is the one place the game's address lives.
-->
<style>
/* the game's palette: these tokens are index.html's :root values, so the landing page and the game read as one place */
:root{--font:Georgia,serif;--bg0:#0c0d11;--bg1:#13151c;--brd:#2c2f3a;--t0:#e4e8ee;--t1:#96a0ae;--acc:#9ab0c8;--on-acc:#000;--r:6px;--rl:10px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--t0);font-family:var(--font)}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}
h1{margin:0;font-size:clamp(20px,3.6vw,32px);color:var(--acc);letter-spacing:.06em;text-transform:uppercase;text-align:center;text-wrap:balance}
/* the frame takes each picture's own shape (ART carries its width and height), is never cropped, and is never
   taller than about 62% of the window, so the button stays on the first screen */
#art{margin:0;max-width:100%;border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;background:var(--bg1)}
#art img{display:block;width:auto;height:auto;max-width:min(1100px,100%);max-height:62vh}
/* the game's primary button (.btn-p), at landing-page size */
.play{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 44px;border-radius:var(--r);background:var(--acc);color:var(--on-acc);font-family:var(--font);font-size:clamp(18px,2.6vw,22px);font-weight:bold;text-decoration:none;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),inset 0 -2px 0 rgba(0,0,0,0.25);transition:opacity .15s}
.play:hover{opacity:.9}
.play:focus-visible{outline:3px solid var(--t0);outline-offset:3px}
.note{margin:0;font-size:13px;color:var(--t1)}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Welcome to Traffic and Dragons</h1>
  <figure id="art"><img id="art-img" src="art/dragon-on-beetle.webp" width="1200" height="896" alt="A green dragon rides on the roof of a yellow car full of adventurers, stuck in city traffic."/></figure>
  <a id="play" class="play" href="https://traffic-and-dragons.pages.dev/">Play / Sign In</a>
  <p id="art-note" class="note" hidden></p>
</main>
<script>
// Where the Play button goes — the one place the game's address lives.
var PLAY_URL="https://traffic-and-dragons.pages.dev/";
// The pictures, one per day in this order. A new picture is a new entry here plus its file in art/.
// w and h are the file's own pixel size: they give the frame its shape before the picture arrives.
var ART=[
  {src:"art/dragon-on-beetle.webp",w:1200,h:896,alt:"A green dragon rides on the roof of a yellow car full of adventurers, stuck in city traffic."}
];
// Pure: the picture for a given day number (days since 1970, UTC). Same day, same picture, for everyone.
function artForDay(list,dayNumber){
  if(!list||!list.length)return null;
  return list[((dayNumber%list.length)+list.length)%list.length];
}
(function(){
  var img=document.getElementById("art-img"),fig=document.getElementById("art"),note=document.getElementById("art-note");
  document.getElementById("play").href=PLAY_URL;
  function failed(){
    // No silent failure: say so on the page and in the console. The button still works.
    console.warn("landing: the picture did not load: "+img.getAttribute("src"));
    fig.hidden=true;note.hidden=false;note.textContent="The picture did not load.";
  }
  img.addEventListener("error",failed);
  var pick=artForDay(ART,Math.floor(Date.now()/86400000));
  if(!pick){failed();return;}
  img.alt=pick.alt;
  if(pick.w&&pick.h){img.setAttribute("width",pick.w);img.setAttribute("height",pick.h);}
  if(img.getAttribute("src")!==pick.src)img.setAttribute("src",pick.src);
  else if(img.complete&&!img.naturalWidth)failed();
})();
</script>
</body>
</html>
