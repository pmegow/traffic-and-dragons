<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Traffic and Dragons</title>
<meta name="description" content="A sword and sorcery RPG narrated by an AI Game Master. Play in your browser."/>
<meta property="og:title" content="Traffic and Dragons"/>
<meta property="og:description" content="A sword and sorcery RPG narrated by an AI Game Master. Play in your browser."/>
<meta property="og:url" content="https://trafficanddragons.com/"/>
<meta name="theme-color" content="#0c0d11"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<!--
  landing/index.html — the LANDING PAGE served at trafficanddragons.com (TODO #550, owner ask 2026-10-02:
  "just an image and a button"). One job: a short address to say out loud, which sends the visitor on to
  the game. It is its own tiny site — a second Cloudflare Pages project whose output directory is landing/ —
  so it loads no game file, touches no game storage and is not in the service worker's app shell.

  The picture ROTATES: one entry of ART per day. Adding a picture = dropping the file in landing/art/ and
  adding one entry to ART below. PLAY_URL is the one place the game's address lives.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0c0d11;color:#e4e8ee;font-family:Georgia,serif}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}
h1{margin:0;font-size:clamp(20px,4.2vw,34px);font-weight:normal;letter-spacing:.16em;text-transform:uppercase;text-align:center}
h1 span{color:#c8a84a}
/* the picture is 16:9 and never taller than about 60% of the window, so the button stays on the first screen */
#art{margin:0;width:100%;max-width:min(1100px,calc(60vh * 16 / 9));aspect-ratio:16/9;border:1px solid #2c2f3a;border-radius:10px;overflow:hidden;background:#13151c}
#art img{display:block;width:100%;height:100%;object-fit:cover}
.play{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 34px;border-radius:8px;background:#c8a84a;color:#000;font-size:clamp(18px,2.6vw,22px);font-weight:bold;text-decoration:none;text-align:center;transition:background .15s}
.play:hover{background:#dcbd60}
.play:focus-visible{outline:3px solid #e4e8ee;outline-offset:3px}
.note{margin:0;font-size:13px;color:#96a0ae}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Traffic <span>and</span> Dragons</h1>
  <figure id="art"><img id="art-img" src="art/dragon-in-traffic.svg" width="1600" height="900" alt="A dragon squeezed into a small car, stuck in evening traffic."/></figure>
  <a id="play" class="play" href="https://traffic-and-dragons.pages.dev/">Play Traffic and Dragons</a>
  <p id="art-note" class="note" hidden></p>
</main>
<script>
// Where the Play button goes — the one place the game's address lives.
var PLAY_URL="https://traffic-and-dragons.pages.dev/";
// The pictures, one per day in this order. A new picture is a new entry here plus its file in art/.
var ART=[
  {src:"art/dragon-in-traffic.svg",alt:"A dragon squeezed into a small car, stuck in evening traffic."}
];
// Pure: the picture for a given day number (days since 1970, UTC). Same day, same picture, for everyone.
function artForDay(list,dayNumber){
  if(!list||!list.length)return null;
  return list[((dayNumber%list.length)+list.length)%list.length];
}
(function(){
  var img=document.getElementById("art-img"),fig=document.getElementById("art"),note=document.getElementById("art-note");
  document.getElementById("play").href=PLAY_URL;
  function failed(){
    // No silent failure: say so on the page and in the console. The button still works.
    console.warn("landing: the picture did not load: "+img.getAttribute("src"));
    fig.hidden=true;note.hidden=false;note.textContent="The picture did not load.";
  }
  img.addEventListener("error",failed);
  var pick=artForDay(ART,Math.floor(Date.now()/86400000));
  if(!pick){failed();return;}
  img.alt=pick.alt;
  if(img.getAttribute("src")!==pick.src)img.setAttribute("src",pick.src);
  else if(img.complete&&!img.naturalWidth)failed();
})();
</script>
</body>
</html>
