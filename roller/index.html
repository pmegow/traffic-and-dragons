<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dice Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #2a2f3a;
    --text: #e6e2d8;
    --muted: #9a968c;
    --acc: #d9a441;
    --acc-ink: #1a1408;
    --bad: #e0705a;
    --adder-gap: 6px;   /* between the die buttons, and between them and the view below */
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 1fr auto auto; height: 100dvh; overflow: hidden; }   /* the tray, the grip, the panel (its own width) */
  /* The top inset, Traffic and Dragons' technique (its #658): on a Home Screen iPhone the page runs under
     the status bar, and since iOS 26.1 a glass blur reaches ~40pt below the bar that nothing switches off.
     So the layout starts 1.7 × the safe-area inset down (0 in a browser tab or on a desktop), clearing
     the clock and the meters (owner 2026-10-24: Reset view was hidden under them). Rules read
     --top-inset, never env() directly. */
  :root { --top-inset: calc(env(safe-area-inset-top, 0px) * 1.7); }
  /* The page itself never zooms (owner 2026-10-27: "the screen zooming in some how, then it becomes nigh impossible
     to UN-zoom since pinching just wants to zoom in and out of the playing surface"; 2026-10-25 had kept pinch and
     stopped only double-tap zoom). It scrolls; a pinch on the tray is the camera's (the stage's own none), and Safari's
     own pinch, which ignores the viewport, is stopped in demo/demo.js. */
  html { touch-action: pan-x pan-y; }
  body { padding-top: var(--top-inset); }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; display: flex; flex-direction: column; }
  #stage:active { cursor: grabbing; }
  #stage { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* Held still for a moment, a press pans the view: a ring round the hand says so (owner 2026-10-24; a pan since 2026-10-25). */
  #pan-ring { position: absolute; z-index: 2; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    border: 2px solid var(--acc); box-shadow: 0 0 0 1px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(0, 0, 0, .45);
    pointer-events: none; opacity: 0; transform: scale(.55); transition: opacity .12s ease-out, transform .12s ease-out; }
  #stage.panning #pan-ring { opacity: 1; transform: scale(1); }
  #stage.panning { cursor: grabbing; }
  #stage.holding #pan-ring { opacity: 1; transform: scale(1); }   /* the hand holding the dice (pick up and shake) */
  #stage.holding { cursor: grabbing; }
  #stage.zooming { cursor: ns-resize; }
  /* Shown once the view is panned or zoomed; eases the camera home. Bottom right, clear of the die
     buttons along the top (owner 2026-10-25). */
  #reset-view { position: absolute; z-index: 3; bottom: 12px; right: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(15, 17, 21, .78); color: var(--text); font: 13px system-ui, sans-serif; cursor: pointer; }
  #reset-view:hover { border-color: var(--acc); }
  /* No tray: the dice roll over the page itself — a soft backdrop here, so their shadows read. The view's, so the
     buttons above it sit on the page. */
  #stage[data-surface="none"] #view { background: radial-gradient(ellipse at 50% 42%, #3b4352 0%, #262c38 55%, #181b22 100%); }
  #panel { background: var(--panel); width: 300px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }   /* the bottom inset: an iPad on its side keeps a home indicator there */
  #panel.drawer-closed { display: none; }   /* closed: only the grip shows, the tray takes the rest */
  /* Rows keep their size and the panel scrolls: in a panel of fixed height (the phone drawer) a
     shrinking row drew its text over the next one (the roll summary over the die buttons). */
  #panel > * { flex-shrink: 0; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  /* The die buttons are the only way to choose the dice (owner 2026-10-25): a tap adds one, which drops onto the
     table, and the count shows on the button; a right-click (or, on a touch screen, a one-second press) takes one
     back off the table; Clear empties it (the minus was too small to hit on a phone). The panel's line shows the
     roll and its × clears it too. Every die type on one row: the 20 is not special. Inside the stage, whose
     touch-action is none, so tapping fast never zooms.
     They sit ABOVE the camera's view, never over it (owner 2026-10-26: a die was hidden under them): as high as the
     iPhone's glass allows — the stage starts at --top-inset, and the 7 px above the row is the count badge's
     overhang, which would be clipped or blurred otherwise — and the view starts one button gap below them, so the
     camera's frame, and with no tray the walls the dice bounce off, begin there. */
  #dice-bar { flex: none; position: relative; z-index: 3; display: flex; padding: 7px 10px var(--adder-gap); pointer-events: none; }
  #adders { flex-wrap: nowrap; flex: 1 1 auto; justify-content: center; gap: var(--adder-gap); pointer-events: auto; }
  /* The camera's view: the canvas fills it (render/view.js sizes to its container). */
  #view { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
  /* Two lines of text on the view, one type. The hint at the top, under the buttons (owner 2026-10-25); a press on
     it is a press on the table, so it says true. The roll along the bottom (owner 2026-10-26: "move the Die results
     out of the simulator panel, and onto the bottom of the image, similar to the 'tap to roll' in font and size. Put
     the total at the end"), wrapping upward, and clear of Reset view while it shows. */
  #table-hint, #roll-line { margin: 0; font-size: 12px; color: rgba(230, 226, 216, .78); text-shadow: 0 1px 2px rgba(0, 0, 0, .85); }
  #table-hint { position: absolute; z-index: 1; top: 2px; left: 0; right: 0; text-align: center; pointer-events: none; }
  #table-hint.said { top: 48px; margin: 0 16px; padding: 12px 16px; font-size: 15px; line-height: 1.45; color: #fff; background: rgba(20, 22, 28, .88); border: 1px solid var(--bad); border-radius: 10px; }   /* the start check's words: readable on a tablet */
  /* The loading notice (owner 2026-10-30: "add a 'Loading Dice Library...' pulsing while the dies load. Feels like a
     hang right now"): up from the first paint until the dice are first drawn. The pulse animates opacity alone, which
     the compositor keeps running while the page is blocked building the dice's GPU programs. The start check's own
     words (a slow or failed start) take its place. */
  #dice-loading { position: absolute; z-index: 2; top: 42%; left: 0; right: 0; margin: 0; text-align: center; font-size: 17px; letter-spacing: .04em; color: rgba(236, 232, 222, .95); text-shadow: 0 1px 3px rgba(0, 0, 0, .9); pointer-events: none; will-change: opacity; animation: dice-loading-pulse 1.2s ease-in-out infinite; }
  #dice-loading[hidden], #table-hint.said ~ #dice-loading { display: none; }
  @keyframes dice-loading-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #dice-loading { animation: none; } }
  #roll-line { position: absolute; z-index: 1; bottom: 6px; left: 12px; right: 12px; text-align: center; pointer-events: none; }
  #roll-line b { font-weight: 700; }   /* the total (owner 2026-10-26) */
  #stage:has(#reset-view:not([hidden])) #roll-line { right: 112px; }
  .add { position: relative; flex: 1 1 0; min-width: 0; max-width: 72px; min-height: 36px; padding: 8px 0; border: 1px solid var(--line); border-radius: 8px;
    background: rgba(15, 17, 21, .78); color: var(--text); font: inherit; cursor: pointer; }
  @media (pointer: coarse) { .add { min-height: 42px; } }
  .add:hover { border-color: var(--acc); }
  .add:disabled, .add.full { opacity: .45; cursor: default; }
  .add .count { position: absolute; top: -7px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--acc); color: var(--acc-ink); font: 700 11px/18px system-ui, sans-serif; text-align: center; pointer-events: none; }
  .add .count[hidden] { display: none; }
  #clear-all { color: var(--muted); font-size: 13px; }   /* the one word: fits a 320 px phone too */
  #roll:disabled { opacity: .5; cursor: default; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; padding: 0; accent-color: var(--acc); }
  label output { float: right; color: var(--text); font-variant-numeric: tabular-nums; }
  label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  label.check input { width: auto; }
  #sound-state { color: var(--muted); font-size: 12px; }
  #sound-state.why { color: var(--acc); }   /* sound was expected and is not on: the reason must be seen (2026-10-29) */
  input, select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f1218; color: var(--text); font: inherit; }
  /* iOS Safari zooms into a focused field whose text is under 16px, and stays zoomed — the fields sit
     in 12px labels and inherited it (owner 2026-10-24, on an iPhone: tapping × or Force results
     doubled the panel). On touch screens their text is 16px. */
  @media (pointer: coarse) { input, select, textarea { font-size: 16px; } }
  input:focus, select:focus { outline: 2px solid var(--acc); outline-offset: -1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .preset-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .ghost:disabled { opacity: .45; cursor: default; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; }
  input[type=color] { height: 36px; padding: 3px; cursor: pointer; }
  /* The colour picker (demo/color-picker.js, owner 2026-10-29): the native input hides behind a swatch that opens a
     panel of HSV and RGB sliders, each track painted in the colours it runs through. */

  .swatch { height: 36px; padding: 0; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }
  .swatch:hover, .swatch:focus-visible { outline: 2px solid var(--acc); outline-offset: -1px; }
  .swatch[aria-expanded=true] { box-shadow: 0 0 0 2px var(--acc) inset; }
  .color-panel { display: grid; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #0f1218; }
  .color-head { display: grid; grid-template-columns: 36px 1fr auto 26px; gap: 8px; align-items: center; }
  .color-big { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); }
  .color-hex { font: 600 14px ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; }
  .color-close { position: static; transform: none; }
  .color-mode { display: inline-grid; grid-auto-flow: column; width: max-content; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .color-mode button { padding: 6px 16px; border: 0; background: transparent; color: var(--muted); font: 600 12px system-ui, sans-serif; cursor: pointer; }
  .color-mode button[aria-pressed=true] { background: var(--acc); color: var(--acc-ink); }
  .color-mode button:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
  .color-sliders { display: grid; gap: 6px; }
  .color-sliders[hidden] { display: none; }   /* the display rule above would beat the attribute */
  .chan { grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .chan .chan-range { grid-column: 1 / -1; }
  .chan-range { -webkit-appearance: none; appearance: none; height: 16px; margin: 4px 0; padding: 0; border-radius: 8px; border: 1px solid rgba(0, 0, 0, .5);
    background: #333; accent-color: auto; cursor: pointer; }
  .chan-range::-webkit-slider-runnable-track { height: 16px; background: transparent; border-radius: 8px; }
  .chan-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -4px; border-radius: 50%;
    background: #fff; border: 2px solid #0f1218; box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 1px 3px rgba(0, 0, 0, .6); }
  .chan-range::-moz-range-track { height: 16px; background: transparent; border-radius: 8px; }
  .chan-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #0f1218;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 1px 3px rgba(0, 0, 0, .6); }
  .chan-range:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .field { position: relative; display: block; }
  .field input { padding-right: 36px; }
  .clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); font: 18px/26px system-ui, sans-serif; cursor: pointer; }
  .clear:hover, .clear:focus-visible { color: var(--text); background: #262b36; }
  .field input:placeholder-shown + .clear { visibility: hidden; }   /* nothing to clear */
  #roll { padding: 12px; border: 0; border-radius: 10px; background: var(--acc); color: var(--acc-ink); font: 600 16px system-ui, sans-serif; cursor: pointer; }
  .ghost { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer; }
  #meta { color: var(--muted); font-size: 12px; }
  #meta:empty { display: none; }
  #status { font-size: 13px; color: var(--bad); white-space: pre-wrap; }
  #status:empty { display: none; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  /* THE GRIP (demo/drawer.js), like Traffic and Dragons' side-panel grip, between the tray and the panel: on a wide
     screen a vertical bar that drags the panel's width (owner 2026-10-29: "the drawer grip is missing when the drawer
     is arranged vertically"), on the drawer layout the bar across the drawer's top that drags its height. Drag to
     resize, double tap to close or reopen, arrow keys step it. */
  #drawer-grab { display: flex; width: 14px; padding: 0; border: 0; border-left: 1px solid var(--line); background: var(--panel); cursor: col-resize; touch-action: none; }
  #drawer-grab::after { content: ''; margin: auto; width: 5px; height: 36px; border-radius: 3px; background: #777; pointer-events: none; }
  #drawer-grab:focus-visible { outline: 1px solid var(--acc); outline-offset: -1px; }
  /* THE DRAWER LAYOUT: a phone, or a tablet held upright (owner 2026-10-29, the iPad: beside a 300 px panel the
     tray had 468 px of a 768 px screen). The tray takes the width; the options are a drawer under it. The same
     query is in demo/demo.js (`narrow`) — change both. A tablet on its side keeps the panel beside the tray. */

    #drawer-grab { width: auto; height: 24px; border-left: 0; border-top: 1px solid var(--line); cursor: row-resize; }   /* the bar across the drawer's top */
    #drawer-grab::after { width: 36px; height: 5px; }
    body { grid-template-columns: 1fr; grid-template-rows: 1fr auto auto; }   /* the tray, the grip, the drawer */
    #panel { width: auto; max-height: 46dvh; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); gap: 10px; }
    #panel h1 { order: -3; }
    #roll { order: -2; }          /* on a phone the panel scrolls: keep Roll and the result in reach */

    #result { order: -1; }

     its bottom edge (owner 2026-10-29), so Roll and the result lead there too, and the rest scrolls under them. */
  @media (min-width: 761px) and (max-height: 820px) {
    #panel h1 { order: -3; }
    #roll { order: -2; }
    #status { order: -1; }
    #result { order: -1; }
  }
</style>

<body>
<main id="stage" aria-label="Dice tray: drag a die to toss it, double-click a die to roll it again or the table to roll them all, drag fast across the table to fling the dice, hold then drag to pan the view, pinch, scroll or right-drag to zoom"><div id="pan-ring" aria-hidden="true"></div><div id="dice-bar"><div class="row" id="adders" aria-label="Choose the dice"></div></div><div id="view"><p id="table-hint">Drag a die to toss it · double-click a die to roll it again, the table to roll them all</p><p id="dice-loading" role="status">Loading Dice Library...</p><p id="roll-line" aria-live="polite"></p></div><button id="reset-view" type="button" hidden>Reset view</button></main>
<button id="drawer-grab" type="button" role="separator" aria-orientation="vertical" aria-label="Resize the options panel" aria-valuemin="24" title="Drag to resize; double tap to close or reopen; arrow keys also resize"></button>
<aside id="panel">
  <h1>Dice Simulator <small id="version">v0.79.0</small></h1>   <!-- stamped by dev/write-sw.js from src/version.js -->
  <label>Force results, in order <span class="field"><input id="forced" placeholder="blank = honest roll, e.g. 20, 3" autocomplete="off"><button class="clear" id="clear-forced" type="button" aria-label="Clear the forced results" title="Clear">×</button></span></label>
  <div class="preset-row">
    <label>Preset <select id="preset"></select></label>
    <button class="ghost" id="preset-delete" type="button" disabled title="Delete this saved preset">Delete</button>
  </div>

    <input id="preset-name" placeholder="Name this look" maxlength="40" autocomplete="off" spellcheck="false" aria-label="Preset name">
    <button class="ghost" id="preset-save" type="button">Save preset</button>
  </div>
  <div class="three">
    <label>Body <input id="body-color" type="color" value="#8a49a2"></label>
    <label>Numbers <input id="ink-color" type="color" value="#ffffff"></label>
    <label>Finish <select id="finish"></select></label>
  </div>
  <label>Numbers font <select id="font"></select></label>
  <label>Exit animation <select id="exit"></select></label>
  <div class="two">
    <label>Seed <input id="seed" placeholder="random" inputmode="numeric" autocomplete="off"></label>
    <label>Surface <select id="surface"></select></label>
  </div>
  <label>Speed <output id="speed-out">1.00×</output><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></label>
  <label>Tray size <output id="tray-out">0.50×</output><input id="tray" type="range" min="0.35" max="1.5" step="0.05" value="0.5"></label>
  <div class="two">
    <label class="check"><input id="sound" type="checkbox" checked> Sound</label>
    <button class="ghost" id="replay" type="button">Replay last</button>
  </div>
  <button id="roll" type="button">Roll</button>
  <div id="status" role="alert"></div>
  <div id="result">
    <div id="meta"></div>
  </div>
  <p class="hint">Drag across the tray to throw. Hold, then drag, to pan the view; pinch, scroll the wheel or right-drag to zoom. Space rolls. <span id="sound-state"></span></p>
</aside>
<script>
// THE START CHECK — a classic ES5 script, so it runs where the app's modules cannot (owner 2026-10-29: an iPad
// opened the page to empty menus and no version, in Safari and in Chrome — the same engine on an iPad — and nothing
// said why). The app needs Safari 16.4 (iPadOS 16.4, March 2023), Chrome 94 or Firefox 108 or newer: the import map
// above, and three.js r186's class static blocks. An older browser fails the whole module graph before a line of it
// runs, and says so only on a console a tablet has not got. So this script says, on the status line and over the

// nothing has started yet, with the seconds. demo/demo.js marks the start done (data-dice-started on <html>); after
// that this script paints nothing and clears its own words. It never paints over another's line (DiceView's

    var on = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'an iPad' : /iPhone/.test(ua) ? 'an iPhone' : /Android/.test(ua) ? 'Android' : /Macintosh/.test(ua) ? 'a Mac' : /Windows/.test(ua) ? 'Windows' : '';

  function tell(words) { if (!started() && (!status || !status.textContent || status.textContent === own)) say(words); }
  function fail(words) { failed = true; tell(words); }
  var version = document.getElementById('version'), tail = ' · ' + browser() + (version ? ' · dice ' + version.textContent : '');
  if (!supported()) {
    say('This browser is too old for the dice: they need ' + FLOOR + '. This is ' + browser() + '. Update it (an iPad: Settings \u25B8 General \u25B8 Software Update), or use a newer device.' + (version ? ' \u00B7 dice ' + version.textContent : ''));
    return;

    if (e.target && e.target !== window && e.target.tagName) {   // a file that did not load (capture reaches it)
      fail('A file of the dice did not load: ' + String(e.target.src || e.target.href || e.target.tagName).replace(/^.*\//, '') + ' (offline, or the wrong file came).' + tail);
      return;
    }
    var where = e.filename ? ' (' + String(e.filename).replace(/^.*\//, '') + (e.lineno ? ':' + e.lineno : '') + ')' : '';
    fail('The dice could not start: ' + (e.message || 'error') + where + tail);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    fail('The dice could not start: ' + (r && r.message ? r.message : String(r)) + tail);
  });
  var seconds = 0, timer = setInterval(function () {
    seconds++;
    if (started()) { clearInterval(timer); if (own) say(''); return; }
    if (failed) { clearInterval(timer); return; }   // a failure is told: the count would paint over it
    if (status && status.textContent && status.textContent !== own) { clearInterval(timer); return; }   // another's line: leave it
    if (seconds >= 4) tell(seconds < 30 ? 'Starting the dice\u2026 ' + seconds + 's' + tail : 'The dice did not start, and nothing said why (' + seconds + 's).' + tail + ' Reload; if this stays, report these words.');
  }, 1000);
})();
</script>
