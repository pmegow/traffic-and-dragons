<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sketch + Glass — Dice Prototype</title>
<link rel="icon" href="../icons/icon-192.png">
<style>
:root { color-scheme: dark; font: 15px system-ui,sans-serif; color:#e9e5dc; background:#12151c; }
* { box-sizing:border-box; } body { margin:0; height:100dvh; display:flex; flex-direction:column; }
header { padding:14px 20px 8px; } h1 { margin:0 0 5px; font-size:21px; } small,p { color:#bcb7ab; }
p { margin:5px 0; } a { color:#dfb451; } #view { flex:1; min-height:230px; position:relative; touch-action:none; background:radial-gradient(ellipse at center,#303744,#101318); }
#controls { padding:12px 20px max(12px,env(safe-area-inset-bottom)); background:#191d25; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:10px; }
label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:#bcb7ab; }
button,select { font:inherit; padding:9px 12px; border-radius:6px; border:1px solid #404653; background:#10131a; color:#e9e5dc; }
button { cursor:pointer; } button:disabled { opacity:.45; cursor:wait; } #roll { background:#dba63a; color:#161616; font-weight:650; }
input[type=color] { width:56px; height:37px; padding:2px; border:1px solid #404653; background:#10131a; }
#status { min-height:1.5em; margin:0; } .error { color:#ff8060; }
@media(max-width:520px) { header,#controls { padding-left:12px; padding-right:12px; } h1{font-size:18px} .row{gap:7px} button,select{padding:8px} header p {font-size:12px} }
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
</head>
<body>
<header><h1>Sketch + Glass <small id="version"></small></h1>
<p>Compare the same mixed set and exit animation. Drag the table to orbit; scroll to zoom.</p>
<p><a id="compare" href="?surface">Compare with surface hatching</a> · <a href="../?sketchPost">Open the full roller prototype</a></p></header>
<main id="view" aria-label="Mixed dice preview"></main>
<section id="controls" aria-label="Prototype controls">
<div class="row"><button id="roll" disabled>Roll Mixed Set</button><label>Exit Animation<select id="exit"></select></label><button id="clear" disabled>Play Exit</button></div>
<div class="row"><label>Add a d20<select id="add-look"><option value="0">Sketch</option><option value="1">Glass</option><option value="2">Ink Sketch</option></select></label><button id="add" disabled>Drop d20</button><label>Paper<input id="paper" disabled type="color" value="#eee3c9"></label><label>Ink<input id="ink" disabled type="color" value="#302c24"></label></div>
<p id="status" role="status" aria-live="polite">Preparing the preview…</p>
<p><small id="mode">Post-process prototype: ordinary tabletop shadows; no saved settings are changed.</small></p>
</section>
<script type="module" src="sketch-lab.js"></script>
</body></html>
