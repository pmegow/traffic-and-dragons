<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bible Editor — bible authoring (dev tool)</title>
<!-- ─── BIBLE EDITOR (TODO #72) ────────────────────────────────────────────────────────────────
  The DEV-ONLY authoring surface for the *_bible files. Deliberately separate from
  bible_study.html (user call 2026-07-27): bible_study stays the read-only viewer because the
  bibles may become PLAYER-FACING, and players must never find a mutable surface there.

  v2 (2026-07-28, user call): OPEN a bible from disk and SAVE BACK OVER IT. The v1 download-only
  flow dropped exports in ~/Downloads, so a fill session ended with a manual file move — friction
  that scales badly across 234 slots and 175 capability entries. The File System Access API gives
  a real handle (verified working from file:// in Chromium), so Save overwrites the original in
  its own directory, behind a confirm. Download stays as the fallback for browsers without FSA.

  BIBLE TYPES ARE A REGISTRY (BIBLE_TYPES), not a set of branches: detect / parse / serialize /
  render per type. Adding the item bible later is ONE ENTRY, not new conditionals — the standing
  abstraction rule. Two types ship: class_bible (machine-regenerated wholesale) and
  capability_bible (HAND-COMMENTED: untouched entries are re-emitted VERBATIM so a save produces a
  minimal diff and every authored comment survives).

  The serializers between the ASCII markers are THE canonical writers. The BIBLE EDITOR CONTRACT
  (dev/run-tests.js) evals that slice and byte-compares serializeClassBible() for the pristine
  on-disk data against class_bible.js, so page and file can never silently disagree.

  Work-in-progress persists to localStorage (tnd_bible_editor_draft_v1) so a closed tab loses
  nothing; the v1 draft shape is migrated on load, never discarded.
──────────────────────────────────────────────────────────────────────────────────────────── -->
<style>
:root{--bg:#111;--bg2:#181818;--bg3:#1f1f1f;--t0:#ddd;--t1:#aaa;--t2:#777;--acc:#b8935a;--good:#7aa86a;--pend:#5a8ab8;--bad:#b85a5a;--brd:#2a2a2a;}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--t0);font:14px/1.5 Georgia,serif;margin:0;}
#bar{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#bar h1{font-size:16px;color:var(--acc);margin:0 10px 0 0;}
button{font-family:Georgia,serif;font-size:13px;background:var(--bg3);color:var(--t0);border:1px solid #444;border-radius:6px;padding:6px 12px;cursor:pointer;}
button:hover{border-color:var(--acc);}
button.primary{border-color:var(--acc);color:var(--acc);}
button:disabled{opacity:.4;cursor:default;border-color:#333;}
#tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;}
#tabs button.on{border-color:var(--acc);color:var(--acc);background:#221c12;}
main{max-width:1080px;margin:0 auto;padding:14px 16px 90px;}
h2{color:var(--acc);font-size:17px;margin:26px 0 8px;border-bottom:1px solid var(--brd);padding-bottom:4px;}
h3{color:var(--t1);font-size:14px;margin:18px 0 6px;letter-spacing:.5px;}
input[type=text],input[type=number],input[type=search],textarea,select{background:var(--bg3);color:var(--t0);border:1px solid #3a3a3a;border-radius:5px;padding:5px 8px;font:13px Georgia,serif;}
input:focus,textarea:focus{outline:none;border-color:var(--acc);}
textarea{width:100%;resize:vertical;}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap;}
.lbl{width:96px;color:var(--t1);font-size:12.5px;flex-shrink:0;}
.feat{display:flex;gap:6px;margin:3px 0;align-items:center;}
.feat input.nm{width:220px;}
.feat input.ds{flex:1;min-width:200px;}
.badge{width:14px;text-align:center;cursor:pointer;font-size:13px;flex-shrink:0;}
.badge.ok{color:var(--good);cursor:default;}
.badge.pend{color:var(--pend);}
.badge.miss{color:var(--t2);}
.x{color:var(--bad);cursor:pointer;border:none;background:none;font-size:14px;padding:0 4px;}
.lvl{border:1px solid var(--brd);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--bg2);}

.lvl.blank{border-style:dashed;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid #3a3a3a;border-radius:12px;padding:2px 4px 2px 10px;margin:2px;font-size:12.5px;}
.arch{border:1px solid var(--brd);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--bg2);}
.arch h4{margin:0 0 6px;color:var(--t0);font-size:15px;}

.role{color:var(--acc);font-size:11.5px;letter-spacing:.3px;opacity:.85;}

.cap.edited{border-color:var(--acc);}

<script src="data.js"></script>

<body>
<div id="bar">
  <h1>Bible Editor <span class="muted">dev tool</span></h1>
  <button class="primary" id="open">📂 Open bible…</button>

  <button id="exp-adds">⬇ Capability additions (<span id="addn">0</span>)</button>

<script>
// >>> BIBLE SERIALIZER
// THE canonical writers. The BIBLE EDITOR CONTRACT (dev/run-tests.js) evals this slice and
// byte-compares serializeClassBible(<on-disk data>) against the on-disk file — header included —
// so editor and file can never silently disagree about the format.
function serializeClassBible(bible, xp) {
  var header = [
    "// ─── CLASS BIBLE (TODO #72) ─────────────────────────────────────────────────────────────────",
    "// THE single definitive source for character progression: classes, per-level features,",
    "// archetype spines (L3 identity / 6 / 10 / 14 / 18 / L20 capstone), spell tier lists, skill",
    "// seeds, and the 1-20 XP curve. Spec: DOC/DOC_class_bible.html (R2 — all forks ruled",
    "// 2026-07-27: picks at tier-unlock levels; table extended to L20; creation-only skill seeds).",
    "//",
    "// ⚠ NOT WIRED INTO THE ENGINE YET. Until the C6 sequence lands (classDef() lookup → store",
    "// swap → CLSS deleted), the game still reads CLSS/CLASS_FEATURES/ABILS/ARCHETYPES/ARCH_SPELLS/",
    "// STAT_PRIORITY/SPELLS. This file is loaded by the satellites (bible_editor.html) and the",
    "// engine-test harness only. Divergence from the legacy tables during the fill phase is",
    "// EXPECTED (this file runs ahead); the legacy tables remain engine truth until C6-②.",
    "//",
    "// FORMAT RULES (the editor depends on them):",
    "//  · The data between the >>> <<< markers is machine-REGENERATED by bible_editor.html's",
    "//    exporter — no hand comments inside the markers (they would be lost on export).",
    "//  · Serialization is canonical: JSON.stringify(obj, null, 2). The BIBLE EDITOR CONTRACT",
    "//    (dev/run-tests.js) byte-compares a fresh serialize against this region, so a hand edit",
    "//    that breaks canonical form fails the build instead of silently fighting the editor.",
    "//  · Feature shape {nm, ds}: nm is the capability_bible key once the feature is authored",
    "//    there (the racial_caps pattern — mechanics live in ONE place); ds is legacy/summary",
    "//    prose. Empty features arrays are FILL-PHASE blanks, not errors.",
    "//  · spellTiers maps tier → unlock level (C2). Empty spell-tier arrays are fill-phase",
    "//    blanks. Half-caster (Ranger/Paladin) tiers are DRAFT pending the fill phase.",
    "//  · CLASS_XP_LEVELS 1-10 = the shipped XP_LEVELS verbatim; 11-20 = spec R2 draft numbers.",
    ""
  ].join("\n");
  return header +
    "// >>> CLASS BIBLE DATA\n" +
    "var CLASS_XP_LEVELS = " + JSON.stringify(xp) + ";\n" +
    "var CLASS_BIBLE = " + JSON.stringify(bible, null, 2) + ";\n" +
    "// <<< CLASS BIBLE DATA\n";
}
// capability_bible.js is HAND-COMMENTED and must never be regenerated wholesale. Everything
// outside the data block is carried verbatim, every comment line inside it is preserved in place,
// and an entry the user did not touch is re-emitted as its ORIGINAL SOURCE LINE. A save therefore
// produces a diff containing only what actually changed.
function serializeCapabilityBible(state) {
  var CAP_ORDER = ["kind","tier","cost","isMagical","category","range","targets","duration","save","dice","effect"];
  function emit(key, o) {
    var parts = [];
    for (var i = 0; i < CAP_ORDER.length; i++) {
      var k = CAP_ORDER[i];
      if (o[k] === undefined) continue;
      parts.push(k + ":" + JSON.stringify(o[k]));
    }
    return "  " + JSON.stringify(key) + ":{" + parts.join(",") + "}";
  }
  var out = [], i, e;
  for (i = 0; i < state.entries.length; i++) {
    e = state.entries[i];
    if (e.lead && e.lead.length) out = out.concat(e.lead);
    var body = e.dirty ? emit(e.key, e.obj) : e.line.replace(/,\s*$/, "");
    out.push(body + (i === state.entries.length - 1 ? "" : ","));
  }
  return state.prefix + out.join("\n") + state.suffix;
}
// <<< BIBLE SERIALIZER

(function () {
  var DRAFT_K = "tnd_bible_editor_draft_v1";
  var FS_IDB = "tnd_bible_fs_v1", FS_STORE = "handles", FS_KEY = "bibleFile";
  var CUR = null;        // {typeId, data, handle, name, dirty}
  var ADD = {}, activeCls = null, capFilter = "";
  var _pendingHandle = null;   // restored but not yet re-permissioned (the #30 pattern)
  var _lastHandle = null;      // last bible handle seen, permissioned or not — the picker's startIn seed

  function $(id) { return document.getElementById(id); }
  function esc(s) { return escHtml(String(s == null ? "" : s)); }
  function deep(o) { return JSON.parse(JSON.stringify(o)); }

  // ── bible type REGISTRY — adding the item bible later is one entry ────────
  var BIBLE_TYPES = {
    "class": {
      label: "Class bible",
      detect: function (src) { return /var\s+CLASS_BIBLE\s*=/.test(src); },
      parse: function (src) {
        var v = new Function(src + "\nreturn {b:CLASS_BIBLE,x:CLASS_XP_LEVELS};")();
        return { bible: v.b, xp: v.x };
      },
      serialize: function (d) { return serializeClassBible(d.bible, d.xp); },
      fromGlobals: function () { return { bible: deep(CLASS_BIBLE), xp: CLASS_XP_LEVELS.slice() }; },
      render: renderClass, tabs: classTabs
    },
    "capability": {
      label: "Capability bible",
      detect: function (src) { return /var\s+CAPABILITY_BIBLE\s*=/.test(src); },
      parse: function (src) {
        var norm = src.replace(/\r\n/g, "\n"), lines = norm.split("\n"), i;
        var start = -1, end = -1;
        for (i = 0; i < lines.length; i++) if (/^var\s+CAPABILITY_BIBLE\s*=\s*\{/.test(lines[i])) { start = i; break; }
        for (i = start + 1; i < lines.length; i++) if (/^\};/.test(lines[i])) { end = i; break; }
        if (start < 0 || end < 0) throw new Error("could not find the CAPABILITY_BIBLE data block");
        var vals = new Function(norm + "\nreturn CAPABILITY_BIBLE;")();
        var entries = [], lead = [];
        for (i = start + 1; i < end; i++) {
          var l = lines[i], m = l.match(/^\s*"([^"]+)"\s*:\s*\{/);
          if (m) { entries.push({ key: m[1], line: l, obj: vals[m[1]], lead: lead, dirty: false }); lead = []; }
          else lead.push(l);
        }
        return { prefix: lines.slice(0, start + 1).join("\n") + "\n", suffix: "\n" + lines.slice(end).join("\n"), entries: entries, trailing: lead };
      },
      serialize: function (d) { return serializeCapabilityBible(d); },
      fromGlobals: null,   // capability_bible must be OPENED — it is never rebuilt from globals
      render: renderCap, tabs: function () { $("tabs").innerHTML = ""; }
    }
  };
  function typeOf(src) {
    for (var k in BIBLE_TYPES) if (BIBLE_TYPES[k].detect(src)) return k;
    return null;
  }

  // ── File System Access: open a handle, write back over it ─────────────────
  function _idbOpen() {
    return new Promise(function (res, rej) {
      if (typeof indexedDB === "undefined") { rej(new Error("no indexedDB")); return; }
      var rq = indexedDB.open(FS_IDB, 1);
      rq.onupgradeneeded = function () { var db = rq.result; if (!db.objectStoreNames.contains(FS_STORE)) db.createObjectStore(FS_STORE); };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error || new Error("indexedDB open failed")); };
    });
  }
  function _idbPut(k, v) { return _idbOpen().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction(FS_STORE, "readwrite"); tx.objectStore(FS_STORE).put(v, k); tx.oncomplete = function () { res(true); }; tx.onerror = function () { rej(tx.error); }; }); }); }
  function _idbGet(k) { return _idbOpen().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction(FS_STORE, "readonly"); var rq = tx.objectStore(FS_STORE).get(k); rq.onsuccess = function () { res(rq.result || null); }; rq.onerror = function () { rej(rq.error); }; }); }); }

  var HAS_FSA = (typeof window.showOpenFilePicker === "function");

  // ── display-name normalization, applied ON SAVE (user call 2026-07-28) ────
  // House style is title case with minor words lowercase mid-name — the convention the existing
  // content already follows ("Circle of the Land", "Lay on Hands", "Speak with Animals"). Applied
  // to class_bible DISPLAY names only; capability KEYS are lowercase by design (capBaseName
  // lowercases), which also means a capitalization fix can never break resolution.
  // Deliberately NOT silent: every rename is listed back, because this rewrites authored text.
  var TITLE_MINOR = { of: 1, "in": 1, the: 1, a: 1, an: 1, to: 1, and: 1, or: 1, "for": 1, "with": 1, at: 1, by: 1, from: 1, on: 1, into: 1 };
  function titleCaseName(s) {
    var i = String(s).indexOf("("), base = (i < 0 ? s : s.slice(0, i)).replace(/\s+$/, ""), tail = (i < 0 ? "" : " " + s.slice(i));
    var w = base.split(/\s+/);
    return w.map(function (x, k) {
      if (/[0-9]/.test(x)) return x;                  // 2d8, 30ft — never touch
      if (/[A-Z]/.test(x.slice(1))) return x;         // McX / already-deliberate caps — never touch
      var lo = x.toLowerCase();
      if (k > 0 && k < w.length - 1 && TITLE_MINOR[lo]) return lo;
      return lo.charAt(0).toUpperCase() + lo.slice(1);
    }).join(" ") + tail;
  }
  function normalizeClassNames(bible) {
    var changed = [];
    function fix(o, key, where) {
      var t = titleCaseName(o[key]);
      if (t !== o[key]) { changed.push(where + ": " + o[key] + " → " + t); o[key] = t; }
    }
    Object.keys(bible).forEach(function (c) {
      var e = bible[c];
      e.abilities.forEach(function (a) { fix(a, "nm", c); });
      Object.keys(e.levels).forEach(function (l) { e.levels[l].features.forEach(function (f) { fix(f, "nm", c + " L" + l); }); });
      if (e.spells) Object.keys(e.spells).forEach(function (t) {
        e.spells[t] = e.spells[t].map(function (s) { var n = titleCaseName(s); if (n !== s) changed.push(c + " T" + t + ": " + s + " → " + n); return n; });
      });
      e.archetypes.forEach(function (a) {
        Object.keys(a.levels).forEach(function (l) { a.levels[l].features.forEach(function (f) { fix(f, "nm", c + "/" + a.id + " L" + l); }); });
        if (a.spells) Object.keys(a.spells).forEach(function (t) {
          a.spells[t] = a.spells[t].map(function (s) { var n = titleCaseName(s); if (n !== s) changed.push(c + "/" + a.id + " T" + t + ": " + s + " → " + n); return n; });
        });
      });
    });
    return changed;
  }
  // Called by both save paths. Returns false only if the user cancels after seeing the renames.
  function applyNameNormalization() {
    if (!CUR || CUR.typeId !== "class") return true;
    var changed = normalizeClassNames(CUR.data.bible);
    if (!changed.length) return true;
    var msg = "Normalized " + changed.length + " display name" + (changed.length === 1 ? "" : "s") + " to house title case:\n\n" +
      changed.slice(0, 12).join("\n") + (changed.length > 12 ? "\n…and " + (changed.length - 12) + " more" : "") +
      "\n\nSave with these applied?";
    if (!confirm(msg)) return false;
    note(changed.length + " name(s) normalized");
    render();
    return true;
  }

  function loadFromText(src, handle, name, mtime) {
    var t = typeOf(src);
    if (!t) throw new Error("not a recognised bible — expected CLASS_BIBLE or CAPABILITY_BIBLE");
    var data = BIBLE_TYPES[t].parse(src);
    // mtime is what makes a disk change DETECTABLE before the write instead of after it fails.
    CUR = { typeId: t, data: data, handle: handle || null, name: name || "(unsaved)", dirty: false, loadedMtime: mtime || 0 };
    activeCls = (t === "class") ? Object.keys(data.bible)[0] : null;
    capFilter = "";
    render();
  }

  // The picker should open where the bibles LIVE, not in Downloads (user call 2026-07-28). Two
  // mechanisms, because neither alone covers a cold start:
  //   · id     — Chrome persists the last-used directory PER PICKER ID, so once a bible has been
  //              opened from the project folder every later open starts there, across sessions.
  //   · startIn— seeded with the last bible handle we hold (a FILE handle opens its containing
  //              directory), which covers the case where the id memory is cleared but IndexedDB
  //              still has the handle. Falls back to "documents", since the project lives under
  //              it — closer than the browser's default, which is Downloads.
  // A stale/revoked handle in startIn can make the picker throw, so the call retries once WITHOUT
  // it rather than leaving the button dead.
  function pickerOpts(withStart) {
    var o = { id: "tnd-bible", types: [{ description: "Bible source", accept: { "text/javascript": [".js"] } }], multiple: false };
    if (withStart) o.startIn = _lastHandle || "documents";
    return o;
  }
  function openBible() {
    // Opening REPLACES what is in the tab with the file's contents. Without this guard a dirty
    // draft died silently — the same silent-data-loss class the reconnect path already guards.
    if (CUR && CUR.dirty && !confirm("Open a bible file?\n\nThis tab has UNSAVED EDITS, and opening replaces them with the file's contents.\n\nCancel, then ⬇ Download copy first if you want to keep them.")) return;
    if (!HAS_FSA) { $("file-input").click(); return; }
    window.showOpenFilePicker(pickerOpts(true))["catch"](function (e) {
      if (e && e.name === "AbortError") throw e;                 // user cancelled — not a retry case
      console.warn("[bible] picker rejected the startIn hint, retrying without it:", e && e.message);
      return window.showOpenFilePicker(pickerOpts(false));
    }).then(function (hs) {
      var h = hs[0];
      _lastHandle = h;                                          // seeds the next picker's startIn
      return h.getFile().then(function (f) {
        var mt = f.lastModified;
        return f.text().then(function (txt) {
          loadFromText(txt, h, h.name, mt);
          _idbPut(FS_KEY, h)["catch"](function (e) { console.warn("[bible] handle not persisted:", e && e.message); });
          note("opened " + h.name);
        });
      });
    })["catch"](function (e) {
      if (e && e.name === "AbortError") return;      // user cancelled the picker — not an error
      alert("Could not open that file: " + (e && e.message));
    });
  }

  // >>> SAVE STALENESS
  // Did the file move under us since this tab read it? Compared with !== rather than > ON PURPOSE:
  // "newer" is the common case (a commit, another session), but a sync client or a git checkout can
  // restore an OLDER timestamp, and that is still not the file we read — > would sail past it and
  // clobber. mtime 0 means we never observed one (a draft restored from localStorage), and an
  // unknown baseline must not raise a scary prompt it cannot justify.
  function diskChangedSinceLoad(loadedMtime, diskMtime) {
    if (!loadedMtime) return false;
    return diskMtime !== loadedMtime;
  }
  // <<< SAVE STALENESS
  function saveBible() {
    if (!CUR) return;
    if (!applyNameNormalization()) return;      // capitalization fixed on save, never silently
    var ser = BIBLE_TYPES[CUR.typeId].serialize(CUR.data);
    if (!CUR.handle) { downloadCopy(); return; }
    var warn = "Overwrite " + CUR.name + " in place?\n\nThis REPLACES the file on disk. It is a tracked file — `git diff` shows exactly what changed and `git checkout` undoes it.";
    if (CUR.typeId === "capability") warn += "\n\nUntouched entries and all comments are preserved verbatim; only entries you edited are rewritten.";
    if (!confirm(warn)) return;
    // Read the file FIRST, always. Two jobs: (1) detect a disk change before the write so we can
    // explain it and offer a choice, instead of letting createWritable throw an opaque
    // InvalidStateError after the fact; (2) the read itself refreshes the handle's cached
    // snapshot, which is what the browser was rejecting. Without this, a file rewritten by a git
    // operation or an editor commit leaves the handle permanently unable to save — the state the
    // user hit repeatedly on 2026-07-28 while this session kept committing class_bible.js.
    CUR.handle.getFile().then(function (f) {
      if (diskChangedSinceLoad(CUR.loadedMtime, f.lastModified)) {
        var when = new Date(f.lastModified).toLocaleTimeString();
        if (!confirm(CUR.name + " CHANGED ON DISK at " + when + ", after this tab read it.\n\n" +
          "Something else wrote it — a git operation, another session, or a code change.\n\n" +
          "OK  = overwrite the disk file with YOUR version (it is tracked; `git diff` shows what you replaced)\n" +
          "Cancel = keep the disk file, and use ↻ Reload from disk to pick it up")) {
          throw { __userCancelled: true };
        }
      }
      return CUR.handle.createWritable();
    }).then(function (w) {
      return w.write(ser).then(function () { return w.close(); });
    }).then(function () {

    for (i = 0; i < bs.length; i++) bs[i].onclick = function () { activeCls = this.getAttribute("data-cls"); render(); };
  }
  function featRow(f, path) {
    return "<div class='feat'>" + badgeFor(f.nm) +
      "<input class='nm' type='text' value='" + esc(f.nm) + "' data-p='" + path + "' data-f='nm' placeholder='Feature name'>" +
      "<input class='ds' type='text' value='" + esc(f.ds) + "' data-p='" + path + "' data-f='ds' placeholder='summary prose'>" +
      "<button class='x' data-del='" + path + "' title='remove'>✕</button></div>";
  }
  function levelBlock(levels, base, label, rubric) {
    var h = "", ks = Object.keys(levels).sort(function (a, b) { return a - b; });
    ks.forEach(function (lv) {
      var fs = levels[lv].features, path = base + "." + lv;
      h += "<div class='lvl" + (fs.length ? "" : " blank") + "'><span class='lv'>L" + lv + "</span>" +
        (rubric && ARCH_ROLE[lv] ? "<span class='role'>" + esc(ARCH_ROLE[lv]) + "</span><br>" : "") +
        (fs.length ? "" : "<span class='muted'>blank — fill phase</span>");
      fs.forEach(function (f, i) { h += featRow(f, path + "." + i); });
      h += "<div><button data-add='" + path + "'>+ feature</button></div></div>";
    });
    return "<h3>" + label + "</h3>" + h;
  }
  function chipList(arr, path, resolvable) {
    var h = "";
    arr.forEach(function (nm, i) {
      h += "<span class='chip'>" + (resolvable ? badgeFor(nm) : "") + esc(nm) + "<button class='x' data-chipdel='" + path + "." + i + "'>✕</button></span>";
    });
    h += "<input type='text' style='width:170px' placeholder='+ add, then Enter' data-chipadd='" + path + "'>";
    return h;
  }
  function renderClass() {
    if (activeCls === "__xp") { renderXp(); return; }
    var e = CUR.data.bible[activeCls];
    if (!e) { $("main").innerHTML = "<p class='muted'>Pick a class above.</p>"; return; }
    var h = "<h2>" + esc(e.nm) + " <span class='muted'>d" + e.hd + " · " + esc(e.prime) + "</span></h2>";
    h += "<div class='row'><span class='lbl'>desc</span><textarea rows='2' data-core='desc'>" + esc(e.desc) + "</textarea></div>";
    h += "<div class='row'><span class='lbl'>gear</span><textarea rows='2' data-core='gear'>" + esc(e.gear) + "</textarea></div>";
    h += "<div class='row'><span class='lbl'>hit die</span><input type='number' style='width:70px' data-core='hd' value='" + e.hd + "'>" +
         "<span class='lbl' style='width:auto'>prime</span><input type='text' style='width:70px' data-core='prime' value='" + esc(e.prime) + "'>" +
         "<span class='lbl' style='width:auto'>stat priority</span><input type='text' style='width:260px' data-core='statPriority' value='" + esc(e.statPriority.join(", ")) + "'></div>";
    h += "<div class='row'><span class='lbl'>skill seeds</span><input type='text' style='width:340px' data-core='skillSeeds' value='" + esc(e.skillSeeds.join(", ")) + "' placeholder='2-3 signature skills (C5)'><span class='muted'>creation-only Familiar seeds</span></div>";
    h += "<h3>Starting abilities</h3>";
    e.abilities.forEach(function (a, i) { h += featRow(a, "ab." + i); });
    h += "<div><button data-add='ab'>+ ability</button></div>";
    if (e.spellTiers) {
      h += "<h3>Spell tier unlocks <span class='muted'>(tier → level; C2 picks)</span></h3><div class='row'>";
      Object.keys(e.spellTiers).sort(function (a, b) { return a - b; }).forEach(function (t) {
        h += "<span class='lbl' style='width:auto'>T" + t + " @ L</span><input type='number' style='width:60px' data-tier='" + t + "' value='" + e.spellTiers[t] + "'>";
      });
      h += "</div>";
    }
    if (e.spells) {
      h += "<h3>Spells by tier <span class='muted'>(names — mechanics live in capability_bible)</span></h3>";
      Object.keys(e.spells).sort(function (a, b) { var x = a === "cantrips" ? -1 : +a, y = b === "cantrips" ? -1 : +b; return x - y; }).forEach(function (t) {
        h += "<div class='tierhead'>" + (t === "cantrips" ? "Cantrips" : "Tier " + t) + (e.spells[t].length ? "" : " <span class='muted'>— blank</span>") + "</div>";
        h += "<div>" + chipList(e.spells[t], "sp." + t, true) + "</div>";
      });
    }
    h += levelBlock(e.levels, "lv", "Class features by level");
    h += "<h2>Archetypes</h2><p class='muted' style='margin:-4px 0 10px'>Each feature becomes a sentence the GM knows every turn — write things it can start a scene with, not bare numbers. Blast radius sets the level: yourself (L3–6) → the scene (L10–14) → the world (L18) → the story (L20).<br><b style='color:var(--acc)'>Enforceability ceiling:</b> generative is cheap, subtractive is expensive. Creating facts is native; UNWRITING them is not — the transcript is immutable and <code>[NPC_FORGET:]</code> (one NPC, one string) is the entire erasure toolkit. Scope \"they forget\" to what people KNOW, never to the record.</p>";
    e.archetypes.forEach(function (a, ai) {
      h += "<div class='arch'><h4>" + esc(a.nm) + "</h4>";
      h += "<div class='row'><span class='lbl'>desc</span><textarea rows='2' data-arch='" + ai + "' data-f='desc'>" + esc(a.desc) + "</textarea></div>";
      if (a.spellTiers) {
        h += "<div class='row'><span class='lbl'>tier unlocks</span>";
        Object.keys(a.spellTiers).sort(function (x, y) { return x - y; }).forEach(function (t) {
          h += "<span class='lbl' style='width:auto'>T" + t + " @ L</span><input type='number' style='width:60px' data-atier='" + ai + "." + t + "' value='" + a.spellTiers[t] + "'>";
        });
        h += "<span class='muted'>third-caster schedule</span></div>";
      }
      if (a.spells) {
        Object.keys(a.spells).sort(function (x, y) { var p = x === "cantrips" ? -1 : +x, q = y === "cantrips" ? -1 : +y; return p - q; }).forEach(function (t) {
          h += "<div class='tierhead'>" + (t === "cantrips" ? "Cantrips" : "Tier " + t) + "</div><div>" + chipList(a.spells[t], "asp." + ai + "." + t, true) + "</div>";
        });
      }
      h += levelBlock(a.levels, "al." + ai, "Archetype levels — each row has a defined job", true);
      h += "</div>";
    });
    $("main").innerHTML = h;
    wireClass();
  }
  function renderXp() {
    var h = "<h2>XP curve (1–20) <span class='muted'>L1–10 shipped verbatim · L11–20 draft</span></h2><div id='xp'>";
    CUR.data.xp.forEach(function (v, i) {
      h += "<div class='row'><span class='lbl'>L" + (i + 1) + "</span><input type='number' data-xp='" + i + "' value='" + v + "'" + (i === 0 ? " disabled" : "") + "></div>";
    });
    $("main").innerHTML = h + "</div>";
    var ins = $("main").querySelectorAll("input[data-xp]"), i;
    for (i = 0; i < ins.length; i++) ins[i].onchange = function () { CUR.data.xp[+this.getAttribute("data-xp")] = parseInt(this.value, 10) || 0; markDirty(); };
  }
  function target(path) {
    var p = path.split("."), e = CUR.data.bible[activeCls];
    if (p[0] === "ab") return { arr: e.abilities, i: +p[1] };
    if (p[0] === "lv") return { arr: e.levels[p[1]].features, i: +p[2] };
    if (p[0] === "al") return { arr: e.archetypes[+p[1]].levels[p[2]].features, i: +p[3] };
    if (p[0] === "sp") return { arr: e.spells[p[1]], i: +p[2] };
    if (p[0] === "asp") return { arr: e.archetypes[+p[1]].spells[p[2]], i: +p[3] };
    return null;
  }
  function wireClass() {
    var m = $("main"), i;
    var texts = m.querySelectorAll("input[data-p]");
    for (i = 0; i < texts.length; i++) texts[i].onchange = function () {
      var t = target(this.getAttribute("data-p"));
      if (t) { t.arr[t.i][this.getAttribute("data-f")] = this.value; markDirty(); render(); }
    };
    var dels = m.querySelectorAll("button[data-del]");
    for (i = 0; i < dels.length; i++) dels[i].onclick = function () {
      var t = target(this.getAttribute("data-del"));
      if (t) { t.arr.splice(t.i, 1); markDirty(); render(); }
    };
    var adds = m.querySelectorAll("button[data-add]");
    for (i = 0; i < adds.length; i++) adds[i].onclick = function () {
      var p = this.getAttribute("data-add").split("."), e = CUR.data.bible[activeCls], arr;
      if (p[0] === "ab") arr = e.abilities;
      else if (p[0] === "lv") arr = e.levels[p[1]].features;
      else arr = e.archetypes[+p[1]].levels[p[2]].features;
      arr.push({ nm: "", ds: "" }); markDirty(); render();
    };
    var chipdels = m.querySelectorAll("button[data-chipdel]");
    for (i = 0; i < chipdels.length; i++) chipdels[i].onclick = function () {
      var t = target(this.getAttribute("data-chipdel"));
      if (t) { t.arr.splice(t.i, 1); markDirty(); render(); }
    };
    var chipadds = m.querySelectorAll("input[data-chipadd]");
    for (i = 0; i < chipadds.length; i++) chipadds[i].onkeydown = function (ev) {
      if (ev.key !== "Enter" || !this.value.trim()) return;
      var t = target(this.getAttribute("data-chipadd") + ".0");
      if (t) { t.arr.push(this.value.trim()); markDirty(); render(); }
    };
    var cores = m.querySelectorAll("[data-core]");
    for (i = 0; i < cores.length; i++) cores[i].onchange = function () {
      var f = this.getAttribute("data-core"), e = CUR.data.bible[activeCls], v = this.value;
      if (f === "hd") e.hd = parseInt(v, 10) || e.hd;
      else if (f === "statPriority" || f === "skillSeeds") e[f] = v.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      else e[f] = v;
      markDirty();
    };
    var tiers = m.querySelectorAll("input[data-tier]");
    for (i = 0; i < tiers.length; i++) tiers[i].onchange = function () {
      CUR.data.bible[activeCls].spellTiers[this.getAttribute("data-tier")] = parseInt(this.value, 10) || 0; markDirty();
    };
    var atiers = m.querySelectorAll("input[data-atier]");
    for (i = 0; i < atiers.length; i++) atiers[i].onchange = function () {
      var p = this.getAttribute("data-atier").split(".");
      CUR.data.bible[activeCls].archetypes[+p[0]].spellTiers[p[1]] = parseInt(this.value, 10) || 0; markDirty();
    };
    var archs = m.querySelectorAll("textarea[data-arch]");
    for (i = 0; i < archs.length; i++) archs[i].onchange = function () {
      CUR.data.bible[activeCls].archetypes[+this.getAttribute("data-arch")][this.getAttribute("data-f")] = this.value; markDirty();
    };
    var badges = m.querySelectorAll(".badge");
    for (i = 0; i < badges.length; i++) badges[i].onclick = function () {
      var nm = this.getAttribute("data-nm");
      if (!nm) return;
      var st = resolveState(nm);
      if (st === "ok") { showCard(nm, capabilityLookup(nm)); return; }
      // cost defaults to a REAL value: no entry in the bible uses "N/A" for cost, because every
      // capability costs something (at-will / slot / passive / per-rest / per-day).
      var ak = addKey(nm);
      capForm(nm, ADD[ak] || { kind: "ability", tier: 0, cost: "passive", isMagical: false, category: ["martial"], range: "self", targets: "self", duration: "always on", save: "N/A", dice: "N/A", effect: "" },
        function (o) { ADD[ak] = o; markDirty(); render(); },
        ADD[ak] ? function () { delete ADD[ak]; markDirty(); render(); } : null);
    };
  }
  function showCard(nm, entry) {
    $("modal-box").innerHTML = (typeof bibleCardHTML === "function" ? bibleCardHTML(nm, entry) : "<pre>" + esc(JSON.stringify(entry, null, 2)) + "</pre>") +
      "<div style='margin-top:12px'><button id='m-close'>Close</button></div>";
    $("modal").style.display = "flex";
    $("m-close").onclick = closeModal;
  }

  // ── toolbar ───────────────────────────────────────────────────────────────
  $("open").onclick = openBible;
  $("save").onclick = saveBible;
  $("download").onclick = downloadCopy;
  $("discard").onclick = function () {
    if (!confirm("Discard the local draft and reload?")) return;
    try { localStorage.removeItem(DRAFT_K); } catch (e) {}
    location.reload();
  };
  $("reload").onclick = reloadFromDisk;
  $("clr-adds").onclick = function () {
    var merged = mergedAdds();
    if (!merged.length) return;
    if (!confirm("Clear " + merged.length + " staged addition(s) already in capability_bible?\n\n" +
      merged.join("\n") + "\n\nThese were merged into the bible, so the staged copies do nothing. " +
      "Additions NOT yet in the bible are kept.")) return;
    merged.forEach(function (k) { delete ADD[k]; });
    console.info("[bible] cleared merged additions: " + merged.join(", "));
    note("cleared " + merged.length + " already-merged addition(s)");
    markDirty(); render();
  };
  $("exp-adds").onclick = function () {
    var ks = Object.keys(ADD);
    if (!ks.length) { alert("No capability additions in this draft.\n\n(Open capability_bible.js directly to edit existing entries in place.)"); return; }
    var out = "// capability_bible additions from bible_editor — paste into CAPABILITY_BIBLE,\n// or open capability_bible.js here and add them directly.\n";
    ks.sort().forEach(function (k) { out += JSON.stringify(k) + ": " + JSON.stringify(ADD[k], null, 2) + ",\n"; });
    var b = new Blob([out], { type: "text/plain" }), a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "capability_additions.js.txt"; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 0);
  };
  // non-FSA fallback: a plain file input (import only; Save then downloads)
  var fi = document.createElement("input");
  fi.type = "file"; fi.accept = ".js"; fi.id = "file-input"; fi.style.display = "none";
  fi.onchange = function () {
    var f = fi.files && fi.files[0]; if (!f) return;
    f.text().then(function (txt) { try { loadFromText(txt, null, f.name); note("opened " + f.name + " (no handle — Save downloads)"); } catch (e) { alert(e.message); } });
  };
  document.body.appendChild(fi);

  // ── boot ──────────────────────────────────────────────────────────────────
  if (!loadDraft()) {
    // no draft: start from the globals the page already loaded, so the editor is never empty
    CUR = { typeId: "class", data: BIBLE_TYPES["class"].fromGlobals(), handle: null, name: "class_bible.js", dirty: false };
    activeCls = Object.keys(CUR.data.bible)[0];
  }
  render();
  // restore a previously-opened file handle. Permission does NOT survive a reload (the #30
  // lesson), so a lapsed handle is parked and re-granted inside the Reconnect click.
  if (HAS_FSA) _idbGet(FS_KEY).then(function (h) {
    if (!h || !h.queryPermission) return;
    _lastHandle = h;   // set REGARDLESS of permission: startIn is only a location hint, so a
                       // lapsed handle still points the picker at the right folder
    return h.queryPermission({ mode: "readwrite" }).then(function (p) {
      if (p === "granted") { CUR.handle = h; CUR.name = h.name; }
      else _pendingHandle = h;
      fileLine();
    });
  })["catch"](function (e) { console.warn("[bible] handle restore failed:", e && e.message); });
})();
</script>
</body>
</html>
