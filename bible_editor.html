<title>Bible Editor — bible authoring (dev tool)</title>
<!-- ─── BIBLE EDITOR (TODO #72) ────────────────────────────────────────────────────────────────
  The DEV-ONLY authoring surface for the *_bible files. Deliberately separate from
  bible_study.html (user call 2026-07-27): bible_study stays the read-only viewer because the
  bibles may become PLAYER-FACING, and players must never find a mutable surface there.

  v2 (2026-07-28, user call): OPEN a bible from disk and SAVE BACK OVER IT. The v1 download-only
  flow dropped exports in ~/Downloads, so a fill session ended with a manual file move — friction
  that scales badly across 234 slots and 175 capability entries. The File System Access API gives
  a real handle (verified working from file:// in Chromium), so Save overwrites the original in
  its own directory, behind a confirm. Download stays as the fallback for browsers without FSA.

  BIBLE TYPES ARE A REGISTRY (BIBLE_TYPES), not a set of branches: detect / parse / serialize /
  render per type. Adding the item bible later is ONE ENTRY, not new conditionals — the standing
  abstraction rule. Two types ship: class_bible (machine-regenerated wholesale) and
  capability_bible (HAND-COMMENTED: untouched entries are re-emitted VERBATIM so a save produces a
  minimal diff and every authored comment survives).

  The serializers between the ASCII markers are THE canonical writers. The BIBLE EDITOR CONTRACT
  (dev/run-tests.js) evals that slice and byte-compares serializeClassBible() for the pristine
  on-disk data against class_bible.js, so page and file can never silently disagree.

  Work-in-progress persists to localStorage (tnd_bible_editor_draft_v1) so a closed tab loses
  nothing; the v1 draft shape is migrated on load, never discarded.
──────────────────────────────────────────────────────────────────────────────────────────── -->
<style>

*{box-sizing:border-box;}
body{background:var(--bg);color:var(--t0);font:14px/1.5 Georgia,serif;margin:0;}
#bar{position:sticky;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.lvl.dropcue,.featlist.dropcue{border-color:var(--acc);background:#221c12;}

<!-- Engine data loads with a per-open cache-buster (2026-08-02): a browser-cached
     capability_bible.js made every recently-added spell render an ○ "no capability entry"
     badge — canon silently lied about, mid-triage. The satellite pages are network-first in
     the SW but their SUBRESOURCES are not, and Chrome caches file:// scripts too; a unique
     query per open defeats both. Editors open rarely — the extra fetch is noise. -->
<script>
(function(){var q="?fresh="+Date.now(),fs=["data.js","capability_bible.js","item_bible.js","helpers.js","class_bible.js"],i;
for(i=0;i<fs.length;i++)document.write('<script src="'+fs[i]+q+'"><\/script>');})();
</script>

<body>
<div id="bar">
  <h1>Bible Editor <span class="muted">dev tool</span></h1>

<script>
// >>> BIBLE SERIALIZER
// THE canonical writers. The BIBLE EDITOR CONTRACT (dev/run-tests.js) evals this slice and
// byte-compares serializeClassBible(<on-disk data>) against the on-disk file — header included —
// so editor and file can never silently disagree about the format.
function serializeClassBible(bible, xp) {
  var header = [
    "// ─── CLASS BIBLE (TODO #72) ─────────────────────────────────────────────────────────────────",
    "// THE single definitive source for character progression: classes, per-level features,",
    "// archetype spines (L3 identity / 6 / 10 / 14 / 18 / L20 capstone), spell tier lists, skill",
    "// seeds, and the 1-20 XP curve. Spec: DOC/Research/DOC_class_bible.html (R2 — all forks ruled",
    "// 2026-07-27: picks at tier-unlock levels; table extended to L20; creation-only skill seeds).",
    "//",
    "// ⚠ ENGINE-WIRED SINCE C6 (all three steps landed 2026-08-03, v1.533/v1.534): the engine reads",
    "// THIS file through classDef()/classDefs()/classFeaturesAt()/archFeaturesAt()/classXpLevels()",
    "// (helpers.js); the legacy class tables (CLSS/ABILS/CLASS_FEATURES/ARCHETYPES/STAT_PRIORITY/",
    "// XP_LEVELS) are DELETED. Creation spell-pick pools (SPELLS/ARCH_SPELLS, data.js) stay separate",
    "// until #72 C2 lands spell growth. Loaded by the app shell, the satellites, and the test harness.",
    "//",
    "// FORMAT RULES (the editor depends on them):",
    "//  · The data between the >>> <<< markers is machine-REGENERATED by bible_editor.html's",
    "//    exporter — no hand comments inside the markers (they would be lost on export).",
    "//  · Serialization is canonical: JSON.stringify(obj, null, 2). The BIBLE EDITOR CONTRACT",
    "//    (dev/run-tests.js) byte-compares a fresh serialize against this region, so a hand edit",
    "//    that breaks canonical form fails the build instead of silently fighting the editor.",
    "//  · Feature shape {nm, ds}: nm is the capability_bible key once the feature is authored",
    "//    there (the racial_caps pattern — mechanics live in ONE place); ds is legacy/summary",
    "//    prose. Empty features arrays are FILL-PHASE blanks, not errors.",
    "//  · spellTiers maps tier → unlock level (C2). Empty spell-tier arrays are fill-phase",
    "//    blanks. Half-caster (Ranger/Paladin) tiers are DRAFT pending the fill phase.",
    "//  · CLASS_XP_LEVELS 1-10 = the shipped XP_LEVELS verbatim; 11-20 = spec R2 draft numbers.",
    ""
  ].join("\n");
  return header +
    "// >>> CLASS BIBLE DATA\n" +
    "var CLASS_XP_LEVELS = " + JSON.stringify(xp) + ";\n" +
    "var CLASS_BIBLE = " + JSON.stringify(bible, null, 2) + ";\n" +
    "// <<< CLASS BIBLE DATA\n";
}
// capability_bible.js is HAND-COMMENTED and must never be regenerated wholesale. Everything
// outside the data block is carried verbatim, every comment line inside it is preserved in place,
// and an entry the user did not touch is re-emitted as its ORIGINAL SOURCE LINE. A save therefore
// produces a diff containing only what actually changed.
function serializeCapabilityBible(state) {
  var CAP_ORDER = ["kind","tier","cost","isMagical","category","range","targets","duration","save","dice","effect"];
  function emit(key, o) {
    var parts = [];
    for (var i = 0; i < CAP_ORDER.length; i++) {
      var k = CAP_ORDER[i];
      if (o[k] === undefined) continue;
      parts.push(k + ":" + JSON.stringify(o[k]));
    }
    return "  " + JSON.stringify(key) + ":{" + parts.join(",") + "}";
  }
  var out = [], i, e;
  for (i = 0; i < state.entries.length; i++) {
    e = state.entries[i];
    if (e.lead && e.lead.length) out = out.concat(e.lead);
    var body = e.dirty ? emit(e.key, e.obj) : e.line.replace(/,\s*$/, "");
    out.push(body + (i === state.entries.length - 1 ? "" : ","));
  }
  return state.prefix + out.join("\n") + state.suffix;
}
// item_bible.js is machine-REGENERATED wholesale (the class-bible pattern — its curation pass
// happens in this editor, so hand comments inside the data region have nowhere to live anyway).
// The BIBLE EDITOR CONTRACT byte-compares this writer's output against the on-disk file.
function serializeItemBible(bible) {
  var header = [
    "// ─── ITEM BIBLE (TODO #81) ──────────────────────────────────────────────────────────────────",
    "// Curated canon for mechanics-bearing carried items — the spell-bible pattern applied to gear.",
    "// RULED 2026-08-08 (user): GM-injection with curated definitions and PLAYER-CONFIRMED emergent",
    "// items — display-only rejected (zero hardening), model-authored write-once rejected (the first",
    "// hallucination becomes permanent canon).",
    "//",
    "// TYPE vs INSTANCE (the ruled schema constraint): this file defines the TYPE — what an",
    "// \"alchemist's fire\" IS. Instance state (charges left, provenance, owner, the \"x5\" count)",
    "// stays on the inventory entry string, never baked into a definition. An entry carrying",
    "// instance fields fails the engine build.",
    "//",
    "// Schema, fixed-attribute discipline (every entry carries the full set, \"N/A\" where",
    "// inapplicable — injected canon must never query empty). #157 adds two display fields:",
    "//   inventoryCategories — one or more of the seven ids (DISPLAY membership for the grouped",
    "//     inventory; always includes category; serialized in registry order; the FIRST registry",
    "//     match decides the section an item files under),",
    "//   aliases — exact alternate TYPE names, itemBaseName()-normalized, collision-refused —",
    "//     never substring, never fuzzy (an ambiguous name stays honestly Unclassified).",
    "// effect:\"N/A\" outside mundane/treasure is a LEGAL classification-only entry (#157): it",
    "// organizes the inventory and fills the tooltip but is NEVER injected as GM canon.",
    "//   { category: weapon|armor|consumable|tool|quest|treasure|mundane,",
    "//     effect:   what it DOES, mechanically, or \"N/A\",",
    "//     uses:     usage/recharge model of the TYPE (\"single use\", \"at-will\", \"1/day\", \"reusable\"),",
    "//     value:    typical price, or \"N/A\" }",
    "// mundane/treasure NEVER inject (buildItemBibleBlock, api.js) — they exist for the tooltip and",
    "// the viewer only. Keys are itemBaseName() output (helpers.js): lowercased, counts and",
    "// provenance clauses stripped. Reads go through itemLookup() (helpers.js) — the emergent",
    "// per-campaign overlay (worldState.itemBible, player-confirmed via [ITEM_DEF:]) wins over this",
    "// static base.",
    "//",
    "// FORMAT RULES (the editor depends on them):",
    "//  · The data between the >>> <<< markers is machine-REGENERATED by bible_editor.html's",
    "//    exporter — no hand comments inside the markers (they would be lost on export).",
    "//  · Serialization is canonical: JSON.stringify(obj, null, 2). The BIBLE EDITOR CONTRACT",
    "//    (dev/run-tests.js) byte-compares a fresh serialize against this file, so a hand edit",
    "//    that breaks canonical form fails the build instead of silently fighting the editor.",
    "//  · Content curation is the user's pass (the class-bible fill-phase pattern) — this seed set",
    "//    is the t1431 party inventory's clearly mechanics-bearing items plus staple archetypes.",
    ""
  ].join("\n");
  // #157: canonical form is STRUCTURAL — every entry re-emitted in the fixed field order
  // (category, inventoryCategories, aliases, effect, uses, value), legacy entries normalized to
  // the full shape ([category] / []), and inventoryCategories sorted in registry order. The
  // BIBLE EDITOR CONTRACT byte-compares this output against the file, so drift cannot ship.
  var _ord = ["weapon", "armor", "quest", "consumable", "tool", "treasure", "mundane"];
  var canon = {}, ks = Object.keys(bible), ki, oi;
  for (ki = 0; ki < ks.length; ki++) {
    var se = bible[ks[ki]];
    var inv = (se.inventoryCategories instanceof Array && se.inventoryCategories.length) ? se.inventoryCategories.slice() : [se.category];
    if (inv.indexOf(se.category) < 0) inv.push(se.category);
    var sortedInv = [];
    for (oi = 0; oi < _ord.length; oi++) { if (inv.indexOf(_ord[oi]) >= 0) sortedInv.push(_ord[oi]); }
    canon[ks[ki]] = {
      category: se.category,
      inventoryCategories: sortedInv,
      aliases: (se.aliases instanceof Array) ? se.aliases.slice().sort() : [],
      effect: se.effect, uses: se.uses, value: se.value
    };
  }
  return header +
    "// >>> ITEM BIBLE DATA\n" +
    "var ITEM_BIBLE = " + JSON.stringify(canon, null, 2) + ";\n" +
    "// <<< ITEM BIBLE DATA\n";
}
// <<< BIBLE SERIALIZER

(function () {
  var DRAFT_K = "tnd_bible_editor_draft_v1";
  var FS_IDB = "tnd_bible_fs_v1", FS_STORE = "handles", FS_KEY = "bibleFile", FS_CAP_KEY = "capBibleFile";
  var CUR = null;        // {typeId, data, handle, name, dirty}
  var ADD = {}, activeCls = null, capFilter = "", itemFilter = "";
  var _dragPath = null;  // feature-row path being dragged via its ⋮⋮ grip (null = no drag in flight)
  var _capHandle = null; // capability_bible.js's OWN handle (the card's Update Bible write path)
  var _pendingHandle = null;   // restored but not yet re-permissioned (the #30 pattern)
  var _lastHandle = null;
  var _openedMtime = 0;      // [diag] file timestamp observed when this handle last read the file      // last bible handle seen, permissioned or not — the picker's startIn seed

  function $(id) { return document.getElementById(id); }
  function esc(s) { return escHtml(String(s == null ? "" : s)); }
  function deep(o) { return JSON.parse(JSON.stringify(o)); }

  // ── bible type REGISTRY — adding the item bible later is one entry ────────
  var BIBLE_TYPES = {
    "class": {
      label: "Class bible",
      detect: function (src) { return /var\s+CLASS_BIBLE\s*=/.test(src); },
      parse: function (src) {
        var v = new Function(src + "\nreturn {b:CLASS_BIBLE,x:CLASS_XP_LEVELS};")();
        return { bible: v.b, xp: v.x };
      },
      serialize: function (d) { return serializeClassBible(d.bible, d.xp); },
      fromGlobals: function () { return { bible: deep(CLASS_BIBLE), xp: CLASS_XP_LEVELS.slice() }; },
      render: renderClass, tabs: classTabs
    },
    "item": {
      label: "Item bible",
      detect: function (src) { return /var\s+ITEM_BIBLE\s*=/.test(src); },
      parse: function (src) {
        var v = new Function(src + "\nreturn ITEM_BIBLE;")();
        return { bible: v };
      },
      serialize: function (d) { return serializeItemBible(d.bible); },
      fromGlobals: function () { return { bible: deep(ITEM_BIBLE) }; },
      render: renderItems, tabs: function () { $("tabs").innerHTML = ""; }
    },
    "capability": {
      label: "Capability bible",
      detect: function (src) { return /var\s+CAPABILITY_BIBLE\s*=/.test(src); },
      parse: function (src) {
        var norm = src.replace(/\r\n/g, "\n"), lines = norm.split("\n"), i;
        var start = -1, end = -1;
        for (i = 0; i < lines.length; i++) if (/^var\s+CAPABILITY_BIBLE\s*=\s*\{/.test(lines[i])) { start = i; break; }
        for (i = start + 1; i < lines.length; i++) if (/^\};/.test(lines[i])) { end = i; break; }
        if (start < 0 || end < 0) throw new Error("could not find the CAPABILITY_BIBLE data block");
        var vals = new Function(norm + "\nreturn CAPABILITY_BIBLE;")();
        var entries = [], lead = [];
        for (i = start + 1; i < end; i++) {
          var l = lines[i], m = l.match(/^\s*"([^"]+)"\s*:\s*\{/);
          if (m) { entries.push({ key: m[1], line: l, obj: vals[m[1]], lead: lead, dirty: false }); lead = []; }
          else lead.push(l);
        }
        return { prefix: lines.slice(0, start + 1).join("\n") + "\n", suffix: "\n" + lines.slice(end).join("\n"), entries: entries, trailing: lead };
      },
      serialize: function (d) { return serializeCapabilityBible(d); },
      fromGlobals: null,   // capability_bible must be OPENED — it is never rebuilt from globals
      render: renderCap, tabs: function () { $("tabs").innerHTML = ""; }
    }
  };
  function typeOf(src) {
    for (var k in BIBLE_TYPES) if (BIBLE_TYPES[k].detect(src)) return k;
    return null;
  }

  // ── File System Access: open a handle, write back over it ─────────────────
  function _idbOpen() {
    return new Promise(function (res, rej) {
      if (typeof indexedDB === "undefined") { rej(new Error("no indexedDB")); return; }
      var rq = indexedDB.open(FS_IDB, 1);
      rq.onupgradeneeded = function () { var db = rq.result; if (!db.objectStoreNames.contains(FS_STORE)) db.createObjectStore(FS_STORE); };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error || new Error("indexedDB open failed")); };
    });
  }
  function _idbPut(k, v) { return _idbOpen().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction(FS_STORE, "readwrite"); tx.objectStore(FS_STORE).put(v, k); tx.oncomplete = function () { res(true); }; tx.onerror = function () { rej(tx.error); }; }); }); }
  function _idbGet(k) { return _idbOpen().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction(FS_STORE, "readonly"); var rq = tx.objectStore(FS_STORE).get(k); rq.onsuccess = function () { res(rq.result || null); }; rq.onerror = function () { rej(rq.error); }; }); }); }
  // Without a delete, a handle that has gone DEAD is cached forever and restored on every boot —
  // so closing the tab and relaunching resurrects the exact handle that cannot write, which is
  // what made saving look permanently broken (user, 2026-07-28: "it's always blocked somehow").
  function _idbDel(k) { return _idbOpen().then(function (db) { return new Promise(function (res, rej) { var tx = db.transaction(FS_STORE, "readwrite"); tx.objectStore(FS_STORE)["delete"](k); tx.oncomplete = function () { res(true); }; tx.onerror = function () { rej(tx.error); }; }); }); }

  var HAS_FSA = (typeof window.showOpenFilePicker === "function");
  var BIBLE_SRV = "http://127.0.0.1:7373";   // dev/bible-server.js — THE save path when running

  // ── per-run write token (ChatGPT review 2026-08-01) ────────────────────────
  // The server refuses /install without the token it printed at startup — the guard against a
  // drive-by page POSTing to localhost while the server runs. Asked for ONCE per browser
  // session (sessionStorage); a 403 means the server restarted with a fresh token, so re-ask
  // once and retry. A cancelled prompt aborts the save LOUDLY via the caller's error path.
  function srvToken(forceAsk) {
    var k = "tnd_bible_srv_tok_v1", t = null;
    try { t = sessionStorage.getItem(k); } catch (e) {}
    if (forceAsk || !t) {
      t = prompt("bible-server write token (printed in the server's terminal at startup):", t || "");
      if (t === null) return null;             // user cancelled
      t = t.trim();
      try { sessionStorage.setItem(k, t); } catch (e) {}
    }
    return t;
  }
  // The ONE way this page POSTs /install — absorbs a 403 with a single ask-and-retry. Every
  // save path routes through here (contract-pinned). #72 overhaul (2026-08-14): TOKENLESS
  // FIRST — the server allow-lists local origins, so served pages (localhost / 127.0.0.1)
  // write with zero ceremony; the token prompt survives only for file:// pages and is asked
  // AFTER a 403, never pre-emptively. The token-paste is gone from the recommended workflow.
  function srvInstall(body) {
    function post(tok) {
      var h = { "Content-Type": "text/plain" };
      if (tok) h["X-Bible-Token"] = tok;
      return fetch(BIBLE_SRV + "/install", { method: "POST", headers: h, body: body });
    }
    var stored = null;
    try { stored = sessionStorage.getItem("tnd_bible_srv_tok_v1"); } catch (e) {}
    return post(stored).then(function (r) {
      if (r.status !== 403) return r;
      var t2 = srvToken(true);                 // file:// page (or stale token) — ask once
      if (t2 === null) return r;               // cancelled: let the 403 JSON surface loudly
      return post(t2);
